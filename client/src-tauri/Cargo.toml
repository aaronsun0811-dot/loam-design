[package]
name = "loam"
version = "0.1.0"
description = "Loam desktop client"
authors = ["Loam"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "loam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
