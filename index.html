        background: transparent;

        font: inherit;
        text-align: left;
        cursor: pointer;

      .ai-chat-context-menu button:hover {
        background: #78c6ff;
        color: #ffffff;
      }

      .ai-chat-context-menu button.danger {
        color: #b42318;

      .ai-market-overlay {

        min-height: 0;
        padding: 18px;

      .ai-market-top,
      .ai-market-tabs,
      .ai-market-categories,
      .ai-market-card-foot {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .ai-market-top {
        justify-content: space-between;
        min-width: 0;
      }

      .ai-market-title {
        display: grid;
        gap: 3px;
        min-width: 0;
      }

      .ai-market-title strong {
        font-size: 22px;
        letter-spacing: 0;
      }

      .ai-market-title span {
        color: var(--muted);
        font-size: 12px;
      }

      .ai-market-control {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 360px;
      }

      .ai-market-search {
        position: relative;
        flex: 1;
        min-width: 180px;
      }

      .ai-market-search svg {
        position: absolute;
        top: 50%;
        left: 11px;
        width: 15px;
        height: 15px;
        transform: translateY(-50%);
        color: var(--muted);
      }

      .ai-market-search input {
        width: 100%;
        height: 36px;
        padding: 0 12px 0 34px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #ffffff;
        color: var(--text);
        font: inherit;
        outline: 0;
      }

      .ai-market-tabs {
        width: fit-content;
        padding: 3px;
        border-radius: 999px;
        background: rgba(42, 38, 32, 0.06);
      }

      .ai-market-tab,
      .ai-market-chip,
      .ai-market-action {
        border: 0;
        color: var(--soft);
        font: inherit;
        cursor: pointer;
      }

      .ai-market-tab {
        min-height: 30px;
        padding: 0 12px;
        border-radius: 999px;
        background: transparent;
        font-size: 13px;
        font-weight: 700;
      }

      .ai-market-tab.active,
      .ai-market-chip.active {
        background: #244734;
        color: #ffffff;
      }

      .ai-market-categories {
        flex-wrap: wrap;
        min-height: 34px;
        overflow: hidden;
      }

      .ai-market-chip {
        min-height: 28px;
        padding: 0 12px;
        border-radius: 999px;
        background: rgba(77, 138, 63, 0.09);
        font-size: 12px;
        font-weight: 700;
      }

      .ai-market-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        align-content: start;
        gap: 14px;
        min-height: 0;
        overflow: auto;
        padding: 2px 2px 24px;
      }

      .ai-market-card {
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 12px;
        min-width: 0;
        min-height: 176px;
        padding: 18px 18px 14px;
        border: 1px solid rgba(42, 38, 32, 0.09);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 10px 28px rgba(42, 38, 32, 0.045);
      }

      .ai-market-card-head {
        display: grid;
        grid-template-columns: 50px 1fr auto;
        align-items: start;
        gap: 12px;
        min-width: 0;
      }

      .ai-market-icon {
        display: grid;
        place-items: center;
        width: 50px;
        height: 50px;
        border-radius: 8px;
        background: var(--active-bg);
        color: #244734;
      }

      .ai-market-icon svg {
        width: 22px;
        height: 22px;
      }

      .ai-market-card h3 {
        margin: 0;
        overflow: hidden;
        color: var(--text);
        font-size: 15px;
        letter-spacing: 0;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .ai-market-card p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.65;
      }

      .ai-market-badge {
        display: inline-flex;
        align-items: center;
        min-height: 20px;
        padding: 0 6px;
        border-radius: 6px;
        background: rgba(42, 38, 32, 0.06);
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
      }

      .ai-market-badge.installed {
        background: rgba(77, 138, 63, 0.13);
        color: var(--green);
      }

      .ai-market-card-foot {
        justify-content: space-between;
        padding-top: 12px;
        border-top: 1px solid rgba(42, 38, 32, 0.07);
      }

      .ai-market-card-actions {
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }

      .ai-market-card-foot small {
        color: var(--muted);
        font-size: 12px;
      }

      .ai-market-action {
        min-height: 30px;
        padding: 0 13px;
        border-radius: 999px;
        background: #244734;
        color: #ffffff;
        font-size: 12px;
        font-weight: 700;
      }

      .ai-market-action.secondary {
        background: rgba(42, 38, 32, 0.07);
        color: var(--soft);
      }

      .ai-market-empty {
        display: grid;
        place-items: center;
        min-height: 240px;
        border: 1px dashed var(--line-strong);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.64);
        color: var(--muted);
      }

      .ai-chat-context-menu button.danger:hover {
        background: #f04438;
        color: #ffffff;
      }

      @media (max-width: 900px) {
        .settings-window {
          grid-template-columns: 1fr;
          height: calc(100vh - 34px);
          width: calc(100vw - 28px);
        }

        .settings-sidebar-panel {
          display: flex;
          min-height: 76px;
          gap: 6px;
          overflow-x: auto;
          border-right: 0;
          border-bottom: 1px solid #dfdad1;
        }

        .settings-group-label {
          display: none;
        }

        .settings-nav {
          flex: 0 0 auto;
          width: auto;
          min-width: max-content;
        }

        .settings-provider-grid {
          grid-template-columns: 1fr;
        }

        .provider-api-summary,
        .provider-api-fields {
          grid-template-columns: 1fr;
        }

        .ai-chat-workspace,
        .window.ribbon-open .ai-chat-workspace {
          left: 0;
          grid-template-columns: 1fr;
          overflow: auto;
        }

        .ai-chat-history,
        .ai-chat-main,
        .ai-chat-skills {
          min-height: 280px;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .template-toolbar,
        .template-workbench,
        .template-builder-grid {
          grid-template-columns: 1fr;
        }
      }

      .image-prompt-label {
        display: grid;
        gap: 8px;
        color: var(--soft);
        font-size: 13px;
        font-weight: 700;
      }

      .image-prompt-label textarea {
        width: 100%;
        min-height: 118px;
        resize: vertical;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        outline: 0;
        background: var(--canvas-bg);
        color: var(--text);
        font: 14px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .image-prompt-label textarea[readonly] {
        cursor: default;
        color: var(--soft);
      }

      .image-count-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .image-count-row .mini-action {
        min-width: 46px;
        justify-content: center;
      }

      .palette-panel {
        width: min(640px, calc(100vw - 32px));
        overflow: hidden;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 28px 90px rgba(39, 34, 26, 0.18);
      }

      .palette-search {
        display: grid;
        grid-template-columns: 20px 1fr auto;
        gap: 12px;
        align-items: center;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
      }

      .palette-search input {
        width: 100%;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--text);
        font-size: 15px;
      }

      .kbd {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        padding: 0 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--list-bg);
        color: var(--muted);
        font-size: 12px;
      }

      .palette-list {
        display: grid;
        gap: 4px;
        max-height: 420px;
        overflow: auto;
        padding: 8px;
      }

      .palette-item {
        display: grid;
        grid-template-columns: 28px 1fr auto;
        gap: 10px;
        align-items: center;
        min-height: 52px;
        padding: 0 10px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        text-align: left;
      }

      .palette-item:hover,
      .palette-item.active {
        background: rgba(126, 227, 108, 0.08);
      }

      .palette-item strong {
        display: block;
        font-size: 14px;
      }

      .palette-item span {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 12px;
      }

      .palette-item .kbd {
        display: inline-flex;
        margin-top: 0;
      }

      .import-export-page {
        max-width: 980px;
      }

      .import-export-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 18px;
      }

      .import-export-card {
        display: grid;
        gap: 12px;
        min-height: 178px;
        align-content: start;
      }

      .import-export-card p {
        margin: 0;
        color: var(--muted);
        line-height: 1.65;
      }

      .import-export-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 2px;
      }

      .import-export-log {
        margin-top: 16px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.7);
        color: var(--soft);
        font-size: 13px;
        line-height: 1.7;
        white-space: pre-wrap;
      }

      @media (max-width: 1320px) {
        .window {
          grid-template-columns: 56px var(--note-list-width) minmax(430px, 1fr) 44px;
        }

        .window.ribbon-open {
          grid-template-columns: 172px var(--note-list-width) minmax(390px, 1fr) 44px;
        }

      .window.right-open {
          grid-template-columns: 56px var(--note-list-width) minmax(390px, 1fr) var(--right-panel-width);
        }

        .window.ribbon-open.right-open {
          grid-template-columns: 172px var(--note-list-width) minmax(360px, 1fr) var(--right-panel-width);
        }
      }

      @media (max-width: 980px) {
        body {
          overflow: auto;
        }

        .app-shell {
          height: auto;
          min-height: 100vh;
        }

        .window {
          display: block;
          height: auto;
          min-height: calc(100vh - 12px);
        }

        .window.ribbon-open {
          display: block;
        }

        .sidebar {
          padding: 18px 14px 14px;
        }

        .mobile-brief {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 8px;
          margin: 0 6px 14px;
        }

        .brief-card {
          min-height: 74px;
          padding: 12px;
          border: 1px solid var(--line);
          border-radius: 8px;
          background: rgba(255, 255, 255, 0.035);
        }

        .brief-card strong {
          display: block;
          font-size: 18px;
        }

        .brief-card span {
          display: block;
          margin-top: 6px;
          color: var(--muted);
          font-size: 12px;
        }

        .primary-nav {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .primary-nav .nav-item {
          justify-content: center;
          padding: 0 8px;
        }

        .window.ribbon-open .primary-nav {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .space-nav,
        .sidebar .section-row,
        .tag-cloud {
          display: none;
        }

        .tools {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 8px;
          margin-top: 12px;
        }

        .tool-item {
          justify-content: center;
          padding: 0 8px;
        }

        .sidebar,
        .note-list,
        .editor {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .note-list,
        .editor {
          padding-top: 24px;
        }

        .file-resizer {
          display: none;
        }

        .ai-scroll {
          height: auto;
        }

        .ai-draft,
        .router-grid {
          grid-template-columns: 1fr;
        }

        .note-editor {
          height: 360px;
          min-height: 360px;
        }

        .edit-surface.split-mode {
          grid-template-columns: 1fr;
        }

        .note-preview {
          height: 360px;
          max-height: 320px;
          border-top: 1px solid var(--line);
          border-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <section class="window" aria-label="Loam app mockup">
        <aside class="sidebar">
          <div class="traffic">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot lime"></span>
          </div>

          <div class="brand-row">
            <div class="brand">
              <strong>Loam</strong>
              <span>⌄</span>
            </div>
            <button class="icon-button" aria-label="新建笔记"><i data-lucide="square-pen"></i></button>
          </div>

          <button class="icon-button ribbon-toggle" data-ribbon-toggle aria-label="展开侧边栏" title="展开侧边栏">
            <i data-lucide="panel-left"></i>
            <span class="button-label">展开名称</span>
          </button>

          <div class="mobile-brief" aria-label="今日概览">
            <div class="brief-card">
              <strong>12</strong>
              <span>反向链接</span>
            </div>
            <div class="brief-card">
              <strong>3</strong>
              <span>AI 资产</span>
            </div>
          </div>

          <nav class="nav primary-nav" aria-label="Ribbon">
            <button class="nav-item" data-page="graph" aria-label="查看关系图谱" title="查看关系图谱"><i data-lucide="git-fork"></i><span>图谱</span></button>
            <button class="nav-item" data-detail="canvas:新白板" aria-label="新建白板" title="新建白板"><i data-lucide="layout-grid"></i><span>白板</span></button>
            <button class="nav-item" data-page="daily" aria-label="打开今天的日记" title="打开今天的日记"><i data-lucide="calendar-days"></i><span>日记</span></button>
            <button class="nav-item" data-page="templates" aria-label="插入模板" title="插入模板"><i data-lucide="boxes"></i><span>模板</span></button>
            <button class="nav-item active" data-command="palette" aria-label="打开命令面板" title="打开命令面板"><i data-lucide="command"></i><span>命令</span></button>
            <button class="nav-item" data-detail="database:新数据库" aria-label="新建数据库" title="新建数据库"><i data-lucide="database"></i><span>数据库</span></button>
            <button class="nav-item" data-obsidian-action="ai-chat" aria-label="打开 AI Chat" title="打开 AI Chat"><i data-lucide="sparkles"></i><span>AI</span></button>
          </nav>

          <div class="section-row">
            <span>空间</span>
            <span>＋</span>
          </div>
          <div class="nav space-nav">
            <button class="space-item active" data-space-label="写作" aria-label="写作空间"><span class="space-dot green-dot"></span><span class="space-label">写作</span><span class="space-count">0</span></button>
          </div>

          <div class="section-row">
            <span>标签</span>
          </div>
          <div class="tag-cloud" aria-label="标签">
            <span class="tag">方法论</span>
            <span class="tag">AI</span>
            <span class="tag">产品</span>
            <span class="tag">知识管理</span>
            <span class="tag">卡片盒</span>
            <span class="tag">脚本</span>
          </div>

          <div class="tools">
            <button class="tool-item" data-page="import-export" aria-label="导入导出" title="导入导出"><i data-lucide="arrow-up-down"></i><span>导入导出</span></button>
            <button class="tool-item" data-page="settings" aria-label="设置" title="设置"><i data-lucide="settings"></i><span>设置</span></button>
          </div>
        </aside>

        <section class="ai-chat-workspace" id="aiChatWorkspace" aria-label="Loam AI 对话" hidden></section>

        <aside class="note-list">
          <button class="file-resizer" data-file-resizer aria-label="拖拽调整左侧文件列表宽度"></button>
          <div class="file-pane-head">
            <div class="vault-line">
              <button class="icon-button" data-obsidian-action="go-back" aria-label="返回"><i data-lucide="chevron-left"></i></button>
              <div class="list-title">
                <i data-lucide="folder"></i>
                <span id="vaultPathLabel">文件储存：/Users/seek/Documents/loam-design</span>
              </div>
              <div class="vault-actions">
                <button class="icon-button" data-create-folder aria-label="新建文件夹"><i data-lucide="plus"></i><span>新建</span></button>
                <button class="icon-button" data-search-toggle aria-label="搜索"><i data-lucide="search"></i><span>搜索</span></button>
              </div>
            </div>
            <div class="pane-tab-row" aria-label="左侧面板">

            <span>方法论</span>
            <span>/</span>

              <button class="mini-action" data-editor-command="save"><i data-lucide="file-text"></i><span>保存</span></button>
              <button class="mini-action" data-editor-command="export"><i data-lucide="arrow-up-down"></i><span>导出 MD</span></button>

                  <button data-action="polish"><i data-lucide="sparkles"></i><span>润色</span></button>

                  <button data-note-tool="generate-image"><i data-lucide="image-plus"></i><span>生成图片</span></button>
                  <button data-action="video"><i data-lucide="clapperboard"></i><span>视频</span></button>
                  <button data-note-tool="anti-ai"><i data-lucide="shield-alert"></i><span>反 AI 检测</span></button>
                  <button data-note-tool="favorite"><i data-lucide="star"></i><span>收藏</span></button>

      function providerPrecisionDefault(name) {
        const isVideo = videoModelOptions.includes(name);
        const isImage = imageModelOptions.includes(name) && !textModelOptions.includes(name);
        const base = providerPresetDefinitions.precise;
        if (name === "文心 ERNIE") {
          const ernie = providerPresetDefinitions.ernieDefault;
          return { preset: "ernieDefault", temperature: ernie.temperature, topP: ernie.topP, maxOutputTokens: ernie.maxOutputTokens, responseFormat: ernie.responseFormat, precisionRules: ernie.precisionRules };
        }
        if (name === "Kimi") {
          return { preset: "precise", temperature: "1", topP: "0.95", maxOutputTokens: "2000", responseFormat: "text", precisionRules: base.precisionRules || providerPrecisionRules };
        }
        if (isVideo) {
          return { preset: "precise", temperature: "0.18", topP: "0.75", maxOutputTokens: "2400", responseFormat: "text", precisionRules: base.precisionRules || providerPrecisionRules };
        }
        if (isImage) {
          return { preset: "precise", temperature: "0.12", topP: "0.72", maxOutputTokens: "1600", responseFormat: "text", precisionRules: base.precisionRules || providerPrecisionRules };
        }
        return { preset: "precise", temperature: base.temperature, topP: base.topP, maxOutputTokens: base.maxOutputTokens, responseFormat: base.responseFormat, precisionRules: base.precisionRules || providerPrecisionRules };
      }

      function providerPresetOptions(selected = "precise", providerName = "") {
        const keys = [...(providerPresetKeyGroups[providerName] || []), ...providerPresetKeyGroups.general];
        return keys
          .filter((key, index) => keys.indexOf(key) === index && providerPresetDefinitions[key])
          .map((key) => [key, providerPresetDefinitions[key]])
          .map(([key, preset]) => `<option value="${escapeHtml(key)}"${key === selected ? " selected" : ""}>${escapeHtml(preset.label)}</option>`)
          .join("");
      }

      function providerRequiresTemperatureOne(name, model = "") {
        return name === "Kimi" && /^kimi-k2/i.test(String(model || ""));
      }

      function providerForcedTopP(name, model = "") {
        return providerRequiresTemperatureOne(name, model) ? "0.95" : "";
      }

      function applyProviderPresetToCard(card, presetKey) {
        const preset = providerPresetDefinitions[presetKey] || providerPresetDefinitions.precise;
        const setField = (key, value) => {
          const field = card?.querySelector(`[data-api-field="${key}"]`);
          if (field) field.value = value;
        };
        const providerName = card?.dataset.providerName || "";
        const model = card?.querySelector('[data-api-field="defaultModel"]')?.value || "";
        setField("temperature", providerRequiresTemperatureOne(providerName, model) ? "1" : preset.temperature);
        setField("topP", providerForcedTopP(providerName, model) || preset.topP);
        setField("maxOutputTokens", preset.maxOutputTokens);
        setField("responseFormat", preset.responseFormat || "text");
        setField("precisionRules", preset.precisionRules);
        if (preset.extraParams !== undefined) setField("extraParams", preset.extraParams);
      }

      function clampDecimalString(value, fallback, min = 0, max = 1) {
        const number = Number(value);
        if (!Number.isFinite(number)) return fallback;
        return String(Math.min(max, Math.max(min, number)));
      }

        const row = modelRouteRows.find(([key]) => key === routeKey);
        const group = row?.[3] || "text";

      function providerApiStoreKey() {
        return "loam-provider-api-configs";

      function providerApiDefault(name) {
        const config = providerApiDefaults[name] || {};
        const precision = providerPrecisionDefault(name);
        return {
          name,
          apiKey: "",
          baseUrl: config.baseUrl || "",
          testPath: config.testPath || "/models",
          defaultModel: config.defaultModel || "",
          preset: precision.preset,

          responseFormat: precision.responseFormat,
          precisionRules: precision.precisionRules,

          status: config.baseUrl ? "未测试" : "未配置",

          testedAt: "",
        };
      }

      function normalizeProviderApiConfig(name, config = {}) {
        const defaults = providerApiDefault(name);
        const status = String(config.status || defaults.status);
        const storedModel = String(config.defaultModel ?? defaults.defaultModel).trim();
        // Respect whatever model name the user typed; don't silently override even if it matches
        // a "legacy" default. Auto-overriding caused the Kimi-but-DeepSeek-answers bug because
        // user-entered moonshot-v1-8k kept being reset to kimi-k2.6 (which can fail at the API).
        const defaultModel = storedModel || defaults.defaultModel;
        const precision = providerPrecisionDefault(name);
        const preset = providerPresetDefinitions[config.preset] ? config.preset : defaults.preset || "precise";
        const temperature = providerRequiresTemperatureOne(name, defaultModel)
          ? "1"
          : clampDecimalString(config.temperature ?? defaults.temperature, precision.temperature, 0, 2);
        const topP = providerForcedTopP(name, defaultModel)
          || clampDecimalString(config.topP ?? defaults.topP, precision.topP, 0, 1);
        return {
          ...defaults,
          ...config,
          name,
          apiKey: String(config.apiKey || ""),
          baseUrl: String(config.baseUrl ?? defaults.baseUrl).trim(),
          testPath: String(config.testPath ?? defaults.testPath).trim() || "/models",
          defaultModel,
          preset,
          temperature,
          topP,
          maxOutputTokens: String(config.maxOutputTokens ?? defaults.maxOutputTokens).replace(/[^\d]/g, "") || precision.maxOutputTokens,
          responseFormat: ["text", "json_object", "json_schema"].includes(config.responseFormat) ? config.responseFormat : defaults.responseFormat || "text",
          precisionRules: String(config.precisionRules || defaults.precisionRules || precision.precisionRules).trim(),
          extraParams: String(config.extraParams ?? defaults.extraParams ?? providerAdvancedDefaultText(name)).trim(),
          status,
          message: String(config.message || defaults.message),
          testedAt: String(config.testedAt || ""),
        };
      }

      let _providerApiConfigsCache = null;
      const _testingProviders = new Set();

      function getProviderApiConfigs() {
        if (_providerApiConfigsCache) return _providerApiConfigsCache;
        try {
          const stored = JSON.parse(safeStorageGetItem(providerApiStoreKey()) || "{}");
          _providerApiConfigsCache = Object.fromEntries(
            providerModelCatalog.map(([name]) => [name, normalizeProviderApiConfig(name, stored[name] || {})])
          );
        } catch {
          _providerApiConfigsCache = Object.fromEntries(providerModelCatalog.map(([name]) => [name, providerApiDefault(name)]));
        }
        return _providerApiConfigsCache;
      }

      function apiModelForProvider(provider) {
        const configs = getProviderApiConfigs();
        return configs[provider]?.defaultModel || providerApiDefaults[provider]?.defaultModel || provider;
      }

      function providerModelDisplayName(provider) {
        const apiModel = apiModelForProvider(provider);
        return apiModel && apiModel !== provider ? `${provider} / ${apiModel}` : provider;
      }

      function aiRuntimeDisplayName(provider) {
        return `API · ${providerModelDisplayName(provider)}`;
      }

      function saveProviderApiConfigs(configs) {
        _providerApiConfigsCache = null;
        safeStorageSetItem(providerApiStoreKey(), JSON.stringify(configs || {}));
      }

      function apiStatusClass(status) {
        if (status === "已连接") return "connected";
        if (status === "测试中") return "testing";
        if (status === "鉴权失败") return "warning";
        if (status === "连接失败" || status === "地址错误" || status === "Key 错误") return "error";
        return "";
      }

      function providerApiCardElement(name) {
        return $$("[data-api-provider-card]").find((card) => card.dataset.providerName === name);
      }

      function providerApiKeyError(apiKey = "") {
        const key = String(apiKey || "").trim();
        if (!key) return "";
        if (/[\r\n\t]/.test(key)) return "API Key 不能包含换行或制表符，请重新复制官网 Key。";
        if (/\s/.test(key)) return "API Key 不能包含空格，请只保留官网 Key 本身。";
        if (/[^\x00-\xff]/.test(key)) return "API Key 不能包含中文或全角字符，请只粘贴官网生成的 Key。";
        return "";
      }

      function cleanProviderApiKey(apiKey = "") {
        const raw = String(apiKey || "").trim();
        if (!raw || !providerApiKeyError(raw)) return raw;
        const candidates = raw.match(/[A-Za-z0-9][A-Za-z0-9._-]{10,}/g) || [];
        const preferred = candidates.find((item) => /^sk-[A-Za-z0-9._-]{8,}$/.test(item)) || candidates.find((item) => item.length >= 16);
        return preferred && !providerApiKeyError(preferred) ? preferred : raw;
      }

      function collectProviderApiConfig(name) {
        const configs = getProviderApiConfigs();
        const card = providerApiCardElement(name);
        if (!card) return configs[name] || providerApiDefault(name);
        const fieldEl = (key) => $(`[data-api-field="${key}"]`, card);
        const field = (key) => fieldEl(key)?.value?.trim() || "";
        const apiKeyInput = fieldEl("apiKey");
        const rawApiKey = apiKeyInput?.value || "";
        const apiKey = cleanProviderApiKey(rawApiKey);
        if (apiKeyInput && apiKey && apiKey !== rawApiKey.trim() && !providerApiKeyError(apiKey)) {
          apiKeyInput.value = apiKey;
        }
        const defaultModel = field("defaultModel");
        const temperatureInput = fieldEl("temperature");
        const temperature = providerRequiresTemperatureOne(name, defaultModel) ? "1" : field("temperature");
        if (temperatureInput && temperatureInput.value !== temperature) temperatureInput.value = temperature;
        const topPInput = fieldEl("topP");
        const topP = providerForcedTopP(name, defaultModel) || field("topP");
        if (topPInput && topPInput.value !== topP) topPInput.value = topP;
        return normalizeProviderApiConfig(name, {
          ...(configs[name] || {}),
          apiKey,
          baseUrl: field("baseUrl"),
          testPath: field("testPath") || "/models",
          defaultModel,
          preset: card?.querySelector("[data-api-preset]")?.value || configs[name]?.preset || "precise",
          temperature,
          topP,
          maxOutputTokens: field("maxOutputTokens"),
          responseFormat: field("responseFormat") || "text",
          precisionRules: field("precisionRules"),
          extraParams: field("extraParams"),
        });
      }

      function setProviderApiStatus(name, status, message) {
        const configs = getProviderApiConfigs();
        const next = normalizeProviderApiConfig(name, {
          ...(configs[name] || {}),
          status,
          message,
          testedAt: status === "测试中" ? configs[name]?.testedAt || "" : formatLocalTime(),
        });
        configs[name] = next;
        saveProviderApiConfigs(configs);
        const card = providerApiCardElement(name);
        const statusEl = card?.querySelector("[data-api-status]");
        const messageEl = card?.querySelector("[data-api-message]");
        if (statusEl) {
          statusEl.textContent = status;
          statusEl.className = `api-status-pill ${apiStatusClass(status)}`;
        }
        if (messageEl) messageEl.textContent = message;
      }

      function saveProviderApiCard(name, options = {}) {
        const configs = getProviderApiConfigs();
        const current = collectProviderApiConfig(name);
        const keyError = providerApiKeyError(current.apiKey);
        if (keyError) {
          setProviderApiStatus(name, "Key 错误", keyError);
          showToast("API Key 格式不对");
          return false;
        }
        if (current.extraParams) {
          try {
            JSON.parse(current.extraParams);
          } catch {
            setProviderApiStatus(name, "地址错误", "高级参数 JSON 格式不正确，请修正后再保存。");
            showToast("高级参数 JSON 不正确");
            return false;
          }
        }
        const ready = Boolean(current.baseUrl && current.apiKey);
        const nextStatus = ready ? (current.status === "已连接" ? "已连接" : "未测试") : "未配置";
        const nextMessage = ready ? "已保存，等待测试连接。" : "请填写 API Key 和 Base URL。";
        configs[name] = normalizeProviderApiConfig(name, {
          ...current,
          status: nextStatus,
          message: nextMessage,
        });
        saveProviderApiConfigs(configs);
        setProviderApiStatus(name, nextStatus, nextMessage);
        if (!options.quiet) showToast(`${name} API 配置已保存`);
        return true;
      }

      function providerTestUrl(config) {
        const base = String(config.baseUrl || "").trim().replace(/\/+$/, "");
        const path = String(config.testPath || "/models").trim();
        const joined = path.startsWith("http") ? path : `${base}${path.startsWith("/") ? path : `/${path}`}`;
        const url = new URL(joined);
        if ((config.name === "Gemini" || config.name === "Google Veo") && config.apiKey && !url.searchParams.has("key")) {
          url.searchParams.set("key", config.apiKey);
        }
        return url.toString();
      }

      const loamApiTestProxyEndpoint = "http://127.0.0.1:8787/api/test";

      async function testProviderConnectionViaProxy(name, url, headers) {
        const response = await fetch(loamApiTestProxyEndpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ provider: name, endpoint: url, headers }),
        });
        const raw = await response.text();
        let envelope = {};
        try {
          envelope = raw ? JSON.parse(raw) : {};
        } catch {
          envelope = { raw };
        }
        if (!response.ok || envelope?.proxyError) {
          throw new Error(envelope?.proxyError || envelope?.message || raw || response.statusText);
        }
        return envelope;
      }

      async function testProviderConnection(name) {
        if (_testingProviders.has(name)) return;
        if (!saveProviderApiCard(name, { quiet: true })) return;
        const config = collectProviderApiConfig(name);
        if (!config.baseUrl || !config.apiKey) {
          setProviderApiStatus(name, "未配置", "请先填写 API Key 和 Base URL，再测试连接。");
          showToast("请先填写 API 配置");
          return;
        }
        let url = "";
        try {
          url = providerTestUrl(config);
        } catch {
          setProviderApiStatus(name, "地址错误", "Base URL 或测试路径格式不正确。");
          showToast("API 地址错误");
          return;
        }
        _testingProviders.add(name);
        const card = providerApiCardElement(name);
        const testBtn = card?.querySelector(`[data-api-test-provider="${CSS.escape(name)}"]`);
        if (testBtn) { testBtn.disabled = true; testBtn.classList.remove("active"); }
        setProviderApiStatus(name, "测试中", "正在测试连接...");
        try {
          const headers = {};
          if (name === "Claude") {
            headers["x-api-key"] = config.apiKey;
            headers["anthropic-version"] = "2023-06-01";
          } else if (name !== "Gemini" && name !== "Google Veo") {
            headers.Authorization = `Bearer ${config.apiKey}`;
          }
          const response = await testProviderConnectionViaProxy(name, url, headers);
          if (response.ok) {
            setProviderApiStatus(name, "已连接", `后台连接成功：${response.status} ${response.statusText || "OK"}`);
            showToast(`${name} 已连接`);
            return;
          }
          if (response.status === 401 || response.status === 403) {
            setProviderApiStatus(name, "鉴权失败", `接口可访问，但 Key 被拒绝：HTTP ${response.status}`);
            showToast("API Key 鉴权失败");
            return;
          }
          setProviderApiStatus(name, "连接失败", `接口有响应，但状态异常：HTTP ${response.status}`);
          showToast("连接状态异常");
        } catch (error) {
          const reason = error?.name === "AbortError" ? "请求超时" : error?.message || "本地后台代理无法访问供应商接口";
          setProviderApiStatus(name, "连接失败", `后台测试失败：${reason}`);
          showToast(`${name} 连接失败`);
        } finally {
          _testingProviders.delete(name);
          if (testBtn) { testBtn.disabled = false; testBtn.classList.add("active"); }
        }
      }

      const safeStorageFallbackKey = "__loamSafeStorage";
      const safeStorageMemory = new Map();
      let localStorageBlocked = false;

      function loadSafeStorageFallback() {
        try {
          const parsed = JSON.parse(window.name || "{}");
          const entries = Array.isArray(parsed?.[safeStorageFallbackKey]) ? parsed[safeStorageFallbackKey] : [];
          entries.forEach(([key, value]) => safeStorageMemory.set(String(key), String(value)));
        } catch {}
      }

      function persistSafeStorageFallback() {
        try {
          window.name = JSON.stringify({ [safeStorageFallbackKey]: [...safeStorageMemory.entries()] });
        } catch {}
      }

      function isStorageSecurityError(error) {
        return error?.name === "SecurityError" || String(error?.message || "").toLowerCase().includes("security");
      }

      function safeStorageGetItem(key) {
        const cleanKey = String(key || "");
        if (safeStorageMemory.has(cleanKey)) return safeStorageMemory.get(cleanKey);
        if (localStorageBlocked) return null;
        try {
          return localStorage.getItem(cleanKey);
        } catch (error) {
          if (!isStorageSecurityError(error)) throw error;
          localStorageBlocked = true;
          return safeStorageMemory.get(cleanKey) || null;
        }
      }

      function safeStorageSetItem(key, value) {
        const cleanKey = String(key || "");
        const cleanValue = String(value ?? "");
        if (!localStorageBlocked) {
          try {
            localStorage.setItem(cleanKey, cleanValue);
            return "local";
          } catch (error) {
            if (!isStorageSecurityError(error) && !isStorageQuotaError(error)) throw error;
            localStorageBlocked = true;
          }
        }
        safeStorageMemory.set(cleanKey, cleanValue);
        persistSafeStorageFallback();
        return "fallback";
      }

      function safeStorageRemoveItem(key) {
        const cleanKey = String(key || "");
        safeStorageMemory.delete(cleanKey);
        persistSafeStorageFallback();
        if (localStorageBlocked) return;
        try {
          localStorage.removeItem(cleanKey);
        } catch (error) {
          if (!isStorageSecurityError(error)) throw error;
          localStorageBlocked = true;
        }
      }

      function safeStorageKeys(prefix = "") {
        const keys = new Set([...safeStorageMemory.keys()]);
        if (!localStorageBlocked) {
          try {
            for (let index = 0; index < localStorage.length; index += 1) {
              const key = localStorage.key(index);
              if (key) keys.add(key);
            }
          } catch (error) {
            if (!isStorageSecurityError(error)) throw error;
            localStorageBlocked = true;
          }
        }
        return [...keys].filter((key) => !prefix || key.startsWith(prefix));
      }

        safeStorageSetItem(aiChatStoreKey(), JSON.stringify((items || []).map(normalizeAiConversation)));

      function isStorageQuotaError(error) {
        return error?.name === "QuotaExceededError" || String(error?.message || "").toLowerCase().includes("quota");
      }

      function compactAiConversationsForStorage() {
        const conversations = readAiConversations()
          .sort((a, b) => b.updatedAt - a.updatedAt)
          .slice(0, 12)
          .map((chat) => ({
            ...chat,
            messages: (chat.messages || []).slice(-12).map((message) => ({
              role: message.role,
              content: String(message.content || "").slice(0, 4000),
              model: message.model || "",
              createdAt: message.createdAt || Date.now(),
            })),
          }));
        safeStorageRemoveItem(aiChatDraftStoreKey());
        try {
          writeAiConversations(conversations);
        } catch (error) {
          if (!isStorageQuotaError(error)) throw error;
          safeStorageRemoveItem(aiChatStoreKey());
          return 0;
        }
        return conversations.length;
      }

        const folders = readAiSkillFolders();
        const id = folderId || folders[0]?.id || localId("skill-folder");
        if (!folders.some((folder) => folder.id === id)) {
          folders.push({ id, name: fallbackName || aiSkillFolderNameForId(id) });
          writeAiSkillFolders(folders);
        }
        return id;
      }

      function inferAiSkillFolderId(name = "", content = "") {
        const text = `${name} ${content}`;
        if (/图|image|picture|cover|prompt/i.test(text)) return "folder-image";
        if (/视频|分镜|脚本|video|storyboard|script/i.test(text)) return "folder-video";
        if (/检测|反AI|anti|check|audit/i.test(text)) return "folder-check";
        return "folder-writing";
      }

      function inferAiSkillRoute(name = "", content = "") {
        const folderId = inferAiSkillFolderId(name, content);
        if (folderId === "folder-image") return "image";
        if (folderId === "folder-video") return "script";
        if (folderId === "folder-check") return "antiAi";
        return "writing";
      }

        const content = skill.prompt || skill.content || "";

        return {
          id: skill.id || localId("skill"),
          name,

      function storedDiaryNotes() {
        const meta = readNoteMeta();

      function topTermsFromText(text, limit = 6) {
        const terms = ["写作", "AI", "项目", "复盘", "输出", "知识管理", "方法论", "图片", "视频", "模型", "日记", "风格", "结构", "发布", "灵感"];
        return terms
          .map((term) => ({ term, count: keywordCount(text, term) }))
          .filter((item) => item.count > 0)
          .sort((a, b) => b.count - a.count || a.term.localeCompare(b.term, "zh-Hans-CN"))
          .slice(0, limit);

      function buildAiStyleProfile(notes) {
        const text = notes.map((note) => `${note.title}\n${note.body}`).join("\n\n").slice(0, 24000);

        const avgLength = sentences.length ? Math.round(sentences.reduce((sum, item) => sum + item.length, 0) / sentences.length) : 0;
        const terms = topTermsFromText(text);
        const tags = diaryTagMatches(text).slice(0, 5).map((item) => item.tag);
        const directness = keywordCount(text, "直接") + keywordCount(text, "继续") + keywordCount(text, "不行") + keywordCount(text, "没有");
        const structureNeed = keywordCount(text, "应该") + keywordCount(text, "要") + keywordCount(text, "可以");
        const traits = [
          avgLength > 34 ? "长句完整解释" : "短句快速推进",
          directness > 2 ? "偏好直接执行" : "偏好简洁反馈",
          structureNeed > 3 ? "重视结构和可操作性" : "重视自然表达",
          tags[0] ? `高频主题：${tags[0]}` : terms[0] ? `高频主题：${terms[0].term}` : "主题仍在积累",
        ];

        if (/视频|分镜|脚本/.test(text)) traits.push("关注视频脚本");
        const answerTips = [
          "先给结论，再说已经做了什么。",

          : "还没有可学习的本地日记，写入或转入日记后会自动生成风格画像。";
        return {

          answerTips,

      function routeGroupFor(route) {

      function isDirectQuestionPrompt(text = "") {
        return /[？?]|什么|哪里|哪儿|哪些|哪个|怎么|如何|为什么|是不是|能不能|可不可以|有没有|多少|谁|吗|介绍|推荐|说一下|说说|讲一下|讲讲|聊聊/.test(String(text || ""));
      }

      function isExplicitWritingRequest(text = "") {
        const source = String(text || "");
        if (isDirectQuestionPrompt(source) && !/(帮我|请|给我|来|生成|创作|起草|撰写|输出|扩写|续写|写一篇|写个|写一个|写到|不少于|至少|字数)/.test(source)) {
          return false;
        }
        return /(帮我|请|给我|来)?\s*(写一篇|写个|写一个|写一下|撰写|生成|创作|起草|输出|扩写|续写)|文章|文案|草稿|大纲|字数|不少于|至少|扩写到/.test(source);

      function inferRouteFromPrompt(text = "", chat) {
        const source = isLengthOnlyPrompt(text) ? previousUserPrompt(chat) || text : text;
        if (/你是(什么|哪个|啥)模型|你用(什么|哪个|啥)模型|当前(什么|哪个|啥)模型|模型是(什么|哪个|啥)|你是谁|你是什么/.test(source)) return "chat";
        if (/反\s*AI|AI\s*检测|检测|去AI|去\s*AI|人味|高亮/.test(source)) return "antiAi";
        if (/生图|生成图|图片|插图|封面|配图|Midjourney|Flux|Stable Diffusion/i.test(source)) return "image";
        if (/分镜|文生视频|图生视频|视频|短视频|脚本|口播|镜头/.test(source)) return /分镜/.test(source) ? "storyboard" : "script";
        if (/润色|改写|优化|修正|语气|翻译/.test(source)) return "polish";
        if (isExplicitWritingRequest(source)) return "writing";

      function apiChatEndpoint(provider, config) {

      const globalAntiAiOutputRules = [
        "全局输出风格规则：",
        "1. 必须降低 AI 味：少用套话、排比、机械总结和“首先/其次/最后”这类模板节奏。",

        "4. 禁止使用 Markdown 装饰符：不要用 **加粗**、__下划线加粗__、## 标题、### 标题、--- 分割线、> 引用块这类符号。",
        "5. 禁止奉承式开头：不要写“你说得对”“你这个问题很好”“确实”“没错”“这个策略是对的”。直接进入判断和答案。",
        "6. 如果需要列点，可以用普通数字或短句，不要用花哨符号包装。",

      function buildApiSystemPrompt(config, skill, webSearchEnabled, route = "chat") {
        if (route === "chat" && !skill?.prompt) {
          return [
            "你是 Loam 的普通对话助手。直接回答用户当前问题，先给结论，再给必要理由。",
            "不要写成文章，不要套写作模板，不要沿用上一轮主题。",
            "不确定就明确说不确定；不要编造事实、数字、人名、引用、模型能力和实时信息。",
            globalAntiAiOutputRules,
            webSearchEnabled ? "用户已开启联网搜索；如果当前供应商支持联网搜索参数或工具，必须基于检索结果回答；如果不支持，明确说明无法联网。" : "",
          ].filter(Boolean).join("\n");

        return [
          config.precisionRules || providerPrecisionRules,
          skill?.prompt ? `当前 SKILL：\n${skill.prompt}` : "",
          globalAntiAiOutputRules,
          webSearchEnabled ? "用户已开启联网搜索；如果当前供应商支持联网搜索参数或工具，必须基于检索结果回答；如果不支持，明确说明无法联网。" : "",
          "必须直接回答用户当前问题，不要沿用上一轮主题，不要用本地模板替代真实模型回答。",
        ].filter(Boolean).join("\n\n");
      }

      function apiHistoryMessages(chat, nextText) {
        const source = String(nextText || "").trim();
        const needsHistory = isLengthOnlyPrompt(source) || /^(继续|接着|上面|刚才|这个|那个|它|他们|她们|修改|改一下|重写|换一种|展开|详细说|再说|再写|补充)/.test(source);
        if (!needsHistory) return [{ role: "user", content: source }];
        const history = (chat.messages || [])
          .filter((message) => ["user", "assistant"].includes(message.role) && message.content && !message.pending)
          .slice(-4)
          .map((message) => ({ role: message.role, content: String(message.content).slice(0, 1500) }));
        const last = history.at(-1);
        if (!last || last.role !== "user" || last.content !== source) {
          history.push({ role: "user", content: source });
        }
        return history;
      }

      function maxTokensForRequest(provider, config, text, route) {
        const configured = Number(config.maxOutputTokens) || 2000;
        const targetCount = requestedCharCount(text);
        if (targetCount) return Math.min(Math.max(Math.ceil(targetCount * 1.8), 800), configured);
        if (route === "chat" && providerRequiresTemperatureOne(provider, config.defaultModel)) return Math.max(1200, Math.min(configured, 1600));
        if (providerRequiresTemperatureOne(provider, config.defaultModel)) return Math.max(1800, Math.min(configured, 2400));
        if (route === "chat") return Math.min(configured, 900);
        if (route === "antiAi" || route === "polish") return Math.min(configured, 1200);
        return configured;
      }

      function responseFormatBody(format) {
        if (!format || format === "text") return {};
        if (format === "json_schema") return { response_format: { type: "json_object" } };
        return { response_format: { type: format } };
      }

      function sanitizeProviderPayload(provider, payload) {
        if (provider !== "文心 ERNIE") {
          delete payload.penalty_score;
        }
        if (providerRequiresTemperatureOne(provider, payload.model)) {
          payload.temperature = 1;
        }
        const forcedTopP = providerForcedTopP(provider, payload.model);
        if (forcedTopP) payload.top_p = Number(forcedTopP);
        return payload;
      }

      function extractApiText(data) {
        const message = data?.choices?.[0]?.message;
        const candidates = [
          message?.content,
          message?.text,
          message?.refusal,
          data?.content,
          data?.output_text,
          data?.answer,
          data?.result,
          data?.choices?.[0]?.text,
        ];
        for (const candidate of candidates) {
          const text = extractTextValue(candidate);
          if (text) return text;
        }
        return "";
      }

      function extractTextValue(value) {
        if (typeof value === "string") return value.trim();
        if (Array.isArray(value)) {
          return value.map((item) => extractTextValue(item)).filter(Boolean).join("").trim();
        }
        if (value && typeof value === "object") {
          const candidates = [value.text, value.content, value.output_text, value.value];
          for (const candidate of candidates) {
            const text = extractTextValue(candidate);
            if (text) return text;
          }
        }
        return "";
      }

      function stripMarkdownDecorators(text = "") {
        return String(text || "")
          .replace(/[`*_＊﹡]+/g, "")
          .replace(/__([^_\n]+?)__/g, "$1")
          .replace(/(^|\n)\s{0,3}#{1,6}\s+/g, "$1")
          .replace(/(^|\n)\s{0,3}>\s?/g, "$1")
          .replace(/(^|\n)\s*[-*_]{3,}\s*(?=\n|$)/g, "$1")
          .replace(/[ \t]+\n/g, "\n")
          .trim();
      }

      function stripAgreementOpener(text = "") {
        let output = String(text || "").trim();
        const openers = [
          /^(你说[得的]对|你这个判断是对的|这个策略是对的|这个思路是对的|你这个问题很好|这个问题很好|确实|没错|对)[，。,:：\s]+/i,
          /^(我同意|基本认同|整体认同)[，。,:：\s]+/i,
        ];
        let changed = true;
        while (changed) {
          changed = false;
          for (const pattern of openers) {
            const next = output.replace(pattern, "").trim();
            if (next !== output) {
              output = next;
              changed = true;
            }
          }
        }
        return output;
      }

      function paragraphizeApiText(text = "") {
        const clean = String(text || "").trim();
        if (!clean) return clean;
        const withSignpostBreaks = clean.replace(/([。！？!?；;])\s*(?=(对的|但注意|注意|结论|建议|风险|重点|不过|如果|另外|同时|简单说|说白了|更准确)[：:])/g, "$1\n\n");
        if (/\n\s*\n/.test(withSignpostBreaks) || withSignpostBreaks.length < 90) return withSignpostBreaks;
        const lines = withSignpostBreaks.split(/\n/).map((line) => line.trim()).filter(Boolean);
        if (lines.length > 1) return lines.join("\n\n");
        const sentences = withSignpostBreaks
          .split(/(?<=[。！？!?；;])\s*/g)
          .map((item) => item.trim())
          .filter(Boolean);
        if (sentences.length < 2) return clean;
        const paragraphs = [];
        let bucket = "";
        sentences.forEach((sentence) => {
          const next = bucket ? `${bucket}${sentence}` : sentence;
          if (bucket && (next.length >= 120 || /[。！？!?]$/.test(bucket) && bucket.length >= 70)) {
            paragraphs.push(bucket);
            bucket = sentence;
          } else {
            bucket = next;
          }
        });
        if (bucket) paragraphs.push(bucket);
        return paragraphs.join("\n\n");
      }

      function normalizeAiApiOutput(text = "") {
        return paragraphizeApiText(stripAgreementOpener(stripMarkdownDecorators(text)));
      }

      function apiResponseSummary(data) {
        const choice = data?.choices?.[0] || {};
        const message = choice.message || {};
        const parts = [
          choice.finish_reason ? `finish_reason=${choice.finish_reason}` : "",
          Object.keys(message).length ? `message字段=${Object.keys(message).join(", ")}` : "",
          data?.usage ? `usage=${JSON.stringify(data.usage).slice(0, 160)}` : "",
        ].filter(Boolean);
        return parts.join("；") || JSON.stringify(data || {}).slice(0, 220);
      }

      const loamApiProxyEndpoint = "http://127.0.0.1:8787/api/chat";
      const loamApiProxyStreamEndpoint = "http://127.0.0.1:8787/api/chat-stream";
      const loamClipboardEndpoint = "http://127.0.0.1:8787/api/clipboard";
      const loamTerminalEndpoint = "http://127.0.0.1:8787/api/terminal";

      function apiErrorDetail(data, fallback = "") {
        return data?.error?.message || data?.error || data?.message || data?.raw || fallback || "未知错误";
      }

      async function fetchJsonText(response) {
        const raw = await response.text();
        if (!raw) return {};
        try {
          return JSON.parse(raw);
        } catch {
          return { raw };
        }
      }

      async function requestProviderApiViaProxy(provider, endpoint, headers, payload) {
        let response;
        try {
          response = await fetch(loamApiProxyEndpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ provider, endpoint, headers, payload }),
          });
        } catch (error) {
          error.proxyUnavailable = true;
          throw error;
        }
        const envelope = await fetchJsonText(response);
        if (!response.ok || envelope?.proxyError) {
          const error = new Error(`本地 API 代理不可用：${apiErrorDetail(envelope, response.statusText)}`);
          error.proxyUnavailable = true;
          throw error;
        }
        if (!envelope.ok) {
          throw new Error(`${provider} API 调用失败：${envelope.status} ${apiErrorDetail(envelope.data, envelope.raw)}`);
        }
        return { data: envelope.data || {}, transport: "本地 API 代理" };
      }

      function extractApiDeltaText(data) {
        const choice = data?.choices?.[0] || {};
        return extractTextValue(
          choice.delta?.content
          ?? choice.delta?.text
          ?? choice.message?.content
          ?? data?.delta
          ?? data?.content
          ?? data?.output_text
        );
      }

      async function requestProviderApiStreamViaProxy(provider, endpoint, headers, payload, onDelta) {
        const response = await fetch(loamApiProxyStreamEndpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ provider, endpoint, headers, payload: { ...payload, stream: true } }),
        });
        if (!response.ok) {
          const detail = await response.text();
          throw new Error(`${provider} 流式 API 调用失败：${response.status} ${detail.slice(0, 260)}`);
        }
        if (!response.body) throw new Error("浏览器不支持流式读取 API 返回。");
        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";
        let content = "";
        let done = false;
        while (!done) {
          const chunk = await reader.read();
          done = Boolean(chunk.done);
          buffer += decoder.decode(chunk.value || new Uint8Array(), { stream: !done });
          const events = buffer.split(/\n\n+/);
          buffer = events.pop() || "";
          for (const event of events) {
            const lines = event.split(/\n/).map((line) => line.trim()).filter(Boolean);
            const dataLines = lines.filter((line) => line.startsWith("data:")).map((line) => line.slice(5).trim());
            if (!dataLines.length) continue;
            const dataText = dataLines.join("\n");
            if (dataText === "[DONE]") continue;
            let data;
            try {
              data = JSON.parse(dataText);
            } catch {
              continue;
            }
            if (data?.error || data?.proxyError || data?.raw) {
              throw new Error(apiErrorDetail(data, data.raw || data.proxyError || "流式 API 返回错误"));
            }
            const delta = extractApiDeltaText(data);
            if (delta) {
              content += delta;
              onDelta?.(content);
            }
          }
        }
        return { content: normalizeAiApiOutput(content), transport: "本地 API 代理 · 流式" };
      }

      async function requestProviderApi(provider, endpoint, headers, payload) {
        try {
          return await requestProviderApiViaProxy(provider, endpoint, headers, payload);
        } catch (proxyError) {
          if (!proxyError?.proxyUnavailable) throw proxyError;
          throw new Error(`真实 API 未能发出：本地 API 代理没有连上。请启动 loam-design/api-proxy.mjs，或等客户端后台接管 API 调用。`);
        }
      }

      async function callProviderChatApi(provider, chat, text, options = {}) {
        const route = options.route || "chat";
        if (routeNeedsNativeMediaApi(route) && providerIsPureMediaModel(provider)) {
          throw new Error(`${provider} 是${imageModelOptions.includes(provider) ? "图像" : "视频"}模型，需要专用${imageModelOptions.includes(provider) ? "生图" : "生视频"} API。当前已跑通的是文本 Chat API 链路；请先用 DeepSeek/Kimi/Claude 等文本模型生成 prompt，或等专用媒体 API 接入。`);
        }
        const configs = getProviderApiConfigs();
        const config = normalizeProviderApiConfig(provider, configs[provider] || {});
        if (!config.apiKey || !config.baseUrl) {
          throw new Error(`${provider} 没有配置 API Key 或 Base URL。请到 设置 > API Key 填好后再发送。`);
        }
        const keyError = providerApiKeyError(config.apiKey);
        if (keyError) throw new Error(keyError);
        if (!config.defaultModel) {
          throw new Error(`${provider} 没有默认模型。请到 设置 > API Key 选择官方模型 ID。`);
        }
        const endpoint = apiChatEndpoint(provider, config);
        const systemPrompt = buildApiSystemPrompt(config, options.skill, options.webSearchEnabled, route);
        const extra = parseProviderExtraParams(config);
        const maxTokens = maxTokensForRequest(provider, config, text, route);
        const temperature = Number(config.temperature);
        const topP = Number(config.topP);
        const commonMessages = apiHistoryMessages(chat, text);
        let payload;
        let headers;
        if (provider === "Claude") {
          headers = {
            "Content-Type": "application/json",
            "x-api-key": config.apiKey,
            "anthropic-version": "2023-06-01",
          };
          payload = {
            model: config.defaultModel,
            max_tokens: maxTokens,
            system: systemPrompt,
            messages: commonMessages.map((message) => ({ role: message.role === "assistant" ? "assistant" : "user", content: message.content })),
            ...extra,
          };
          if (Number.isFinite(temperature)) payload.temperature = temperature;
          if (Number.isFinite(topP)) payload.top_p = topP;
          sanitizeProviderPayload(provider, payload);
        } else {
          headers = {
            "Content-Type": "application/json",
            Authorization: `Bearer ${config.apiKey}`,
          };
          payload = {
            model: config.defaultModel,
            messages: [{ role: "system", content: systemPrompt }, ...commonMessages],
            temperature: Number.isFinite(temperature) ? temperature : undefined,
            top_p: Number.isFinite(topP) ? topP : undefined,
            max_tokens: maxTokens,
            stream: false,
            ...responseFormatBody(config.responseFormat),
            ...extra,
          };
          sanitizeProviderPayload(provider, payload);
          if (options.webSearchEnabled && provider === "文心 ERNIE") {
            payload.web_search = {
              enable: true,
              enable_citation: true,
              enable_trace: true,
              enable_status: false,
              search_number: 6,
              reference_number: 4,
              ...(payload.web_search || {}),
            };
          }
          Object.keys(payload).forEach((key) => payload[key] === undefined && delete payload[key]);
        }
        const canStream = ["Kimi", "DeepSeek"].includes(provider) && config.responseFormat === "text" && typeof options.onDelta === "function";
        if (canStream) {
          const streamed = await requestProviderApiStreamViaProxy(provider, endpoint, headers, payload, options.onDelta);
          if (!streamed.content) throw new Error(`${provider} 流式 API 返回为空。`);
          return { content: streamed.content, endpoint, model: config.defaultModel, transport: streamed.transport };
        }
        const { data, transport } = await requestProviderApi(provider, endpoint, headers, payload);
        const content = normalizeAiApiOutput(extractApiText(data));
        if (!content) throw new Error(`${provider} API 返回为空。${apiResponseSummary(data)}`);
        return { content, endpoint, model: config.defaultModel, transport };
      }

      function formatDeepThinkingDuration(elapsedMs = 0) {
        const seconds = Math.max(1, Math.round((Number(elapsedMs) || 0) / 1000));
        return `深度思考 ${seconds}秒`;
      }

      function requestedCharCount(text = "") {
        const match = String(text || "").match(/(?:字数(?:为|到)?|写到|扩写到|不少于|至少|约|大约)?\s*(\d{3,5})\s*字/);
        return match ? Number(match[1]) || 0 : 0;
      }

      function isLengthOnlyPrompt(text = "") {
        const clean = String(text || "").replace(/[。！？!?，,\s]/g, "");
        return /^(字数(?:为|到)?|写到|扩写到|不少于|至少|约|大约)?\d{3,5}字$/.test(clean);
      }

      function previousUserPrompt(chat) {
        return [...(chat?.messages || [])]
          .reverse()
          .find((message) => message.role === "user" && !isLengthOnlyPrompt(message.content))?.content || "";
      }

      function resolveWritingPrompt(text, chat) {
        if (isLengthOnlyPrompt(text)) return previousUserPrompt(chat) || text;
        return text;
      }

      function topicFromPrompt(text) {
        const clean = String(text || "")
          .replace(/(?:字数(?:为|到)?|写到|扩写到|不少于|至少|约|大约)?\s*\d{3,5}\s*字/g, "")
          .replace(/[。！？!?]+$/g, "")
          .trim();
        const match = clean.match(/(?:关于|围绕|以)(.+?)(?:的)?(?:文章|短文|脚本|内容|文案|主题)?$/);
        return cleanNoteTitle(match?.[1] || clean
          .replace(/^(帮我|请|能不能|可以)?\s*(写一篇|写一下|写|生成|做一个|来一篇|创作一篇)?\s*/g, "")
          .replace(/(的)?(文章|短文|脚本|内容|文案|主题)$/g, "")
          .trim() || "这个主题");
      }

AI 现在已经不是一个只用来尝鲜的工具。它正在进入写作、学习、办公、设计、编程和内容创作的每一个环节。很多人第一次使用 AI，会觉得它最厉害的地方是“能直接给答案”。但真正用久以后会发现，AI 的价值并不只是替你完成某个任务，而是帮你把模糊的想法变清楚，把零散的信息整理成结构，把原本需要很久才能推进的工作缩短成一个可以反复迭代的流程。

使用 AI 最常见的误区，是把它当成一个万能搜索框。比如直接问一句“帮我写一篇文章”，然后把生成的内容复制出来。这样当然能得到一段文字，但结果往往很平，读起来像正确废话。原因很简单：AI 不知道你的真实目的，不知道你想面对谁说话，也不知道你手里有哪些素材。它只能根据最常见的表达方式给你一个平均答案。这个答案看起来完整，却很难有你的判断和个性。

更好的方式，是把 AI 当成一个协作对象。你先告诉它任务目标，再给它背景材料，然后让它一步一步参与进来。比如写一篇文章，不要一开始就让它输出成稿，而是先让它帮你拆问题：这篇文章要解决什么疑惑？读者为什么会关心？核心观点是什么？有哪些例子可以支撑？当这些问题被拆开以后，你再让它生成大纲、扩写段落、检查逻辑、调整语气，结果会比一次性生成更稳定，也更像你自己的内容。

在写作场景里，AI 可以承担三个角色。第一个角色是整理者。很多时候，我们不是没有想法，而是想法太散，堆在脑子里没有顺序。AI 可以把这些句子重新分组，找出主线，把重复的内容合并，把缺失的逻辑补出来。第二个角色是编辑。它可以帮你检查哪里太绕，哪里太空，哪里像模板句，哪里需要举例。第三个角色是陪练。你可以让它站在读者角度提问，甚至反驳你的观点，逼你把表达想得更扎实。

在学习场景里，AI 的价值也很明显。它可以把复杂概念拆成更容易理解的层级，可以用类比帮助你快速进入一个陌生领域，也可以根据你的水平调整解释方式。比如你学习一个新工具，可以先让 AI 给你画出知识地图，再让它列出最常用的 20% 功能，最后让它用练习题帮你巩固。这样学习不再是被动看资料，而是变成了持续对话和主动验证。

在工作场景里，AI 更像一个效率放大器。它可以写会议纪要、整理需求、生成邮件草稿、总结长文档、拆解项目计划，也可以帮你把一个粗糙想法变成更清晰的执行清单。真正节省时间的不是“生成文字”这件事本身，而是它能减少你在空白页面前反复卡住的时间。你可以先让 AI 给一个初稿，再用自己的判断去删、改、补。这样比从零开始更快，也比完全依赖 AI 更可靠。

但 AI 也有边界。它不应该替你做最终判断。它可以提供结构，但不能替你决定方向；它可以生成观点，但不能替你承担观点背后的责任；它可以帮你表达得更顺，但不能凭空创造真实经验。如果你完全把判断交给 AI，内容就会越来越像模板，工作也会越来越依赖外部反馈。真正成熟的用法，是让 AI 做加速器，而不是方向盘。

所以，使用 AI 的关键不是问“它能不能帮我做完”，而是问“我怎样让它帮我做得更好”。你给它的上下文越清楚，它的输出越有用；你的标准越明确，它越容易贴近你的需求；你越愿意反复追问和修改，它越能成为真正的协作者。

未来的竞争，不会是会不会使用 AI 的竞争，而是谁更会把 AI 放进自己的工作流。会用 AI 的人，不只是让它写几段话，而是让它参与思考、整理、创作、复盘和迭代。它会像一个外置大脑，帮你保存想法、连接知识、生成草稿、发现问题。最终，AI 不会替代人的创造力，但会放大那些本来就愿意思考、愿意表达、愿意持续改进的人。`;

AI 真正有价值的地方，不是替人思考，而是帮人把已经有的想法整理得更快、更清楚。很多人使用 AI 时容易陷入一个误区：一上来就让它直接给答案。这样虽然快，但结果往往空泛，因为 AI 并不知道你的目标、语气、素材和判断标准。

      }

      function directQuestionSubject(text = "") {
        const source = String(text || "")
          .replace(/[？?。！!]+$/g, "")
          .replace(/^(请问|请|帮我|你能不能|你可以|可以|麻烦|给我|你)?\s*(说一下|说说|讲一下|讲讲|介绍一下|介绍|聊聊|推荐一下|推荐)?\s*/g, "")
          .trim();
        const match = source.match(/^(.+?)(是什么|什么意思|有啥用|有什么用|能做什么|可以做什么|怎么用|如何用|怎么做|如何做|有哪些|有什么|哪里|哪儿)/);
        return cleanNoteTitle(match?.[1] || source.replace(/(是什么|什么意思|有啥用|有什么用|能做什么|可以做什么|怎么用|如何用|怎么做|如何做|有哪些|有什么|哪里|哪儿).*$/g, "").trim() || source);
      }

      function buildDirectUseAnswer(topic) {
        const subject = cleanNoteTitle(topic || "这个东西");
        if (isAiTopic(subject)) {
          return `# ${subject}有什么用

${subject}最实际的用处不是“替你想完”，而是帮你把事情推进得更快、更清楚。

1. 写作整理：把零散想法整理成大纲、段落、标题和发布稿。
2. 资料总结：把长文、会议、笔记压缩成重点和待办。
3. 改写润色：让表达更自然、更直接，但要保留你的原意。
4. 图片和视频辅助：根据正文生成封面、插图 prompt、分镜和脚本。
5. 工作流加速：把重复任务变成固定 SKILL，减少每次重新组织提示词的时间。

关键是先给目标、素材和标准。你给得越具体，模型越不容易跑偏。`;
        }
        return `# ${subject}有什么用

我按你问的对象直接答：${subject}的价值要看使用场景。

更准确的判断方式是三步：
1. 先看它解决什么问题。
2. 再看它比原来的方式省了什么成本。
3. 最后看它能不能稳定复用。

如果你补充一下${subject}具体指产品、工具、方法还是地点，我可以继续给更精确的用途、优缺点和适用场景。`;
      }

      function buildDefinitionAnswer(topic) {
        const subject = cleanNoteTitle(topic || "这个概念");
        if (isAiTopic(subject)) {
          return `# ${subject}是什么

${subject}可以理解为一种能理解、生成和处理信息的工具。它能读文字、总结资料、写内容、生成图片或视频提示，也能按你的流程执行固定任务。

但它不是自动正确的答案机器。它需要明确的目标、上下文和判断标准。Loam 里的模型设置会把温度调低、Top P 收紧，让回答更稳定；右侧没有选中 SKILL 时，只按当前问题普通回答，不自动乱套写作任务。`;
        }
        return `# ${subject}是什么

我先按当前问题直接解释：${subject}需要放到具体语境里判断。

如果你问的是概念，我会解释它的定义、用途和例子；如果你问的是工具，我会说明它能做什么、怎么用、有什么限制。你可以再补一个场景，我就能把答案收得更准。`;
      }

      function buildHowToAnswer(topic, text) {
        const subject = cleanNoteTitle(topic || text || "这件事");
        return `# ${subject}怎么做

按最稳的方式做：

1. 先定目标：你要得到文章、摘要、图片、脚本，还是一个判断。
2. 给材料：把已有笔记、关键词、限制条件放进去。
3. 限输出：说明字数、语气、格式和不能出现的内容。
4. 先小步生成：让模型先给结构，再扩写，不一次性乱出长文。
5. 最后校对：事实、地点、数字和引用都要复查。

Loam 这里会默认走精准模式：低温度、低随机度、按当前问题回答，不把普通问题误判成写作任务。`;
      }

      function isPracticalChoicePrompt(text = "") {
        const source = String(text || "");
        return /(还是|或者|要不要|该不该|需不需要|值不值得|能不能|可不可以|怎么去|开车|步行|走路|打车|骑车|坐地铁|公交)/.test(source);
      }

      function shortDistanceContext(text = "") {
        const source = String(text || "");
        const numberMatch = source.match(/(\d+(?:\.\d+)?)\s*(米|公里|km|m)/i);
        if (numberMatch) {
          const value = Number(numberMatch[1]);
          const unit = numberMatch[2].toLowerCase();
          const meters = /公里|km/.test(unit) ? value * 1000 : value;
          return meters <= 300;
        }
        return /(路对面|对面|旁边|隔壁|楼下|门口|附近|很近|几步路|几十米|一百米|两百米|三百米)/.test(source);
      }

      function vehicleMustGoContext(text = "") {
        return /(洗车|洗车房|洗车店|洗车场|修车|维修车|保养|年检|验车|补胎|换胎|加油|充电桩|停车|挪车|取车|还车|提车)/.test(String(text || ""));
      }

      function riskyDriveContext(text = "") {
        return /(喝酒|饮酒|酒后|没驾照|驾照过期|困了|很困|太累|疲劳|下大雨|暴雨|大雪|结冰|视线不好)/.test(String(text || ""));
      }

      function preferVehicleContext(text = "") {
        return /(赶时间|很急|来不及|东西多|大件|搬东西|带孩子|带老人|下雨|雨大|很热|很冷|夜里|晚上很晚|不安全)/.test(String(text || ""));
      }

      function parkingHardContext(text = "") {
        return /(停车难|没车位|不好停车|堵车|不能掉头|不好掉头|逆行|单行道|路口复杂|市中心|景区)/.test(String(text || ""));
      }

      function cleanChoiceOption(option = "") {
        return cleanNoteTitle(String(option || "")
          .replace(/^.*?(?:是要|是|要不要|要|该不该|应该|该|需不需要|选择|选)/, "")
          .replace(/^(还是|或者)/, "")
          .replace(/[呀吗呢吧啊了？?。！!，,、\s]+$/g, "")
          .trim());
      }

      function lastMeaningfulClause(value = "") {
        const parts = String(value || "").split(/[，,。！？?；;：:]/).map((item) => item.trim()).filter(Boolean);
        return parts.at(-1) || String(value || "").trim();
      }

      function firstMeaningfulClause(value = "") {
        const parts = String(value || "").split(/[，,。！？?；;：:]/).map((item) => item.trim()).filter(Boolean);
        return parts[0] || String(value || "").trim();
      }

      function extractExplicitChoiceOptions(text = "") {
        const source = String(text || "").replace(/\s+/g, "");
        const sep = source.match(/还是|或者/);
        if (!sep) return [];
        const before = lastMeaningfulClause(source.slice(0, sep.index));
        const after = firstMeaningfulClause(source.slice(sep.index + sep[0].length));
        const first = cleanChoiceOption(before);
        const second = cleanChoiceOption(after);
        return first && second && first !== second ? [first, second] : [];
      }

      function extractChoiceOptions(text = "") {
        const source = String(text || "");
        const explicit = extractExplicitChoiceOptions(source);
        if (explicit.length) return explicit;
        const patterns = [
          /(?:是要|应该|该|要)([^，。？！?]{1,24}?)(?:呀|吗|呢|吧)?[，,、\s]*(?:还是|或者)([^？?。！!，,]{1,32})/,
          /([^，。？！?]{1,24}?)(?:呀|吗|呢|吧)?[，,、\s]*(?:还是|或者)([^？?。！!，,]{1,32})/,
        ];
        for (const pattern of patterns) {
          const match = source.match(pattern);
          if (!match) continue;
          const first = cleanChoiceOption(match[1]);
          const second = cleanChoiceOption(match[2]);
          if (first && second && first !== second) return [first, second];
        }
        return [];
      }

      function nonDrivingOptionFromText(text = "") {
        const source = String(text || "");
        if (/打车|网约车|出租车/.test(source)) return /回家/.test(source) ? "打车回家" : "打车";
        if (/代驾/.test(source)) return /回家/.test(source) ? "叫代驾回家" : "叫代驾";
        if (/地铁/.test(source)) return "坐地铁";
        if (/公交/.test(source)) return "坐公交";
        if (/步行|走路/.test(source)) return "步行";
        return "不要自己开车";
      }

      function buildRiskyDrivingAnswer(text) {
        const choice = nonDrivingOptionFromText(text);
        return `我的判断：选「${choice}」。

原因很直接：你已经喝酒了，就不能自己开车。这个时候不需要再比较距离、费用或方便程度，安全和违法风险是第一位的。

现在最稳的做法：
1. 直接打车或叫代驾。
2. 如果车停在外面，确认停放安全，明天再取。
3. 不要抱侥幸心理，也不要让同样喝酒的人开。

结论：别开车，选「${choice}」。`;
      }

      function scoreChoiceOption(option, text) {
        const source = String(text || "");
        const item = String(option || "");
        let score = 0;
        const reasons = [];
        const isWalk = /(步行|走路|走过去|走去)/.test(item);
        const isDrive = /(开车|车去|开过去|开去|驾车)/.test(item);
        const isTaxi = /(打车|网约车|出租车)/.test(item);
        const isBike = /(骑车|电动车|自行车)/.test(item);
        const isPublic = /(地铁|公交|公共交通)/.test(item);
        const short = shortDistanceContext(source);
        const vehicleTask = vehicleMustGoContext(source);
        if (vehicleTask && isDrive) {
          score += 6;
          reasons.push("这件事的对象是车，车本身需要到现场");
        }
        if (vehicleTask && isWalk) {
          score -= 5;
          reasons.push("人走过去解决不了车要进场的问题");
        }
        if (short && isWalk && !vehicleTask) {
          score += 4;
          reasons.push("距离很近，步行成本最低");
        }
        if (short && isDrive && !vehicleTask) {
          score -= 2;
          reasons.push("距离很近，开车反而麻烦");
        }
        if (preferVehicleContext(source) && (isDrive || isTaxi)) {
          score += 3;
          reasons.push("赶时间、天气或携带东西会让车更合适");
        }
        if (preferVehicleContext(source) && isWalk) {
          score -= 1;
          reasons.push("当前条件下步行可能不舒服或不安全");
        }
        if (riskyDriveContext(source) && isDrive) {
          score -= 8;
          reasons.push("有不适合开车的安全风险");
        }
        if (riskyDriveContext(source) && (isWalk || isTaxi || isPublic)) {
          score += 4;
          reasons.push("可以避开驾驶风险");
        }
        if (parkingHardContext(source) && isDrive && !vehicleTask) {
          score -= 3;
          reasons.push("停车或路况会增加开车成本");
        }
        if (parkingHardContext(source) && (isWalk || isPublic)) {
          score += 2;
          reasons.push("能避开停车和拥堵问题");
        }
        if (isBike && short && !riskyDriveContext(source)) {
          score += 1;
          reasons.push("短距离骑车也可以，但要看路况");
        }
        if (isPublic && !short) {
          score += 1;
          reasons.push("中长距离公共交通更稳");
        }
        if (/买|购买|升级|换/.test(item) && /(预算|贵|便宜|值不值得|要不要)/.test(source)) {
          score += /刚需|必须|坏了|影响使用|急用/.test(source) ? 3 : -1;
          reasons.push(/刚需|必须|坏了|影响使用|急用/.test(source) ? "已经影响使用，优先解决" : "不是刚需时先别急着花钱");
        }
        return { option: item, score, reasons };
      }

      function buildPracticalChoiceAnswer(text, model) {
        const source = String(text || "").trim();
        if (riskyDriveContext(source) && /(开车|驾车|自己开)/.test(source)) return buildRiskyDrivingAnswer(source);
        const options = extractChoiceOptions(source);
        const scored = options.map((option) => scoreChoiceOption(option, source)).sort((a, b) => b.score - a.score);
        const best = scored[0];
        const second = scored[1];
        if (best && second && best.score > second.score) {
          const reasons = [...new Set(best.reasons)].slice(0, 3);
          const exception = riskyDriveContext(source)
            ? "如果涉及驾驶风险，永远不要硬开车。"
            : parkingHardContext(source)
              ? "如果要开车，先确认入口、掉头和停车条件。"
              : "如果现场规则或安全条件不允许，就按现场条件调整。";
          return `我的判断：选「${best.option}」。

理由：
${reasons.length ? reasons.map((reason, index) => `${index + 1}. ${reason}。`).join("\n") : "1. 这个选项在当前条件下成本更低、风险更小。"}

例外：${exception}

按你这句话，不需要写成长篇分析，直接按这个选择执行就行。`;
        }
        if (/要不要|该不该|需不需要|值不值得/.test(source)) {
          const shouldWait = /(贵|预算|不确定|犹豫|可有可无|没想好|怕|担心|风险)/.test(source);
          return shouldWait
            ? `我的判断：先不要急着做。

原因是你现在的问题里已经出现“不确定/成本/风险”的信号。遇到这种情况，默认先停一下，比马上行动更稳。

只有同时满足这三点再做：
1. 它解决的是刚需，不是临时冲动。
2. 成本能接受，失败也不会造成明显损失。
3. 有明确下一步，而不是做完还要继续猜。`
            : `我的判断：可以做，但先小步做。

不要一下子把成本压满。先用最小动作验证一下：问价、试用、看入口、确认规则、做一个小版本。确认没问题后再继续。`;
        }
        return `我的判断：先选风险更小、成本更低、可逆性更强的方案。

通用规则：
1. 人去办事、距离很近：优先步行。
2. 车或物品本身必须到现场：让车或物品过去。
3. 喝酒、疲劳、恶劣天气：不要自己开车。
4. 停车难、堵车、路口复杂：优先步行、地铁或打车。
5. 花钱或长期承诺：先小步验证，不要直接上大成本。

以后换一个问题，也按这套规则先给结论，再说例外。`;
      }

      function buildPreciseDirectAnswer(text, model) {
        const source = String(text || "").trim();
        const topic = directQuestionSubject(source);
        if (/最新|今天|现在|实时|价格|股价|天气|新闻|汇率|赛程/.test(source)) {
          return `这个问题需要实时数据，当前本地原型不能直接编答案。

要保证精准，应该接入搜索、地图、天气或对应 API 后再回答。模型可以负责总结和判断，但实时事实不能靠模型猜。`;
        }
        if (isPracticalChoicePrompt(source)) return buildPracticalChoiceAnswer(source, model);
        if (/有什么用|有啥用|能做什么|可以做什么/.test(source)) return buildDirectUseAnswer(topic);
        if (/是什么|什么意思|你是谁|你是什么/.test(source)) return buildDefinitionAnswer(topic);
        if (/怎么|如何|怎样/.test(source)) return buildHowToAnswer(topic, source);
        return `我按当前问题直接回答，不调用写作模板：

${source}

这条问题还缺少一个明确对象或场景。为了精准，我不会把它自动扩写成文章，也不会沿用上一轮主题。你补一个对象、地点或材料后，我会直接围绕它回答。当前调用模型：${model}。`;
      }

      function defaultTerminalCwd() {
        return "/Users/seek/Documents/loam-design";
      }

      function readAiTerminalHistory() {
        try {
          const parsed = JSON.parse(safeStorageGetItem(aiTerminalHistoryStoreKey()) || "[]");
          return (Array.isArray(parsed) ? parsed : []).slice(0, 20);
        } catch {
          return [];
        }
      }

      function writeAiTerminalHistory(entries) {
        safeStorageSetItem(aiTerminalHistoryStoreKey(), JSON.stringify((entries || []).slice(0, 20)));
      }

      function appendAiTerminalHistory(entry) {
        const next = [{ id: localId("terminal"), createdAt: Date.now(), ...entry }, ...readAiTerminalHistory()].slice(0, 20);
        writeAiTerminalHistory(next);
        return next[0];
      }

      function updateAiTerminalEntry(entryId, patch) {
        const next = readAiTerminalHistory().map((entry) => entry.id === entryId ? { ...entry, ...patch } : entry);
        writeAiTerminalHistory(next);
      }

      function terminalCommandBlockedReason(command) {
        const text = String(command || "").trim();
        if (!text) return "请输入命令";
        const blocked = [
          [/sudo\b/, "需要管理员权限的命令先不在 Loam 里直接执行"],
          [/\brm\s+(-[^\n;&|]*[rf][^\n;&|]*|-[^\n;&|]*[fr][^\n;&|]*)\s+\/?/, "高危删除命令已拦截"],
          [/\b(shutdown|reboot|halt|poweroff)\b/, "关机或重启命令已拦截"],
          [/\bdiskutil\s+erase|\bmkfs\b|\bformat\b/i, "磁盘格式化命令已拦截"],
          [/\bdd\s+.*\bof=/, "dd 写盘命令已拦截"],
          [/\b(chmod|chown)\s+-R\s+.*\//, "递归修改系统路径权限已拦截"],
          [/: *\(\) *\{ *: *\| *: *& *\}/, "fork 炸弹已拦截"],
        ];
        const match = blocked.find(([pattern]) => pattern.test(text));
        return match ? match[1] : "";
      }

      function renderAiTerminalPanel() {
        if (!aiTerminalOpen) return "";
        const entries = readAiTerminalHistory();
        const output = entries.length ? entries.slice(0, 8).map((entry) => {
          const ok = entry.status === "success";
          const running = entry.status === "running";
          const statusLabel = running ? "运行中" : ok ? `完成${entry.code === 0 ? "" : ` · ${entry.code}`}` : "失败";
          const body = entry.output || entry.error || "等待输出...";
          return `
            <article class="ai-terminal-entry">
              <div class="ai-terminal-entry-head">
                <span>$ ${escapeHtml(entry.command || "")}</span>
                <span class="ai-terminal-status${ok || running ? "" : " error"}">${escapeHtml(statusLabel)}</span>
              </div>
              <pre>${escapeHtml(body)}</pre>
            </article>`;
        }).join("") : `<div class="ai-terminal-empty">还没有执行记录。这里不会模拟结果：必须通过本地代理或客户端桥接真实执行。</div>`;
        return `
          <section class="ai-terminal-panel" aria-label="本地终端">
            <div class="ai-terminal-head">
              <span><i data-lucide="terminal"></i> 本地终端</span>
              <small>只在本机执行；高危命令会被拦截</small>
            </div>
            <div class="ai-terminal-command-row">
              <input class="ai-terminal-cwd" data-ai-terminal-cwd value="${escapeHtml(defaultTerminalCwd())}" aria-label="终端目录" />
              <input class="ai-terminal-command" data-ai-terminal-command placeholder="输入命令，例如：pwd 或 rg -n Loam index.html" aria-label="终端命令" />
              <button class="mini-action active" data-ai-terminal-run${aiTerminalRunning ? " disabled" : ""}><i data-lucide="play"></i><span>运行</span></button>
            </div>
            <div class="ai-terminal-actions">
              <button class="mini-action" data-ai-terminal-example="pwd"><span>pwd</span></button>
              <button class="mini-action" data-ai-terminal-example="rg -n TODO index.html"><span>rg</span></button>
              <button class="mini-action" data-ai-terminal-clear><i data-lucide="trash-2"></i><span>清空记录</span></button>
            </div>
            <div class="ai-terminal-output">${output}</div>
          </section>`;
      }

      async function requestTerminalCommand(command, cwd) {
        if (window.loamNative?.runTerminalCommand) {
          return await window.loamNative.runTerminalCommand({ command, cwd });
        }
        const response = await fetch(loamTerminalEndpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ command, cwd }),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || data.proxyError) {
          throw new Error(data.proxyError || `本地终端代理返回 HTTP ${response.status}`);
        }
        return data;
      }

      async function runAiTerminalCommand() {
        if (aiTerminalRunning) return;
        const commandInput = $("[data-ai-terminal-command]", ui.aiChatWorkspace);
        const cwdInput = $("[data-ai-terminal-cwd]", ui.aiChatWorkspace);
        const command = commandInput?.value.trim() || "";
        const cwd = cwdInput?.value.trim() || defaultTerminalCwd();
        const blocked = terminalCommandBlockedReason(command);
        if (blocked) {
          appendAiTerminalHistory({ command, cwd, status: "error", error: blocked });
          renderAiChatWorkspace();
          showToast(blocked);
          return;
        }
        aiTerminalRunning = true;
        const entry = appendAiTerminalHistory({ command, cwd, status: "running", output: "正在调用本地终端..." });
        renderAiChatWorkspace();
        try {
          const result = await requestTerminalCommand(command, cwd);
          const output = [result.stdout, result.stderr].filter(Boolean).join("\n") || "(命令没有输出)";
          updateAiTerminalEntry(entry.id, {
            status: result.ok === false ? "error" : "success",
            code: result.code ?? 0,
            output,
            elapsedMs: result.elapsedMs || 0,
          });
          showToast(result.ok === false ? "终端命令执行失败" : "终端命令已完成");
        } catch (error) {
          updateAiTerminalEntry(entry.id, {
            status: "error",
            error: `无法调用本地终端：${error?.message || error}\n\n请先启动 loam-design/api-proxy.mjs，或在客户端里实现 loamNative.runTerminalCommand。`,
          });
          showToast("本地终端不可用");
        } finally {
          aiTerminalRunning = false;
          renderAiChatWorkspace();
        }
      }
