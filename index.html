        target.scrollIntoView({ block: "center", behavior: "smooth" });
        setTimeout(() => target.classList.remove("note-context-target"), 1600);
        return true;
      }

      function renameNoteTitle(oldTitle, newTitle) {
        const oldClean = cleanNoteTitle(oldTitle);
        const newClean = cleanNoteTitle(newTitle);
        if (!newClean || oldClean === newClean) return;
        if (noteTitleExists(newClean)) {
          setOutput(`不能重命名为《${newClean}》，因为同名笔记已经存在。`);
          showToast("标题已存在");
          return;
        }
        if (oldClean === cleanNoteTitle(activeNoteKey)) {
          renameActiveNote(newClean);
          return;
        }
        const oldKey = `loam-note:${oldClean}`;
        const nextBody = noteBodyWithHeading(safeStorageGetItem(oldKey) || defaultBodyForTitle(oldClean), newClean);
        safeStorageSetItem(`loam-note:${newClean}`, nextBody);
        safeStorageRemoveItem(oldKey);
        transferNoteMeta(oldClean, newClean);
        indexNoteBlocks(newClean, nextBody, { syncExplicit: true });
        syncVisibleNoteTitle(oldClean, newClean);
        $$(".editor-tab span").forEach((tabTitle) => {
          if (cleanNoteTitle(tabTitle.textContent) === oldClean) tabTitle.textContent = newClean;
        });
        setFileModePanel(filePaneMode);
        setOutput(`《${oldClean}》已重命名为《${newClean}》，正文首行和本地保存已同步。`);
        showToast("笔记已重命名");
      }

      function deleteNoteTitle(title) {
        const cleanTitle = cleanNoteTitle(title);
        invalidateNoteKeysCache();
        const deleted = readDeletedNotes();
        deleted.add(cleanTitle);
        writeDeletedNotes(deleted);
        safeStorageRemoveItem(`loam-note:${cleanTitle}`);
        const meta = readNoteMeta();
        const pageId = meta[cleanTitle]?.pageId;
        delete meta[cleanTitle];
        writeNoteMeta(meta);
        removeRelationsForPage(pageId);
        visibleNoteElements(cleanTitle).forEach((el) => el.remove());
        $$(".editor-tab").forEach((tab) => {
          const tabTitle = $("span", tab)?.textContent || "";
          if (cleanNoteTitle(tabTitle) === cleanTitle && $$(".editor-tab").length > 1) tab.remove();
        });
        setFileModePanel(filePaneMode);
        if (cleanTitle === cleanNoteTitle(activeNoteKey)) {
          activeNoteKey = firstAvailableNoteTitle(cleanTitle);
          setDoc("写作", activeNoteKey, `《${cleanTitle}》已删除，已切换到下一篇笔记。`);
          renderNotePage();
        } else {
          setOutput(`《${cleanTitle}》已删除：列表、书签和本地保存都已移除。`);
        }
        showToast("笔记已删除");
      }

      function duplicateNoteTitle(title) {
        const cleanTitle = cleanNoteTitle(title);
        const nextTitle = uniqueNoteTitle(`${cleanTitle} 副本`);
        safeStorageSetItem(`loam-note:${nextTitle}`, noteBodyWithHeading(noteMarkdown(cleanTitle), nextTitle));
        const sourceMeta = getNoteMeta(cleanTitle);
        if (Object.keys(sourceMeta).length) saveNoteMetaTitle(nextTitle, { ...sourceMeta });
        createVisibleNoteRow(nextTitle, sourceMeta.tags?.[0] || "写作");
        addEditorTab(nextTitle);
        openNoteByTitle(nextTitle);
        setOutput(`已复制《${cleanTitle}》为《${nextTitle}》。`);
        showToast("笔记已复制");
      }

      function moveNoteToFolder(title, folderId) {
        const cleanTitle = cleanNoteTitle(title);
        const folder = findFolder(folderId);
        if (!folder) {
          setOutput(`没有找到要移动到的文件夹，请先新建文件夹，或从右键菜单重新选择。`);
          showToast("文件夹不存在");
          return;
        }
        const targetFolderId = folder.id || folder.name;
        if (!safeStorageGetItem(`loam-note:${cleanTitle}`)) {
          safeStorageSetItem(`loam-note:${cleanTitle}`, noteMarkdown(cleanTitle));
        }
        saveNoteMetaTitle(cleanTitle, { folder: targetFolderId });
        setFileModePanel(filePaneMode);
        refreshNoteListVisibility();
        renderFolderPage(folder.id || folder.name);
        setOutput(`《${cleanTitle}》已移动到文件夹《${folder.name}》。文件夹列表、每日笔记归类和当前文件夹页面都已同步。`);
        showToast(`已移动到《${folder.name}》`);
      }

      function notesMovedToFolder(folder) {
        const ids = new Set(folderEntryIds(folder));
        const meta = readNoteMeta();
        return Object.entries(meta)
          .filter(([title, item]) => ids.has(item.folder) && !isNoteDeleted(title))
          .filter(([title]) => !isDailyEntryTitle(title))
          .map(([title, item]) => ({ title, meta: item }));
      }

      function renderMovedNoteCard(item) {
        return `
          <article class="page-card card" data-note-open="${escapeHtml(item.title)}">
            <strong>${escapeHtml(item.title)}</strong>
          </article>`;
      }

      async function copyNotePath(title, format = "path") {
        const path = notePath(title);
        const cleanTitle = cleanNoteTitle(title);
        const value = format === "wikilink" ? `[[${cleanTitle}]]` : format === "markdown" ? `[${cleanTitle}](${path})` : path;
        const copied = await copyText(value);
        setOutput(`已复制：${value}`);
        showToast(copied ? "已复制路径" : "复制失败，请手动选中文字复制");
      }

      function openNoteInDefaultApp(title) {
        const blob = new Blob([noteMarkdown(title)], { type: "text/markdown;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        window.open(url, "_blank", "noopener");
        setTimeout(() => URL.revokeObjectURL(url), 30000);
        setOutput(`《${cleanNoteTitle(title)}》已用 Markdown 预览窗口打开。`);
        showToast("已在默认预览中打开");
      }

      function locateNoteInList(title) {
        setFilePaneMode("files", $('[data-obsidian-action="files"]'));
        if (!focusVisibleNote(title)) {
          createVisibleNoteRow(cleanNoteTitle(title));
          focusVisibleNote(title);
        }
        setOutput(`已在文件列表中定位《${cleanNoteTitle(title)}》。`);
        showToast("已定位");
      }

      function revealNoteStorage(title) {
        locateNoteInList(title);
        setOutput(`访达位置：${notePath(title)}`);
        showToast("已定位到文件储存");
      }

      function cycleNoteIcon(title) {
        const icons = ["文", "书", "稿", "AI", "记"];
        const current = getNoteMeta(title).icon || "";
        const next = icons[(icons.indexOf(current) + 1) % icons.length];
        saveNoteMetaTitle(title, { icon: next });
        setOutput(`《${cleanNoteTitle(title)}》图标已改为 ${next}。`);
        showToast("图标已更改");
      }

      function cycleNoteColor(title) {
        openColorPicker(title, "accent");
      }

      function cycleNoteBackground(title) {
        openColorPicker(title, "bg");
      }

      function togglePinnedNote(title) {
        const cleanTitle = cleanNoteTitle(title);
        const pinnedCard = visibleNoteElements(cleanTitle).find((el) => el.classList.contains("pin-card"));
        if (pinnedCard) {
          pinnedCard.remove();
          saveNoteMetaTitle(cleanTitle, { pinned: false });
          setOutput(`《${cleanTitle}》已取消固定。`);
          showToast("已取消固定");
          return;
        }
        ensurePinnedCard(cleanTitle);
        saveNoteMetaTitle(cleanTitle, { pinned: true });
        setOutput(`《${cleanTitle}》已固定到置顶区。`);
        showToast("已固定");
      }

      function positionNoteContextMenu(x, y) {
        if (!ui.noteContextMenu) return;
        ui.noteContextMenu.hidden = false;
        ui.noteContextMenu.classList.remove("submenu-left", "submenu-up");
        const rect = ui.noteContextMenu.getBoundingClientRect();
        const left = Math.min(x, window.innerWidth - rect.width - 10);
        const top = Math.min(y, window.innerHeight - rect.height - 10);
        ui.noteContextMenu.style.left = `${Math.max(8, left)}px`;
        ui.noteContextMenu.style.top = `${Math.max(8, top)}px`;
        const nextLeft = Number.parseFloat(ui.noteContextMenu.style.left) || 8;
        const nextTop = Number.parseFloat(ui.noteContextMenu.style.top) || 8;
        if (nextLeft + rect.width + 310 > window.innerWidth) ui.noteContextMenu.classList.add("submenu-left");
        if (y + 360 > window.innerHeight || nextTop + rect.height + 220 > window.innerHeight) ui.noteContextMenu.classList.add("submenu-up");
      }

      function noteContextFolderRows(title) {
        const folders = flattenFolders();
        const currentFolder = getNoteMeta(title).folder || "";
        const createRow = `
          <button data-note-context-action="move-new-folder">
            <span>新建文件夹并移入...</span><small>创建后转入</small>
          </button>`;
        if (!folders.length) {
          return `
            <div class="note-context-submenu-label">还没有自定义文件夹</div>
            ${createRow}`;
        }
        return `
          <div class="note-context-submenu-label">选择目标文件夹</div>
          ${folders.map(({ folder, depth }) => {
            const targetId = folder.id || folder.name;
            const isCurrent = currentFolder === targetId;
            const indent = depth ? `${"· ".repeat(depth)}` : "";
            return `
          <button data-note-context-action="move-to-folder" data-folder-id="${escapeHtml(folder.id)}">
            <span>${escapeHtml(`${indent}${folder.name}`)}</span><small>${isCurrent ? "当前" : `${folderEntryCount(folder)} 条`}</small>
          </button>`;
          }).join("")}
          <div class="note-context-submenu-label">没有合适的目标</div>
          ${createRow}`;
      }

      function renderNoteContextMenu(title) {
        const cleanTitle = cleanNoteTitle(title);
        const pinned = Boolean(visibleNoteElements(cleanTitle).find((el) => el.classList.contains("pin-card")));
        ui.noteContextMenu.innerHTML = `
          <div class="note-context-section">
            <button class="active" data-note-context-action="open-tab"><span>在新标签页中打开</span></button>
            <button data-note-context-action="open-right"><span>在右侧打开</span></button>
            <button data-note-context-action="open-left"><span>在左侧打开</span></button>
          </div>
          <div class="note-context-section">
            <button data-note-context-action="change-icon"><span>更改图标</span></button>
            <button data-note-context-action="change-color"><span>更改颜色</span></button>
            <button data-note-context-action="change-bg"><span>更改背景</span></button>
          </div>
          <div class="note-context-section">
            <button data-note-context-action="tag-form"><span>添加标签</span></button>
          </div>
          <div class="note-context-section">
            <button data-note-context-action="toggle-pin"><span>${pinned ? "取消固定笔记" : "固定笔记"}</span></button>
            <div class="note-context-submenu-wrap">
              <button><span>复制路径</span><span>></span></button>
              <div class="note-context-submenu">
                <button data-note-context-action="copy-path"><span>绝对路径</span></button>
                <button data-note-context-action="copy-markdown"><span>Markdown 链接</span></button>
                <button data-note-context-action="copy-wikilink"><span>Wiki 链接</span></button>
              </div>
            </div>
          </div>
          <div class="note-context-section">
            <button data-note-context-action="locate"><span>在文件夹中定位</span></button>
            <button data-note-context-action="reveal-finder"><span>在访达中显示</span></button>
            <button data-note-context-action="open-default"><span>在默认应用中打开</span></button>
          </div>
          <div class="note-context-section">
            <button data-note-context-action="rename-form"><span>重命名笔记</span></button>
            <div class="note-context-submenu-wrap">
              <button><span>移动笔记到...</span><span>></span></button>
              <div class="note-context-submenu">${noteContextFolderRows(cleanTitle)}</div>
            </div>
            <button data-note-context-action="duplicate"><span>复制笔记</span></button>
            <button class="danger" data-note-context-action="delete"><span>删除笔记</span></button>
          </div>`;
      }

      function openNoteContextMenu(title, sourceEl, x, y) {
        const cleanTitle = cleanNoteTitle(title);
        if (!cleanTitle || isNoteDeleted(cleanTitle)) return;
        if (sourceEl?.dataset?.noteMenu) sourceEl = sourceEl.closest(".pin-card, .note-row, [data-note-open], .editor-tab, h1") || sourceEl;
        contextNote = { title: cleanTitle, sourceEl };
        contextFolder = null;
        $$(".note-context-target").forEach((el) => el.classList.remove("note-context-target"));
        sourceEl?.classList?.add("note-context-target");
        renderNoteContextMenu(cleanTitle);
        positionNoteContextMenu(x, y);
      }

      function renderFolderContextMenu(folder) {
        ui.noteContextMenu.innerHTML = `
          <div class="note-context-section">
            <button class="active" data-folder-context-action="open"><span>打开文件夹</span><small>${folderEntryCount(folder)} 条</small></button>
            <button data-folder-context-action="new-child"><span>新建文件夹</span><small>下一级</small></button>
          </div>
          <div class="note-context-section">
            <button data-folder-context-action="move-up"><span>上移文件夹</span></button>
            <button data-folder-context-action="move-down"><span>下移文件夹</span></button>
          </div>
          <div class="note-context-section">
            <button class="danger" data-folder-context-action="delete"><span>删除文件夹</span></button>
          </div>`;
      }

      function openFolderContextMenu(folderId, sourceEl, x, y) {
        const folder = findFolder(folderId);
        if (!folder || folder.system) return;
        contextFolder = { id: folder.id, name: folder.name, sourceEl };
        contextNote = null;
        $$(".note-context-target").forEach((el) => el.classList.remove("note-context-target"));
        sourceEl?.classList?.add("note-context-target");
        renderFolderContextMenu(folder);
        positionNoteContextMenu(x, y);
      }

      function closeNoteContextMenu() {
        if (ui.noteContextMenu) ui.noteContextMenu.hidden = true;
        $$(".note-context-target").forEach((el) => el.classList.remove("note-context-target"));
      }

      function runFolderContextAction(action) {
        if (!contextFolder) return;
        const id = contextFolder.id;
        if (action === "open") {
          renderFolderPage(id);
          closeNoteContextMenu();
          return;
        }
        if (action === "new-child") {
          closeNoteContextMenu();
          createUserFolder(id);
          return;
        }
        if (action === "move-up") {
          moveFolderInTree(id, "up");
          closeNoteContextMenu();
          return;
        }
        if (action === "move-down") {
          moveFolderInTree(id, "down");
          closeNoteContextMenu();
          return;
        }
        if (action === "delete") {
          deleteFolderInTree(id);
          closeNoteContextMenu();
        }
      }

      function showNoteContextForm(kind) {
        if (!ui.noteContextMenu || !contextNote) return;
        const title = contextNote.title;
        const meta = getNoteMeta(title);
        if (kind === "rename") {
          ui.noteContextMenu.innerHTML = `
            <div class="note-context-form">
              <strong>重命名笔记</strong>
              <input data-note-context-input="rename" value="${escapeHtml(title)}" />
              <div class="note-context-form-actions">
                <button data-note-context-action="close-form">取消</button>
                <button class="primary" data-note-context-action="confirm-rename">重命名</button>
              </div>
            </div>`;
        }
        if (kind === "tag") {
          ui.noteContextMenu.innerHTML = `
            <div class="note-context-form">
              <strong>添加标签</strong>
              <input data-note-context-input="tag" value="${escapeHtml((meta.tags || []).join(" "))}" placeholder="写作 AI 复盘" />
              <div class="note-context-form-actions">
                <button data-note-context-action="close-form">取消</button>
                <button class="primary" data-note-context-action="confirm-tag">保存标签</button>
              </div>
            </div>`;
        }
        if (kind === "new-folder") {
          ui.noteContextMenu.innerHTML = `
            <div class="note-context-form">
              <strong>新建并移动到文件夹</strong>
              <input data-note-context-input="folder" placeholder="输入文件夹名称，创建后自动转入" />
              <div class="note-context-form-actions">
                <button data-note-context-action="close-form">取消</button>
                <button class="primary" data-note-context-action="confirm-folder-move">创建并移动</button>
              </div>
            </div>`;
        }
        requestAnimationFrame(() => $("[data-note-context-input]", ui.noteContextMenu)?.focus());
      }

      function runNoteContextAction(action, sourceEl) {
        if (!contextNote) return;
        const title = contextNote.title;
        if (action === "open-tab") {
          addEditorTab(title);
          openNoteByTitle(title);
        }
        if (action === "open-left") {
          openNoteByTitle(title);
          setSplitMode(false);
          setOutput(`《${title}》已在左侧主编辑区打开。`);
        }
        if (action === "open-right") {
          openNoteByTitle(title);
          setSplitMode(true, "preview");
          setOutput(`《${title}》已在右侧分屏打开，左右为 1:1 对照。`);
        }
        if (action === "change-icon") cycleNoteIcon(title);
        if (action === "change-color") cycleNoteColor(title);
        if (action === "change-bg") cycleNoteBackground(title);
        if (action === "tag-form") {
          showNoteContextForm("tag");
          return;
        }
        if (action === "toggle-pin") togglePinnedNote(title);
        if (action === "copy-path") void copyNotePath(title, "path");
        if (action === "copy-markdown") void copyNotePath(title, "markdown");
        if (action === "copy-wikilink") void copyNotePath(title, "wikilink");
        if (action === "locate") locateNoteInList(title);
        if (action === "reveal-finder") revealNoteStorage(title);
        if (action === "open-default") openNoteInDefaultApp(title);
        if (action === "rename-form") {
          showNoteContextForm("rename");
          return;
        }
        if (action === "move-to-folder") moveNoteToFolder(title, sourceEl.dataset.folderId);
        if (action === "move-new-folder") {
          showNoteContextForm("new-folder");
          return;
        }
        if (action === "duplicate") duplicateNoteTitle(title);
        if (action === "delete") deleteNoteTitle(title);
        if (action === "confirm-rename") {
          renameNoteTitle(title, $("[data-note-context-input='rename']", ui.noteContextMenu)?.value);
        }
        if (action === "confirm-tag") {
          const tags = ($("[data-note-context-input='tag']", ui.noteContextMenu)?.value || "")
            .split(/[\s,，、#]+/)
            .map((tag) => tag.trim())
            .filter(Boolean);
          saveNoteMetaTitle(title, { tags: [...new Set(tags)] });
          setOutput(`《${title}》标签已更新：${tags.map((tag) => `#${tag}`).join(" ") || "无标签"}`);
          showToast("标签已保存");
        }
        if (action === "confirm-folder-move") {
          const name = ($("[data-note-context-input='folder']", ui.noteContextMenu)?.value || "").trim();
          if (!name) {
            setOutput("请输入文件夹名称。");
            showToast("请输入文件夹名称");
            return;
          }
          const folders = readUserFolders();
          let targetFolder = findFolder(name, folders);
          if (!targetFolder) {
            targetFolder = normalizeFolder({ name });
            folders.push(targetFolder);
            saveUserFolders(folders);
          }
          setFileModePanel(filePaneMode);
          moveNoteToFolder(title, targetFolder.id || targetFolder.name);
        }
        if (action === "close-form") {
          renderNoteContextMenu(title);
          return;
        }
        closeNoteContextMenu();
      }

      function highlightText(value, phrases) {
        let html = escapeHtml(value);
        phrases.forEach((phrase) => {
          const safePhrase = escapeHtml(phrase);
          html = html.split(safePhrase).join(`<mark class="ai-highlight">${safePhrase}</mark>`);
        });
        return html;
      }

      function generatedAssetStoreKey() {
        return "loam-generated-assets";
      }

      function readGeneratedAssets() {
        try {
          return JSON.parse(safeStorageGetItem(generatedAssetStoreKey()) || "{}");
        } catch {
          return {};
        }
      }

      function writeGeneratedAssets(assets) {
        safeStorageSetItem(generatedAssetStoreKey(), JSON.stringify(assets));
      }

      function resolveImageSrc(src) {
        if (!src.startsWith("loam-generated://")) return src;
        const id = src.replace("loam-generated://", "");
        return readGeneratedAssets()[id]?.src || "";
      }

      function isSafeImageSrc(src) {
        return /^(data:image\/|file:|https?:\/\/)/i.test(src);
      }

      function markdownImageMatches(value) {
        const source = String(value || "");
        const matches = [];
        const imagePattern = /!\[([^\]]*)]\(([^)]+)\)/g;
        let match;
        while ((match = imagePattern.exec(source))) {
          const rawSrc = String(match[2] || "").trim();
          const src = resolveImageSrc(rawSrc);
          matches.push({
            markdown: match[0],
            alt: markdownLabel(match[1] || "图片", "图片"),
            rawSrc,
            src,
            start: match.index,
            end: match.index + match[0].length,
            assetId: rawSrc.startsWith("loam-generated://") ? rawSrc.replace("loam-generated://", "") : "",
          });
        }
        return matches;
      }

      function renderImageFigure(image, index, { deletable = true } = {}) {
        if (!image?.src || !isSafeImageSrc(image.src)) return escapeHtml(image?.markdown || "");
        return `
          <figure data-image-figure="${index}">
            ${deletable ? `<button class="image-delete-button" data-image-delete="${index}" type="button" aria-label="删除图片：${escapeHtml(image.alt)}">删除</button>` : ""}
            <img src="${escapeHtml(image.src)}" alt="${escapeHtml(image.alt)}" loading="lazy" />
            <figcaption>${escapeHtml(image.alt)}</figcaption>
          </figure>`;
      }

      function renderMarkdownPreview(value, options = {}) {
        const source = String(value || "");
        const matches = markdownImageMatches(source);
        let cursor = 0;
        let html = "";
        matches.forEach((image, index) => {
          html += escapeHtml(source.slice(cursor, image.start));
          html += renderImageFigure(image, index, { deletable: options.deletable !== false });
          cursor = image.end;
        });
        html += escapeHtml(source.slice(cursor));
        return html;
      }

      function extractMarkdownImages(value) {
        return markdownImageMatches(value).filter((image) => image.src && isSafeImageSrc(image.src));
      }

      function renderVisualEditor() {
        if (!ui.editSurface || !ui.noteVisualEditor || !ui.noteEditor) return;
        const source = ui.noteEditor.value || "";
        const images = markdownImageMatches(source).filter((image) => image.src && isSafeImageSrc(image.src));
        const shouldShow = images.length > 0 && !splitMode && !visualEditorRawMode;
        ui.editSurface.classList.toggle("visual-mode", shouldShow);
        if (!shouldShow) {
          ui.noteVisualEditor.innerHTML = "";
          return;
        }
        let cursor = 0;
        let html = `<div class="visual-editor-toolbar"><button class="text-button" data-visual-edit-markdown type="button">编辑文字</button></div>`;
        images.forEach((image, index) => {
          const text = source.slice(cursor, image.start);
          if (text) html += `<div class="visual-text-block">${escapeHtml(text)}</div>`;
          html += renderImageFigure(image, index);
          cursor = image.end;
        });
        const tail = source.slice(cursor);
        if (tail) html += `<div class="visual-text-block">${escapeHtml(tail)}</div>`;
        ui.noteVisualEditor.innerHTML = html;
      }

      function syncNoteEditorHeight() {
        if (!ui.noteEditor || !ui.editSurface) return;
        const compact = ui.editSurface.classList.contains("inline-images-mode");
        if (!compact) {
          ui.noteEditor.style.removeProperty("height");
          return;
        }
        ui.noteEditor.style.height = "auto";
        const lineHeight = Number.parseFloat(getComputedStyle(ui.noteEditor).lineHeight) || 24;
        const minHeight = Math.max(96, lineHeight * 4);
        ui.noteEditor.style.height = `${Math.ceil(Math.max(minHeight, ui.noteEditor.scrollHeight + 2))}px`;
      }

      function setInlineImagesMode(enabled) {
        if (!ui.editSurface) return;
        ui.editSurface.classList.toggle("inline-images-mode", Boolean(enabled));
        syncNoteEditorHeight();
      }

      function renderInlineImagePreview() {
        if (!ui.inlineImagePreview || !ui.noteEditor) return;
        renderVisualEditor();
        if (splitMode) {
          setInlineImagesMode(false);
          ui.inlineImagePreview.hidden = true;
          ui.inlineImagePreview.innerHTML = "";
          return;
        }
        if (ui.editSurface?.classList.contains("visual-mode")) {
          setInlineImagesMode(false);
          ui.inlineImagePreview.hidden = true;
          ui.inlineImagePreview.innerHTML = "";
          return;
        }
        const images = extractMarkdownImages(ui.noteEditor.value || "");
        if (!images.length) {
          setInlineImagesMode(false);
          ui.inlineImagePreview.hidden = true;
          ui.inlineImagePreview.innerHTML = "";
          return;
        }
        setInlineImagesMode(true);
        ui.inlineImagePreview.hidden = false;
        ui.inlineImagePreview.innerHTML = images.map((image, index) => renderImageFigure(image, index)).join("");
        syncNoteEditorHeight();
      }

      function renderNotePreview(mode = "preview") {
        if (!ui.notePreview || !ui.noteEditor) return;
        const text = ui.noteEditor.value || "";
        const phrases = mode === "detector" ? antiAiHighlights : [];
        const score = Math.min(96, 32 + phrases.length * 13);
        const head = mode === "detector"
          ? `<div class="detector-head"><span>反 AI 检测</span><span class="detector-score">${phrases.length ? score : 18}% AI 味</span></div>`
          : `<div class="detector-head"><span>分屏预览</span></div>`;
        const body = mode === "detector"
          ? highlightText(text || "开始写作后，这里会显示预览。", phrases)
          : renderMarkdownPreview(text || "开始写作后，这里会显示预览。");
        ui.notePreview.innerHTML = `${head}<div class="comparison-text">${body}</div>`;
      }

      function removeStoredImageAsset(assetId) {
        if (!assetId) return;
        const assets = readGeneratedAssets();
        if (!assets[assetId]) return;
        delete assets[assetId];
        writeGeneratedAssets(assets);
      }

      function removeImageFromEditor(index) {
        if (!ui.noteEditor) return false;
        const source = ui.noteEditor.value || "";
        const images = markdownImageMatches(source);
        const target = images[Number(index)];
        if (!target) {
          showToast("图片不存在");
          return false;
        }
        let start = target.start;
        let end = target.end;
        const lineStart = source.lastIndexOf("\n", Math.max(0, target.start - 1)) + 1;
        const lineEndIndex = source.indexOf("\n", target.end);
        const lineEnd = lineEndIndex === -1 ? source.length : lineEndIndex;
        const lineText = source.slice(lineStart, lineEnd).trim();
        if (lineText === target.markdown.trim()) {
          start = lineStart;
          end = lineEndIndex === -1 ? source.length : lineEndIndex + 1;
          const nextLineEndIndex = source.indexOf("\n", end);
          const nextLineEnd = nextLineEndIndex === -1 ? source.length : nextLineEndIndex + 1;
          const nextLine = source.slice(end, nextLineEnd).trim();
          if (/^>\s*生成依据[:：]/.test(nextLine)) end = nextLineEnd;
        }
        const nextValue = `${source.slice(0, start)}${source.slice(end)}`.replace(/\n{4,}/g, "\n\n\n");
        ui.noteEditor.value = nextValue;
        removeStoredImageAsset(target.assetId);
        saveEditor(editorLoadedNoteKey || activeNoteKey, nextValue);
        renderInlineImagePreview();
        if (splitMode) renderNotePreview(antiAiHighlights.length ? "detector" : "preview");
        setOutput(`已删除图片《${target.alt}》，正文链接和本地图片资产已同步移除。`);
        showToast("图片已删除");
        return true;
      }

      function migrateCurrentEditorImages({ save = true } = {}) {
        if (!ui.noteEditor) return false;
        const migrated = migrateInlineDataImages(ui.noteEditor.value || "");
        if (!migrated.changed) return false;
        ui.noteEditor.value = migrated.value;
        if (save) saveEditor(editorLoadedNoteKey || activeNoteKey, migrated.value);
        return true;
      }

      function setSplitMode(enabled, mode = "preview") {
        if (!ui.editSurface || !ui.notePreview || !ui.noteEditor) {
          showToast("先打开一篇笔记");
          return;
        }
        if (!enabled) migrateCurrentEditorImages();
        splitMode = enabled;
        ui.editSurface.classList.toggle("split-mode", enabled);
        $("#noteTagPanel")?.classList.toggle("split-mode", enabled);
        ui.notePreview.hidden = !enabled;
        if (enabled) renderNotePreview(mode);
        renderInlineImagePreview();
        renderImplicitRelationHint();
      }

      function runAntiAiDetection() {
        if (!ui.noteEditor) {
          showToast("先打开一篇笔记");
          return;
        }
        const text = ui.noteEditor.value || "";
        const patterns = [
          "不是为了记住更多，而是为了更好地思考、连接和创造",
          "放在同一个语境里",
          "每个想法都能继续生长",
          "核心原则",
          "捕捉：",
          "整理：",
          "连接：",
          "输出：",
          "AI 输出",
          "自动归档",
        ];
        antiAiHighlights = patterns.filter((phrase) => text.includes(phrase));
        setSplitMode(true, "detector");
        const model = selectedModelFor("antiAi");
        setRunningTask(`反 AI 检测 · ${model}`, "完成");
        setOutput(antiAiHighlights.length ? `反 AI 检测完成：使用 ${model}，发现 ${antiAiHighlights.length} 处 AI 味表达，已在右侧高亮。` : `反 AI 检测完成：使用 ${model}，暂未发现明显 AI 味表达。`);
        showToast(antiAiHighlights.length ? "已高亮 AI 味表达" : "未发现明显 AI 味");
      }

      function markdownLabel(value, fallback = "Loam 图片") {
        return String(value || fallback)
          .replace(/[\[\]\n\r]/g, " ")
          .replace(/\s+/g, " ")
          .trim()
          .slice(0, 72) || fallback;
      }

      function insertTextAtCursor(text) {
        if (!ui.noteEditor) {
          openWritingNote("已打开当前笔记，可以继续插入内容。");
        }
        if (!ui.noteEditor) return;
        const editor = ui.noteEditor;
        const start = editor.selectionStart ?? editor.value.length;
        const end = editor.selectionEnd ?? start;
        const prefix = start > 0 && !editor.value.slice(0, start).endsWith("\n") ? "\n\n" : "";
        const insertion = `${prefix}${text.trim()}\n\n`;
        editor.value = `${editor.value.slice(0, start)}${insertion}${editor.value.slice(end)}`;
        const cursor = start + insertion.length;
        editor.selectionStart = cursor;
        editor.selectionEnd = cursor;
        editor.focus();
        saveEditor();
        if (splitMode) renderNotePreview(antiAiHighlights.length ? "detector" : "preview");
        renderInlineImagePreview();
      }

      function insertImageFromFile() {
        if (!ui.noteEditor) openWritingNote("已打开当前笔记，可以插入图片。");
        if (!ui.imageInsertInput) return;
        ui.imageInsertInput.value = "";
        ui.imageInsertInput.click();
      }

      function createStoredImageAsset({ alt, src, fileName = "", mime = "", size = 0, source = "inserted" }) {
        const assets = readGeneratedAssets();
        const id = `${source}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
        assets[id] = {
          createdAt: new Date().toISOString(),
          label: alt,
          model: source === "inserted" ? "本地插入" : selectedModelFor("image"),
          note: editorLoadedNoteKey || activeNoteKey,
          src,
          text: fileName || alt,
          mime,
          size,
          source,
        };
        writeGeneratedAssets(assets);
        return id;
      }

      function imageMarkdownForAsset(alt, id) {
        return `![${markdownLabel(alt, "图片")}](loam-generated://${id})`;
      }

      function handleImageFile(file) {
        if (!file || !file.type.startsWith("image/")) {
          showToast("请选择图片文件");
          return;
        }
        const reader = new FileReader();
        reader.addEventListener("load", () => {
          const alt = markdownLabel(file.name.replace(/\.[^.]+$/, ""), "插入图片");
          const id = createStoredImageAsset({
            alt,
            src: String(reader.result || ""),
            fileName: file.name,
            mime: file.type,
            size: file.size,
            source: "inserted",
          });
          insertTextAtCursor(imageMarkdownForAsset(alt, id));
          visualEditorRawMode = false;
          if (splitMode) renderNotePreview("preview");
          renderInlineImagePreview();
          setOutput(`已插入图片《${alt}》，图片已在正文中显示，可直接点图片右上角删除。`);
          showToast("图片已插入");
        });
        reader.readAsDataURL(file);
      }

      function clampGeneratedImageCount(value) {
        const parsed = Number.parseInt(value, 10);
        if (!Number.isFinite(parsed)) return 1;
        return Math.min(3, Math.max(1, parsed));
      }

      function toBase64(value) {
        const bytes = new TextEncoder().encode(value);
        let binary = "";
        bytes.forEach((byte) => { binary += String.fromCharCode(byte); });
        return btoa(binary);
      }

      function wrapSvgText(value, size = 18) {
        const clean = String(value || "").replace(/\s+/g, " ").trim();
        return [clean.slice(0, size), clean.slice(size, size * 2), clean.slice(size * 2, size * 3)]
          .filter(Boolean)
          .map((line, index) => `<text x="72" y="${252 + index * 38}" fill="#e8f2ee" font-size="30" font-weight="700">${escapeHtml(line)}</text>`)
          .join("");
      }

      function createGeneratedImageDataUrl(sourceText, index, total, segmentLabel = "全文内容") {
        const palettes = [
          ["#0c1714", "#7ee36c", "#66a6ff"],
          ["#11151b", "#ffd262", "#7ee36c"],
          ["#101318", "#ff9666", "#8b7cf6"],
        ];
        const [bg, accent, second] = palettes[index % palettes.length];
        const title = markdownLabel(sourceText, "Loam 生成图片");
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
          <defs>
            <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="${bg}"/><stop offset="1" stop-color="#050807"/></linearGradient>
            <radialGradient id="glow" cx="68%" cy="28%" r="62%"><stop stop-color="${accent}" stop-opacity=".42"/><stop offset=".55" stop-color="${second}" stop-opacity=".16"/><stop offset="1" stop-color="${bg}" stop-opacity="0"/></radialGradient>
          </defs>
          <rect width="960" height="540" fill="url(#bg)"/>
          <rect width="960" height="540" fill="url(#glow)"/>
          <g opacity=".18" stroke="#dce9e3" stroke-width="1">${Array.from({ length: 12 }, (_, i) => `<path d="M0 ${70 + i * 38}H960"/>`).join("")}${Array.from({ length: 16 }, (_, i) => `<path d="M${48 + i * 58} 0V540"/>`).join("")}</g>
          <g fill="none" stroke="${accent}" stroke-width="2" opacity=".75">
            <path d="M168 392C292 242 402 354 514 214S714 108 812 182"/>
            <path d="M188 410C318 302 396 428 542 286S742 250 840 326" opacity=".55"/>
          </g>
          <g>
            <circle cx="168" cy="392" r="15" fill="${accent}"/><circle cx="514" cy="214" r="18" fill="${second}"/><circle cx="812" cy="182" r="13" fill="${accent}"/>
            <rect x="614" y="330" width="202" height="82" rx="18" fill="#ffffff" opacity=".08" stroke="#ffffff" stroke-opacity=".18"/>
            <rect x="646" y="362" width="138" height="10" rx="5" fill="${accent}" opacity=".72"/><rect x="646" y="384" width="96" height="8" rx="4" fill="#fff" opacity=".34"/>
          </g>
          <text x="72" y="112" fill="${accent}" font-size="18" font-weight="700" letter-spacing="3">LOAM GENERATED IMAGE ${index + 1}/${total}</text>
          <text x="72" y="176" fill="#ffffff" font-size="58" font-weight="800">${escapeHtml(segmentLabel)}</text>
          ${wrapSvgText(title)}
        </svg>`;
        return `data:image/svg+xml;base64,${toBase64(svg)}`;
      }

      function sourceArticleForImages(value) {
        return String(value || "")
          .replace(/!\[[^\]]*]\([^)]*\)/g, "")
          .replace(/^> (?:prompt|生成依据|内容来源).+$/gm, "")
          .replace(/^## 生成图片\s*$/gm, "")
          .replace(/\n{3,}/g, "\n\n")
          .trim();
      }

      function cleanArticleText(value) {
        return sourceArticleForImages(value)
          .replace(/^#{1,6}\s*/gm, "")
          .replace(/^[-*]\s+/gm, "")
          .replace(/\n{3,}/g, "\n\n")
          .trim();
      }

      function articleImageSource(value) {
        const source = sourceArticleForImages(value);
        const lines = source.split("\n");
        const firstLine = lines[0]?.trim() || "";
        if (/^#{1,6}\s+/.test(firstLine)) {
          return {
            lead: firstLine,
            body: lines.slice(1).join("\n").trim() || firstLine.replace(/^#{1,6}\s+/, ""),
          };
        }
        return { lead: "", body: source };
      }

      function splitIntoUnits(text) {
        const paragraphs = text.split(/\n{2,}/).map((part) => part.trim()).filter(Boolean);
        if (paragraphs.length > 1) return paragraphs;
        const sentences = text.split(/(?<=[。！？.!?])\s*/).map((part) => part.trim()).filter(Boolean);
        return sentences.length > 1 ? sentences : [text.trim()].filter(Boolean);
      }

      function divideUnits(units, count) {
        return Array.from({ length: count }, (_, index) => {
          const start = Math.floor((index * units.length) / count);
          const end = Math.floor(((index + 1) * units.length) / count);
          return units.slice(start, Math.max(start + 1, end)).join("\n\n");
        });
      }

      function divideTextByLength(text, count) {
        const size = Math.ceil(text.length / count);
        return Array.from({ length: count }, (_, index) => text.slice(index * size, (index + 1) * size).trim());
      }

      function getGeneratedImageSegments(count = generatedImageCount) {
        const sourceParts = articleImageSource(ui.noteEditor?.value || defaultBodyForTitle(activeNoteKey));
        const source = sourceParts.body || sourceParts.lead || activeNoteKey || "Loam 当前笔记";
        const nextCount = clampGeneratedImageCount(count);
        if (nextCount === 1) {
          return [{ label: "全文内容", text: source }];
        }
        const labels = nextCount === 2 ? ["上半部分", "下半部分"] : ["第一段内容", "第二段内容", "第三段内容"];
        const units = splitIntoUnits(source);
        const parts = units.length >= nextCount ? divideUnits(units, nextCount) : divideTextByLength(source, nextCount);
        return parts.map((text, index) => ({
          label: labels[index],
          text: text || source,
        }));
      }

      function imageContextPreview() {
        return getGeneratedImageSegments(generatedImageCount)
          .map((segment, index) => {
            const preview = cleanArticleText(segment.text) || segment.text;
            return `图 ${index + 1}｜${segment.label}\n${preview.slice(0, 320)}${preview.length > 320 ? "..." : ""}`;
          })
          .join("\n\n");
      }

      function updateImageContextPreview() {
        if (ui.imagePromptInput) ui.imagePromptInput.value = imageContextPreview();
      }

      function setGeneratedImageCount(count) {
        generatedImageCount = clampGeneratedImageCount(count);
        $$("[data-image-count]").forEach((button) => {
          button.classList.toggle("active", Number(button.dataset.imageCount) === generatedImageCount);
        });
        updateImageContextPreview();
      }

      function openImageGenerator() {
        if (!ui.noteEditor) openWritingNote("已打开当前笔记，可以生成图片。");
        if (!ui.imageModal || !ui.imagePromptInput) return;
        closeCommandMenu();
        setGeneratedImageCount(1);
        ui.imageModal.hidden = false;
        createIcons(ui.imageModal);
        requestAnimationFrame(() => {
          ui.imagePromptInput.focus();
        });
      }

      function closeImageGenerator() {
        if (ui.imageModal) ui.imageModal.hidden = true;
      }

      function createGeneratedImageAsset(segment, index, total) {
        const imageText = cleanArticleText(segment.text) || segment.text;
        const id = `${Date.now().toString(36)}-${index + 1}-${Math.random().toString(36).slice(2, 7)}`;
        const assets = readGeneratedAssets();
        assets[id] = {
          createdAt: new Date().toISOString(),
          label: segment.label,
          model: selectedModelFor("image"),
          note: editorLoadedNoteKey || activeNoteKey,
          src: createGeneratedImageDataUrl(imageText, index, total, segment.label),
          text: imageText.slice(0, 280),
        };
        writeGeneratedAssets(assets);
        return { id, imageText };
      }

      function insertGeneratedImagesIntoArticle(segments) {
        if (!ui.noteEditor) return;
        const sourceParts = articleImageSource(ui.noteEditor.value || defaultBodyForTitle(activeNoteKey));
        const nextValue = segments.map((segment, index) => {
          const asset = createGeneratedImageAsset(segment, index, segments.length);
          const image = `![生成图片 ${index + 1} - ${segment.label}](loam-generated://${asset.id})`;
          const basis = `> 生成依据：${segment.label}｜${asset.imageText.slice(0, 96)}${asset.imageText.length > 96 ? "..." : ""}`;
          return `${segment.text.trim()}\n\n${image}\n${basis}`;
        }).join("\n\n");
        ui.noteEditor.value = `${sourceParts.lead ? `${sourceParts.lead}\n\n` : ""}${nextValue}\n`;
        ui.noteEditor.focus();
        saveEditor();
        visualEditorRawMode = false;
        renderInlineImagePreview();

          return;
        }
        insertGeneratedImagesIntoArticle(segments);
        closeImageGenerator();
        setSplitMode(false);
        const model = selectedModelFor("image");
        setRunningTask(`生成图片 x${count} · ${model}`, "已完成");
        setOutput(`已使用 ${model} 根据当前笔记内容生成 ${count} 张图片，并按 ${segments.map((segment) => segment.label).join("、")} 植入原文。`);

      function runDetailCommand(commandEl) {
        const command = commandEl.dataset.detailCommand;
        const title = commandEl.dataset.detailTitle || ui.heading.textContent;
        const type = commandEl.dataset.detailType || "detail";
        $$("[data-detail-command]").forEach((item) => item.classList.remove("active"));
        commandEl.classList.add("active");

        const promptText = `${title}\n\n类型：${type}\n动作：${command}\n来源：Loam 当前详情页`;

        if (command === "open-source") {
          activeNoteKey = "如何构建第二大脑";
          setDoc("写作", activeNoteKey, `已从《${title}》打开来源笔记。`);
          renderNotePage();
          return;
        }

        if (command === "switch-model") {
          openSettingsModal("backend");
          setOutput(`已从《${title}》打开独立设置窗口：后台 API 配置在这里。`);
          return;
        }

        if (command === "sync-vault") {
          commandEl.textContent = "已同步";
          setOutput(`《${title}》已同步到本地 vault：assets/${type}。`);
          showToast("已同步到本地 vault");
          return;
        }

        if (command === "write-back") {
          const key = `loam-note:${activeNoteKey}`;
          const current = safeStorageGetItem(key) || defaultBodyForTitle(activeNoteKey);
          safeStorageSetItem(key, `${current}\n\n## ${title}\n\n${ui.aiOutput.textContent || promptText}\n`);
          setOutput(`《${title}》已写回当前笔记。返回笔记后可以在编辑器里看到追加内容。`);
          showToast("已写回笔记");
          return;
        }

        if (command === "regenerate") {
          setRunningTask(`重新生成：${title}`);
          setOutput(`已重新生成《${title}》：新的结果会覆盖当前详情预览，并保留旧版本。`);
          showToast("已重新生成");
          return;
        }

        if (command === "copy-prompt") {
          void copyText(promptText).then((copied) => {
            setOutput(`《${title}》的 prompt ${copied ? "已复制" : "复制失败"}。`);
            showToast(copied ? "prompt 已复制" : "复制失败，请手动选中文字复制");

          return;
        }

        if (command === "export-file") {
          const blob = new Blob([promptText], { type: "text/markdown;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = `${title}.md`;
          link.click();
          setTimeout(() => URL.revokeObjectURL(url), 0);
          setOutput(`《${title}》已导出为 Markdown 文件。`);
          showToast("文件已导出");
          return;
        }

        if (command === "open-relations") {
          renderDetailPage("relations", `${title} 的关联对象`);
          return;
        }

        if (command === "open-versions") {
          renderDetailPage("versions", `${title} 的版本`);
          return;
        }

        setOutput(`《${title}》的可执行动作已展开：可以写回、重新生成、复制 prompt 或导出。`);
        showToast("详情动作已打开");
      }

      function noteStorageKey(title = activeNoteKey) {
        return `loam-note:${cleanNoteTitle(title)}`;
      }

      function defaultBodyForTitle(title = activeNoteKey) {
        const cleanTitle = cleanNoteTitle(title);
        if (cleanTitle === "如何构建第二大脑") return defaultNoteBody;
        return `# ${cleanTitle}\n\n`;
      }

      function syncEditorHeadingToTitle(title = activeNoteKey) {
        if (!ui.noteEditor) return false;
        const cleanTitle = cleanNoteTitle(title);
        const targetHeading = `# ${cleanTitle}`;
        const body = ui.noteEditor.value || "";
        if (!body.trim()) {
          ui.noteEditor.value = `${targetHeading}\n\n`;
          return true;
        }

        const lines = body.split("\n");
        const firstTextLine = lines.findIndex((line) => line.trim());
        if (firstTextLine >= 0 && /^#\s+/.test(lines[firstTextLine].trim())) {
          if (lines[firstTextLine].trim() === targetHeading) return false;
          lines[firstTextLine] = targetHeading;
          ui.noteEditor.value = lines.join("\n");
          return true;
        }

        ui.noteEditor.value = `${targetHeading}\n\n${body}`;
        return true;
      }

      function migrateInlineDataImages(markdown) {
        let changed = false;
        const value = String(markdown || "").replace(/!\[([^\]]*)]\((data:image\/[^)\s]+)\)/gi, (match, altText, src) => {
          try {
            const alt = markdownLabel(altText, "插入图片");
            const mime = String(src).match(/^data:([^;,]+)/i)?.[1] || "image/*";
            const id = createStoredImageAsset({
              alt,
              src,
              fileName: "旧版内联图片",
              mime,
              size: src.length,
              source: "migrated",
            });
            changed = true;
            return imageMarkdownForAsset(alt, id);
          } catch (error) {
            console.warn("Loam inline image migration skipped", error);
            return match;
          }
        });
        return { value, changed };
      }

      function loadEditor() {
        if (!ui.noteEditor) return;
        const loadedTitle = cleanNoteTitle(activeNoteKey);
        editorLoadedNoteKey = loadedTitle;
        const stored = safeStorageGetItem(noteStorageKey(loadedTitle));
        const migrated = migrateInlineDataImages(stored ?? defaultBodyForTitle(loadedTitle));
        ui.noteEditor.value = migrated.value;
        const headingChanged = syncEditorHeadingToTitle(loadedTitle);
        if (migrated.changed || headingChanged) saveEditor(loadedTitle, ui.noteEditor.value);
        renderInlineImagePreview();
        indexNoteBlocks(loadedTitle, ui.noteEditor.value, { syncExplicit: true });
        scheduleImplicitRelationScan();
      }

      function saveEditor(title = editorLoadedNoteKey || activeNoteKey, value = ui.noteEditor?.value || "", options = {}) {
        if (!title) return false;
        const cleanTitle = cleanNoteTitle(title);
        const key = noteStorageKey(cleanTitle);
        const hadLocalRow = visibleNoteElements(cleanTitle).some((el) => el.classList.contains("note-row"));
        try {
          try {
            safeStorageSetItem(key, value);
          } catch (error) {
            if (!isStorageQuotaError(error)) throw error;
            const keptChats = compactAiConversationsForStorage();
            safeStorageSetItem(key, value);
            setOutput(`本地空间已整理：保留最近 ${keptChats} 条 AI 对话后，继续保存《${cleanTitle}》。`);
          }
          if (safeStorageGetItem(key) !== value) throw new Error("本地写入校验失败");
          invalidateNoteKeysCache();
          try {
            const meta = readNoteMeta();
            const previous = meta[cleanTitle] || {};
            const createdAt = stableNoteCreatedAt(cleanTitle, 0, value);
            meta[cleanTitle] = { ...previous, createdAt, updatedAt: Date.now() };
            try {
              writeNoteMeta(meta);
            } catch (error) {
              if (!isStorageQuotaError(error)) throw error;
              compactAiConversationsForStorage();
              writeNoteMeta(meta);
            }
          } catch (error) {
            console.warn("Loam note meta sync failed after content save", error);
            setOutput(`《${cleanTitle}》正文已保存；元数据暂时同步失败：${error?.message || error}`);
          }
          indexNoteBlocks(cleanTitle, value, { syncExplicit: true });
          if (cleanTitle === cleanNoteTitle(editorLoadedNoteKey)) editorLoadedNoteKey = cleanTitle;
          if (cleanTitle === cleanNoteTitle(activeNoteKey)) scheduleImplicitRelationScan();
          if (options.render !== false || !hadLocalRow) syncLocalNoteListAfterSave();
          return true;
        } catch (error) {
          console.error("Loam note save failed", error);
          setOutput(`《${cleanTitle}》保存失败：${error?.message || error}`);
          showToast(`保存失败：${error?.name || error?.message || "本地异常"}`);
          return false;
        }
      }

      function flushPendingEditorSave() {
        clearTimeout(saveTimer);
        saveTimer = 0;
        if (ui.noteEditor) saveEditor(editorLoadedNoteKey || activeNoteKey, ui.noteEditor.value);
      }

      function scheduleSave() {
        clearTimeout(saveTimer);
        const titleAtSchedule = editorLoadedNoteKey || activeNoteKey;
        const valueAtSchedule = ui.noteEditor?.value || "";
        const delay = readEditorSettings().autoSaveDelay || 260;
        saveTimer = setTimeout(() => {
          saveEditor(titleAtSchedule, valueAtSchedule, { render: false });
          if (titleAtSchedule === activeNoteKey) {
            renderCurrentNoteTags();
            refreshSpaceNav(spaceForTitle(activeNoteKey)?.label || "写作");
            if (splitMode) renderNotePreview(antiAiHighlights.length ? "detector" : "preview");
            renderInlineImagePreview();
          }
        }, delay);
      }

      function appendAiToEditor() {
        if (!ui.noteEditor) return;
        ui.noteEditor.value += `\n\n## AI 输出\n\n${ui.aiOutput.textContent}\n`;

      function exportMarkdown() {
        if (!ui.noteEditor) return;

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `${activeNoteKey || "loam-note"}.md`;
        link.click();
        URL.revokeObjectURL(url);
        showToast("Markdown 已导出");

      function safeExportFilename(name, ext = "md") {
        const clean = cleanNoteTitle(name).replace(/[\\/:*?"<>|#\[\]]/g, " ").replace(/\s+/g, " ").trim() || "loam";
        return `${clean}.${ext.replace(/^\./, "")}`;
      }

      function downloadTextFile(filename, content, type = "text/plain;charset=utf-8") {
        const blob = new Blob([content], { type });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        link.hidden = true;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 0);

      function importExportLog(message) {
        const log = $("[data-import-export-log]");

      function importTitleFromMarkdown(text, fallback) {
        const heading = String(text || "").split("\n").map((line) => line.trim()).find((line) => /^#\s+/.test(line));
        return cleanNoteTitle((heading || "").replace(/^#\s+/, "") || fallback || "导入笔记");
      }

      function loamStorageSnapshot() {
        const sensitiveKeys = new Set(["loam-provider-api-configs"]);
        const storage = {};
        for (const key of safeStorageKeys("loam-")) {
          if (!key?.startsWith("loam-") || sensitiveKeys.has(key)) continue;
          storage[key] = safeStorageGetItem(key);
        }
        const notes = catalogNoteTitles().map((title) => ({
          title,
          body: noteMarkdown(title),
          meta: getNoteMeta(title),
        }));
        return {
          app: "Loam",
          version: 1,
          exportedAt: new Date().toISOString(),
          vault: vaultStoragePath(),
          activeNote: activeNoteKey,
          notes,
          localStorage: storage,
          excludes: ["API Key 不会导出"],
        };
      }

      function countLocalStoragePrefix(prefix) {
        return safeStorageKeys(prefix).length;
      }

      function exportCurrentNoteMarkdown() {
        flushPendingEditorSave();
        const title = activeNoteKey || "未命名笔记";
        downloadTextFile(safeExportFilename(title, "md"), noteMarkdown(title), "text/markdown;charset=utf-8");

        downloadTextFile(`Loam 全部笔记 ${new Date().toISOString().slice(0, 10)}.md`, body || "# Loam 全部笔记\n\n", "text/markdown;charset=utf-8");
        importExportLog(`已导出全部 Markdown：${titles.length} 篇笔记合并为一个文件。`);
        showToast("全部笔记已导出");

        downloadTextFile(`Loam 备份 ${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(backup, null, 2), "application/json;charset=utf-8");
        importExportLog(`已导出 Loam 本地备份：${backup.notes.length} 篇笔记，API Key 已排除。`);

      async function importMarkdownFiles(files) {
        const list = [...(files || [])].filter(Boolean);
        if (!list.length) return;
        let imported = 0;
        const titles = [];
        for (const file of list) {
          const text = await file.text();
          const fallback = String(file.name || "导入笔记").replace(/\.[^.]+$/, "");
          const baseTitle = importTitleFromMarkdown(text, fallback);
          const created = createNewStorageNote(baseTitle, (title) => noteBodyWithHeading(text, title));
          saveNoteMetaTitle(created.title, { tags: ["导入"], importedAt: new Date().toISOString(), sourceFile: file.name || "" });
          createVisibleNoteRow(created.title, "导入");
          imported += 1;
          titles.push(created.title);
        }
        if (titles[0]) openNoteByTitle(titles[0]);
        importExportLog(`已导入 ${imported} 个 Markdown / 文本文件：${titles.join("、")}。`);
        showToast(`已导入 ${imported} 篇笔记`);
      }

      async function importLoamBackupFiles(files) {
        const list = [...(files || [])].filter(Boolean);
        if (!list.length) return;
        let importedNotes = 0;
        let restoredKeys = 0;
        let skippedKeys = 0;
        for (const file of list) {
          const raw = await file.text();
          const backup = JSON.parse(raw);
          const notes = Array.isArray(backup.notes) ? backup.notes : [];
          for (const note of notes) {
            if (!note?.title && !note?.body) continue;
            const created = createNewStorageNote(note.title || "导入笔记", (title) => noteBodyWithHeading(note.body || "", title));
            saveNoteMetaTitle(created.title, { ...(note.meta || {}), importedAt: new Date().toISOString(), sourceFile: file.name || "" });
            createVisibleNoteRow(created.title, getNoteMeta(created.title).tags?.[0] || "导入");
            importedNotes += 1;
          }
          const storage = backup.localStorage && typeof backup.localStorage === "object" ? backup.localStorage : {};
          Object.entries(storage).forEach(([key, value]) => {
            if (!key.startsWith("loam-") || key.startsWith("loam-note:") || key === noteMetaStoreKey() || key === "loam-provider-api-configs") return;
            if (safeStorageGetItem(key) !== null) {
              skippedKeys += 1;
              return;
            }
            safeStorageSetItem(key, String(value ?? ""));
            restoredKeys += 1;
          });
        }
        invalidateNoteKeysCache();
        if (importedNotes) {
          refreshSpaceNav(spaceForTitle(activeNoteKey)?.label || "写作");
          renderImportExportPage();
        }
        importExportLog(`Loam 备份已合并导入：新增 ${importedNotes} 篇笔记，恢复 ${restoredKeys} 个本地配置，跳过 ${skippedKeys} 个已存在配置。`);
        showToast("备份已合并导入");
      }

      function runImportExportAction(action) {

        if (action === "export-current") exportCurrentNoteMarkdown();
        if (action === "export-all-md") exportAllNotesMarkdown();
        if (action === "export-backup") exportLoamBackupJson();
        if (action === "copy-current") copyCurrentNoteMarkdown();
      }

      function resetEditor() {

          openSettingsModal(option || "about", !routeLock);
          return;
        }
        if (pageName === "providers") {
          openSettingsModal("providers", !routeLock);

      function restoreRouteFromHash() {
        if (routeLock) return;
        if (ignoreNextHashRestore) {
          ignoreNextHashRestore = false;
          return;
        }
        const hash = window.location.hash.replace(/^#/, "");
        if (!hash) return;
        const [kind, first, second] = hash.split("/");
        if (ui.aiChatWorkspace && !ui.aiChatWorkspace.hidden) closeAiChatForNavigation(kind);
        if (isSettingsHashRoute()) {
          clearSettingsHashRoute();
          setEditorActionBarVisible(true);
          setDoc("写作", activeNoteKey, "设置不会在刷新后自动弹出。");
          renderNotePage();
          return;
        }
        routeLock = true;
        muteRouteToasts = true;
        try {
          if (kind === "page") openPageByName(first || "home", decodeRoutePart(second));
          if (kind === "detail") renderDetailPage(decodeRoutePart(first), decodeRoutePart(second));
          if (kind === "space") {
            const label = decodeRoutePart(first);
            if (label === "写作") openWritingNote("已从写作空间恢复当前笔记。");
            else renderSpacePage(label);
          }
          if (kind === "tag") renderTagPage(decodeRoutePart(first));
          if (kind === "folder") renderFolderPage(decodeRoutePart(first));
          if (kind === "note") {
            const routeTitle = decodeRoutePart(first) || activeNoteKey;
            activeNoteKey = isNoteDeleted(routeTitle) ? firstAvailableNoteTitle(routeTitle) : routeTitle;
            setDoc("写作", activeNoteKey, "已从路由恢复当前笔记。");
            renderNotePage();
          }
        } finally {
          muteRouteToasts = false;
          routeLock = false;
        }
      }

      document.addEventListener("pointerdown", (event) => {
        const canvasCard = event.target.closest?.(".canvas-card");
        const canvasPage = event.target.closest?.(".canvas-page");
        const resizeTarget = canvasResizePointerTarget(event, canvasCard);
        if (resizeTarget && event.button === 0) {
          event.preventDefault();
          const card = resizeTarget.card;
          const page = resizeTarget.page;
          const state = readCanvasState(page?.dataset.canvasTitle || "新白板");
          if (state.settings.readonly) return;
          const node = state.nodes.find((item) => item.id === resizeTarget.nodeId);
          if (!card || !node) return;
          activeCanvasNodeId = node.id;
          canvasEditingNodeId = "";
          card.classList.add("resizing", "selected");
          canvasDragState = {
            kind: "resize",
            card,
            title: page?.dataset.canvasTitle || "新白板",
            id: node.id,
            startClientX: event.clientX,
            startClientY: event.clientY,
            startWidth: Number(node.width) || card.offsetWidth || 320,
            startHeight: Number(node.height) || card.offsetHeight || 126,
            zoom: state.zoom || 1,
          };
          resizeTarget.captureTarget?.setPointerCapture?.(event.pointerId);
          return;
        }
        if (canvasCard && event.button === 0 && event.metaKey && !event.target.closest?.("[data-canvas-node-toolbar], [data-canvas-color-popover], [data-canvas-resize-handle]")) {
          event.preventDefault();
          const page = canvasCard.closest(".canvas-page");
          const state = readCanvasState(page?.dataset.canvasTitle || "新白板");
          if (state.settings.readonly) return;
          const node = state.nodes.find((item) => item.id === canvasCard.dataset.canvasNodeId);
          if (!node) return;
          activeCanvasNodeId = node.id;
          canvasEditingNodeId = "";
          canvasCard.classList.add("resizing", "selected");
          canvasDragState = {
            kind: "resize",
            card: canvasCard,
            title: page?.dataset.canvasTitle || "新白板",
            id: node.id,
            startClientX: event.clientX,
            startClientY: event.clientY,
            startWidth: Number(node.width) || canvasCard.offsetWidth || 320,
            startHeight: Number(node.height) || canvasCard.offsetHeight || 126,
            zoom: state.zoom || 1,
          };
          canvasCard.setPointerCapture?.(event.pointerId);
          return;
        }
        if (canvasCard && event.button === 0 && event.detail >= 2 && !event.target.closest?.("[data-canvas-node-toolbar], [data-canvas-color-popover], [data-canvas-resize-handle]")) {
          event.preventDefault();
          editCanvasNode(canvasCard.closest(".canvas-page")?.dataset.canvasTitle || "新白板", canvasCard.dataset.canvasNodeId);
          return;
        }
        const editableCanvasText = event.target.closest?.("[data-canvas-node-content], [data-canvas-node-title]");
        if (event.target.closest?.("[data-canvas-node-toolbar], [data-canvas-color-popover]") || editableCanvasText?.getAttribute("contenteditable") === "true") return;
        if (canvasCard && event.button === 0) {
          event.preventDefault();
          const page = canvasCard.closest(".canvas-page");
          const state = readCanvasState(page?.dataset.canvasTitle || "新白板");
          if (state.settings.readonly) return;
          const node = state.nodes.find((item) => item.id === canvasCard.dataset.canvasNodeId);
          if (!node) return;
          canvasCard.classList.add("dragging");
          canvasDragState = {
            kind: "node",
            card: canvasCard,
            title: page?.dataset.canvasTitle || "新白板",
            id: node.id,
            startClientX: event.clientX,
            startClientY: event.clientY,
            startX: Number(node.x) || 0,
            startY: Number(node.y) || 0,
            zoom: state.zoom || 1,
          };
          canvasCard.setPointerCapture?.(event.pointerId);
          return;
        }
        if (canvasPage && !canvasCard && event.button === 0 && event.detail >= 2 && !canvasSpacePressed) {
          event.preventDefault();
          const state = readCanvasState(canvasPage.dataset.canvasTitle || "新白板");
          if (!state.settings.readonly) {
            const pageRect = canvasPage.getBoundingClientRect();
            const x = Math.round((event.clientX - pageRect.left - (state.panX || 0)) / (state.zoom || 1)) - 160;
            const y = Math.round((event.clientY - pageRect.top - (state.panY || 0)) / (state.zoom || 1)) - 63;
            addCanvasNode(canvasPage.dataset.canvasTitle || "新白板", "card", x, y);
          }
          return;
        }
        if (canvasPage && canvasSpacePressed && event.button === 0) {
          event.preventDefault();
          const state = readCanvasState(canvasPage.dataset.canvasTitle || "新白板");
          canvasDragState = {
            kind: "pan",
            page: canvasPage,
            title: canvasPage.dataset.canvasTitle || "新白板",
            startClientX: event.clientX,
            startClientY: event.clientY,
            startPanX: state.panX || 0,
            startPanY: state.panY || 0,
          };
          canvasPage.setPointerCapture?.(event.pointerId);
          return;
        }
        const fileResizer = event.target.closest?.("[data-file-resizer]");
        const rightResizer = event.target.closest?.("[data-right-resizer]");
        if (!fileResizer && !rightResizer) return;
        event.preventDefault();
        resizingFilePanel = Boolean(fileResizer);
        resizingRightPanel = Boolean(rightResizer);
        ui.windowShell?.classList.toggle("resizing-file", resizingFilePanel);
        ui.windowShell?.classList.toggle("resizing-right", resizingRightPanel);
        event.target.setPointerCapture?.(event.pointerId);
      });

      document.addEventListener("pointermove", (event) => {
        if (canvasDragState) {
          if (canvasDragState.kind === "pan") {
            const panX = canvasDragState.startPanX + event.clientX - canvasDragState.startClientX;
            const panY = canvasDragState.startPanY + event.clientY - canvasDragState.startClientY;
            canvasDragState.page.style.setProperty("--canvas-pan-x", `${Math.round(panX)}px`);
            canvasDragState.page.style.setProperty("--canvas-pan-y", `${Math.round(panY)}px`);
            return;
          }
          if (canvasDragState.kind === "resize") {
            const state = readCanvasState(canvasDragState.title);
            const nextWidth = Math.max(160, canvasDragState.startWidth + (event.clientX - canvasDragState.startClientX) / canvasDragState.zoom);
            const nextHeight = Math.max(86, canvasDragState.startHeight + (event.clientY - canvasDragState.startClientY) / canvasDragState.zoom);
            canvasDragState.card.style.setProperty("--canvas-node-width", `${snapCanvasValue(nextWidth, state.settings.snap)}px`);
            canvasDragState.card.style.setProperty("--canvas-node-height", `${snapCanvasValue(nextHeight, state.settings.snap)}px`);
            return;
          }
          const state = readCanvasState(canvasDragState.title);
          const nextX = canvasDragState.startX + (event.clientX - canvasDragState.startClientX) / canvasDragState.zoom;
          const nextY = canvasDragState.startY + (event.clientY - canvasDragState.startClientY) / canvasDragState.zoom;
          canvasDragState.card.style.left = `${snapCanvasValue(nextX, state.settings.snap)}px`;
          canvasDragState.card.style.top = `${snapCanvasValue(nextY, state.settings.snap)}px`;
          return;

        if (!resizingFilePanel && !resizingRightPanel) return;
        if (resizingFilePanel) {
          const sidebarRight = ui.sidebar?.getBoundingClientRect().right || 0;
          setFilePanelWidth(event.clientX - sidebarRight);

        if (resizingRightPanel) {
          setRightPanelWidth(window.innerWidth - event.clientX - 8);

              panY: parseInt(canvasDragState.page.style.getPropertyValue("--canvas-pan-y"), 10) || 0,

          if (canvasDragState.kind === "resize") {

        const title = page.dataset.canvasTitle || "新白板";
        const state = readCanvasState(title);

        const oldZoom = state.zoom || 1;
        const factor = Math.exp(-event.deltaY * 0.002);
        const newZoom = Math.max(0.2, Math.min(3, oldZoom * factor));
        const pageRect = page.getBoundingClientRect();
        const mouseX = event.clientX - pageRect.left;
        const mouseY = event.clientY - pageRect.top;
        const newPanX = Math.round(mouseX - (mouseX - (state.panX || 0)) * (newZoom / oldZoom));
        const newPanY = Math.round(mouseY - (mouseY - (state.panY || 0)) * (newZoom / oldZoom));
        writeCanvasState(title, { ...state, zoom: newZoom, panX: newPanX, panY: newPanY });
        page.style.setProperty("--canvas-zoom", String(newZoom));
        page.style.setProperty("--canvas-pan-x", `${newPanX}px`);

      if (window.location.hash) restoreRouteFromHash();
      else {
        setEditorActionBarVisible(true);
        updateNoteChromeTitle(activeNoteKey);
        loadEditor();
      }
      setFileModePanel(filePaneMode);
      renderRightPanel(currentRightPanel);
      // Critical first paint: theme + width vars first so layout doesn't flash.
      restoreTheme();
      restoreDensity();
      restoreEditorFontSize();
      restoreFilePanelWidth();
      restoreRightPanelLayout();
      // Render visible content (note list, current note already loaded above).
      renderLocalNoteList();
      refreshNoteListVisibility();
      restoreEditorSettings();
      document.addEventListener("keydown", handleEditorSmartKeydown, true);
      // Defer non-critical work to idle time so the first paint is faster.
      const _idle = window.requestIdleCallback || ((cb) => setTimeout(cb, 60));
      _idle(() => {
        refreshSpaceNav(spaceForTitle(activeNoteKey)?.label || "写作");
        refreshStackLabels();
        syncButtonTitles(document);
        // 命令菜单按需渲染（toggleCommandMenu 第一次调用时再 render）
      });
    </script>
  </body>
</html>
