        renderAiChatWorkspace();
        if (aiTerminalOpen) requestAnimationFrame(() => $("[data-ai-terminal-command]", ui.aiChatWorkspace)?.focus());

        writeAiTerminalHistory([]);
        renderAiChatWorkspace();
        showToast("终端记录已清空");

      function readAiLastModels() {
        try {
          return JSON.parse(safeStorageGetItem(aiLastModelStoreKey()) || "{}") || {};
        } catch {
          return {};
        }
      }

      function readAiWebSearchEnabled() {
        return safeStorageGetItem(aiWebSearchStoreKey()) === "1";
      }

      function writeAiWebSearchEnabled(enabled) {
        safeStorageSetItem(aiWebSearchStoreKey(), enabled ? "1" : "0");
      }

      function toggleAiWebSearch() {
        const enabled = !readAiWebSearchEnabled();
        writeAiWebSearchEnabled(enabled);
        renderAiChatWorkspace();
        showToast(enabled ? "联网搜索已开启" : "联网搜索已关闭");
      }

      function readAiChatDraft() {
        return safeStorageGetItem(aiChatDraftStoreKey()) || "";
      }

      function writeAiChatDraft(value = "") {
        if (value) safeStorageSetItem(aiChatDraftStoreKey(), value);
        else safeStorageRemoveItem(aiChatDraftStoreKey());
      }

      function insertTextIntoAiInput(text = "") {
        const input = $("#aiChatInput", ui.aiChatWorkspace);
        if (!input || !text) return false;
        input.focus();
        const start = input.selectionStart ?? input.value.length;
        const end = input.selectionEnd ?? input.value.length;
        input.value = `${input.value.slice(0, start)}${text}${input.value.slice(end)}`;
        const nextCursor = start + text.length;
        input.setSelectionRange(nextCursor, nextCursor);
        writeAiChatDraft(input.value);
        input.dispatchEvent(new Event("input", { bubbles: true }));
        return true;
      }

      async function readClipboardText() {
        try {
          const response = await fetch(loamClipboardEndpoint, { cache: "no-store" });
          const data = await response.json().catch(() => ({}));
          if (response.ok && data.ok) return data.text || "";
        } catch {
          // Fall through to the browser clipboard API.
        }
        if (navigator.clipboard?.readText && window.isSecureContext) {
          try {
            const text = await navigator.clipboard.readText();
            if (text) return text;
          } catch {
            // Report the local proxy failure below.
          }
        }
        throw new Error("无法读取系统剪贴板");
      }

      async function pasteIntoAiChatInput() {
        try {
          const text = await readClipboardText();
          if (!text) {
            showToast("剪贴板没有可粘贴的文字");
            return;
          }
          insertTextIntoAiInput(text);
          showToast("已粘贴到对话框");
        } catch (error) {
          $("#aiChatInput", ui.aiChatWorkspace)?.focus();
          showToast(`粘贴失败：${error?.message || "请用 ⌘V / Ctrl+V"}`);
        }
      }

      function saveAiLastModel(route, model) {
        const routeKey = route === "chat" ? "writing" : route || "writing";
        const options = modelRouteGroups[routeGroupFor(routeKey)] || modelRouteGroups.text;
        if (!options.includes(model)) return;
        safeStorageSetItem(aiLastModelStoreKey(), JSON.stringify({ ...readAiLastModels(), [routeKey]: model }));
      }

      function lastModelForRoute(route = "writing") {
        const routeKey = route === "chat" ? "writing" : route || "writing";
        const options = modelRouteGroups[routeGroupFor(routeKey)] || modelRouteGroups.text;
        const stored = readAiLastModels()[routeKey];
        const fallback = selectedModelFor(routeKey);
        return options.includes(stored) ? stored : options.includes(fallback) ? fallback : selectedModelFor("writing");
      }

      function modelForAiConversation(chat) {
        const route = chat.route || "writing";
        const options = modelRouteGroups[routeGroupFor(route)] || modelRouteGroups.text;
        return chat.model && options.includes(chat.model) ? chat.model : lastModelForRoute(route);
      }

      function providerReadyForApi(provider) {
        const configs = getProviderApiConfigs();
        const config = normalizeProviderApiConfig(provider, configs[provider] || {});
        return Boolean(config.apiKey && config.baseUrl && config.defaultModel && !providerApiKeyError(config.apiKey));
      }

      function firstReadyModelForRoute(route, preferredModel = "") {
        const routeKey = route === "chat" ? "writing" : route || "writing";
        const options = modelRouteGroups[routeGroupFor(routeKey)] || modelRouteGroups.text;
        const preferred = options.includes(preferredModel) ? preferredModel : "";
        const stored = readAiLastModels()[routeKey];
        const fallback = selectedModelFor(routeKey);
        const candidates = [preferred, stored, fallback, ...options].filter(Boolean);
        return candidates.find((model) => options.includes(model) && providerReadyForApi(model)) || "";
      }

      function runnableModelForRoute(route, preferredModel = "") {
        const routeKey = route === "chat" ? "writing" : route || "writing";
        const options = modelRouteGroups[routeGroupFor(routeKey)] || modelRouteGroups.text;
        if (options.includes(preferredModel) && providerReadyForApi(preferredModel)) return preferredModel;
        return firstReadyModelForRoute(routeKey, preferredModel) || (options.includes(preferredModel) ? preferredModel : lastModelForRoute(routeKey));
      }

      function ensureAiConversation() {
        const conversations = readAiConversations();
        if (!conversations.length) {
          const chat = normalizeAiConversation({ title: "新的 AI 对话", route: "writing", model: lastModelForRoute("writing") });
          writeAiConversations([chat]);
          activeAiChatId = chat.id;
          safeStorageSetItem(aiActiveChatStoreKey(), chat.id);
          return chat;
        }
        const storedActiveId = activeAiChatId || safeStorageGetItem(aiActiveChatStoreKey()) || "";
        const active = conversations.find((chat) => chat.id === storedActiveId) || conversations[0];
        activeAiChatId = active.id;
        safeStorageSetItem(aiActiveChatStoreKey(), active.id);
        return active;
      }

      function saveAiConversation(chat) {
        const conversations = readAiConversations();
        const nextChat = normalizeAiConversation({ ...chat, updatedAt: Date.now() });
        const index = conversations.findIndex((item) => item.id === nextChat.id);
        if (index >= 0) conversations[index] = nextChat;
        else conversations.unshift(nextChat);
        writeAiConversations(conversations.sort((a, b) => b.updatedAt - a.updatedAt));
        activeAiChatId = nextChat.id;
        safeStorageSetItem(aiActiveChatStoreKey(), nextChat.id);
        saveAiLastModel(nextChat.route || "writing", nextChat.model);
        return nextChat;
      }

      function createAiConversation() {
        activeAiSkillId = "";
        const chat = saveAiConversation({
          id: localId("chat"),
          title: `AI 对话 ${formatLocalTime()}`,
          route: "writing",
          model: lastModelForRoute("writing"),
          createdAt: Date.now(),
          updatedAt: Date.now(),
          messages: [],
        });
        renderAiChatWorkspace();
        return chat;

      function selectAiConversation(id) {
        const chat = readAiConversations().find((item) => item.id === id);
        if (!chat) return;
        activeAiSkillId = "";
        activeAiChatId = id;
        safeStorageSetItem(aiActiveChatStoreKey(), id);
        renderAiChatWorkspace();
      }

      function updateAiConversationModel(model) {
        const chat = ensureAiConversation();
        saveAiLastModel(chat.route || "writing", model);
        saveAiConversation({ ...chat, model });
        renderAiChatWorkspace();
      }

      function chooseAiSkill(skillId) {
        const skill = readAiSkills().find((item) => item.id === skillId);
        if (!skill) return;
        activeAiSkillId = skill.id;
        const chat = ensureAiConversation();
        saveAiConversation({ ...chat, route: skill.route, model: lastModelForRoute(skill.route) });
        renderAiChatWorkspace();
      }

      let aiChatSending = false;
      async function sendAiChatMessage() {
        if (aiChatSending) return;
        const input = $("#aiChatInput", ui.aiChatWorkspace);
        const text = input?.value.trim();
        if (!text) {
          input?.focus();
          setOutput("请输入问题后再发送。");
          showToast("请输入问题");
          return;
        }
        aiChatSending = true;
        if (input) input.value = "";
        writeAiChatDraft("");
        const chat = ensureAiConversation();
        const explicitSkill = selectedAiSkill();
        const trigger = resolveSkillTrigger(text, chat, explicitSkill);
        const skill = trigger.skill;
        const inferredRoute = trigger.route || "writing";
        const autoImageOrVideo = ["image", "textToVideo", "imageToVideo"].includes(inferredRoute);
        const keepManualTextModel = !explicitSkill && autoImageOrVideo;
        const route = keepManualTextModel ? "chat" : inferredRoute;
        const preferredModel = keepManualTextModel
          ? (textModelOptions.includes(chat.model) ? chat.model : lastModelForRoute("writing"))
          : modelForAiConversation({ ...chat, route });
        // Respect user's explicit dropdown choice: if they picked a model and it's a valid
        // option for this route but isn't configured, refuse to send instead of silently
        // falling back to a different provider (避免选了 Kimi 却被 DeepSeek 回答的情况).
        const userPickedModel = chat.model && (modelRouteGroups[routeGroupFor(route === "chat" ? "writing" : route)] || []).includes(chat.model);
        if (userPickedModel && !providerReadyForApi(preferredModel)) {
          const targetModelLabel = providerModelDisplayName(preferredModel);
          const runtimeLabel = aiRuntimeDisplayName(preferredModel);
          const error = new Error(`${preferredModel} 未配置 API Key 或 Base URL。请在「设置 → API Key / 连接测试」里配置后再发送。`);
          const userMessage = { role: "user", content: text, createdAt: Date.now() };
          const assistantMessage = {
            role: "assistant",
            model: `API 失败 · ${targetModelLabel}`,
            createdAt: Date.now() + 1,
            content: `无法调用真实 API：${error.message}\n\n我没有使用本地模拟回答。请检查后台 API Key、Base URL、模型 ID、余额、CORS 或供应商权限。`,
            skillRun: buildApiErrorRun(preferredModel, targetModelLabel, error, 0),
          };
          const title = chat.messages.length ? chat.title : cleanNoteTitle(text.slice(0, 22));
          saveAiConversation({
            ...chat,
            title,
            route,
            model: preferredModel,
            messages: [...chat.messages, userMessage, assistantMessage],
          });
          aiChatSending = false;
          if (input) input.value = "";
          writeAiChatDraft("");
          renderAiChatWorkspace();
          showToast(`${runtimeLabel} 未配置 API Key`);
          setOutput(error.message);
          return;
        }
        const model = runnableModelForRoute(route, preferredModel);
        if (model !== preferredModel) {
          showToast(`${preferredModel} 未配置，已切换到 ${model}`);
        }
        const targetModelLabel = providerModelDisplayName(model);
        const runtimeLabel = aiRuntimeDisplayName(model);
        const webSearchEnabled = readAiWebSearchEnabled();
        const pendingId = localId("thinking");
        const userMessage = { role: "user", content: text, createdAt: Date.now() };
        const pendingMessage = {
          role: "assistant",
          model: runtimeLabel,
          createdAt: Date.now() + 1,
          content: "",
          pending: true,
          pendingId,
          skillRun: buildPendingApiRun(model, targetModelLabel, { route, skillName: skill?.name || "", webSearchEnabled }),
        };
        const title = chat.messages.length ? chat.title : cleanNoteTitle(text.slice(0, 22));
        const apiChat = { ...chat, title, route, model, messages: [...chat.messages, userMessage] };
        const pendingChat = saveAiConversation({ ...apiChat, messages: [...apiChat.messages, pendingMessage] });
        renderAiChatWorkspace();
        showToast("正在调用真实 API");
        const thinkingStartedAt = performance.now();
        updatePendingThinkingView(pendingId, thinkingStartedAt);
        const thinkingTimer = setInterval(() => updatePendingThinkingView(pendingId, thinkingStartedAt), 1000);
        try {
          let streamedContent = "";
          const apiResult = await callProviderChatApi(model, apiChat, text, {
            skill,
            route,
            webSearchEnabled,
            onDelta: (content) => {
              streamedContent = content;
              updatePendingLiveContent(pendingId, normalizeAiApiOutput(streamedContent));
            },
          });
          apiResult.elapsedMs = performance.now() - thinkingStartedAt;
          const assistantMessage = {
            role: "assistant",
            model: runtimeLabel,
            createdAt: Date.now(),
            content: normalizeAiApiOutput(apiResult.content),
            skillRun: buildApiCallRun(model, targetModelLabel, apiResult, { route, skillName: skill?.name || "", webSearchEnabled }),
          };
          saveAiConversation({ ...pendingChat, messages: pendingChat.messages.map((message) => message.pendingId === pendingId ? assistantMessage : message) });
          showToast("API 已返回");
        } catch (error) {
          const elapsedMs = performance.now() - thinkingStartedAt;
          const assistantMessage = {
            role: "assistant",
            model: `API 失败 · ${targetModelLabel}`,
            createdAt: Date.now(),
            content: `无法调用真实 API：${error?.message || error}\n\n我没有使用本地模拟回答。请检查后台 API Key、Base URL、模型 ID、余额、CORS 或供应商权限。`,
            skillRun: buildApiErrorRun(model, targetModelLabel, error, elapsedMs),
          };
          saveAiConversation({ ...pendingChat, messages: pendingChat.messages.map((message) => message.pendingId === pendingId ? assistantMessage : message) });
          showToast("API 调用失败");
        } finally {
          clearInterval(thinkingTimer);
          aiChatSending = false;
        }
        renderAiChatWorkspace();
      }

      async function writeClipboardViaProxy(text) {
        const response = await fetch(loamClipboardEndpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.ok) {
          throw new Error(data.proxyError || "本地剪贴板代理写入失败");
        }
        const verifyResponse = await fetch(loamClipboardEndpoint, { cache: "no-store" });
        const verifyData = await verifyResponse.json().catch(() => ({}));
        if (!verifyResponse.ok || !verifyData.ok || String(verifyData.text || "") !== text) {
          throw new Error("系统剪贴板校验失败");
        }
        return true;
      }

      async function copyText(value) {
        const text = String(value || "");
        if (!text) return false;
        try {
          await writeClipboardViaProxy(text);
          return true;
        } catch {
          // Fall through to browser clipboard and execCommand.
        }
        if (navigator.clipboard?.writeText && window.isSecureContext) {
          try {
            await navigator.clipboard.writeText(text);
            return true;
          } catch {
            // Fall through to the textarea copy path below.
          }
        }
        const activeEl = document.activeElement;
        const selection = window.getSelection?.();
        const ranges = selection ? Array.from({ length: selection.rangeCount }, (_, index) => selection.getRangeAt(index).cloneRange()) : [];
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("aria-hidden", "true");
        textarea.style.position = "fixed";
        textarea.style.top = "0";
        textarea.style.left = "0";
        textarea.style.width = "1px";
        textarea.style.height = "1px";
        textarea.style.padding = "0";
        textarea.style.border = "0";
        textarea.style.opacity = "0";
        textarea.style.pointerEvents = "none";
        document.body.appendChild(textarea);
        textarea.focus({ preventScroll: true });
        textarea.select();
        textarea.setSelectionRange(0, textarea.value.length);
        let copied = false;
        try {
          copied = Boolean(document.execCommand?.("copy"));
        } catch {
          copied = false;
        } finally {
          textarea.remove();
          if (selection) {
            selection.removeAllRanges();
            ranges.forEach((range) => selection.addRange(range));
          }
          activeEl?.focus?.({ preventScroll: true });
        }
        return copied;
      }

        }
        if (message.role !== "assistant") {
          showToast("只有 AI 回复可以转到笔记");
          return;

        flushPendingEditorSave();
        try {
          const folder = getNoteMeta(activeNoteKey)?.folder || "";
          const created = createNewStorageNote(aiMessageBaseTitle(message, chat), (title) => [
            `# ${title}`,
            "",
            normalizeAiApiOutput(message.content),
            "",
            "---",
            `来源：AI 对话《${chat.title}》`,
            `模型：${message.model || modelForAiConversation(chat)}`,
            `时间：${formatLocalTime(message.createdAt)}`,
          ].join("\n"));
          saveNoteMetaTitle(created.title, { tags: ["AI", "写作"], folder });
          createVisibleNoteRow(created.title, "AI");
          closeAiChatWorkspace();
          openNoteByTitle(created.title);
          setOutput(`AI 回复已新建为笔记《${created.title}》。`);
          showToast("已新建笔记");

      function writeEditorSettings(patch) {

      function applyEditorSettings() {
        const s = readEditorSettings();
        const editor = ui?.noteEditor;
        if (editor) {
          editor.spellcheck = !!s.spellcheck;
          editor.style.tabSize = String(s.tabIndentSize || 4);
          editor.readOnly = !!s.readOnlyMode;
          if (s.spellcheckLanguage && s.spellcheckLanguage !== "auto") {
            editor.setAttribute("lang", s.spellcheckLanguage);

          }
        }
        document.documentElement.style.setProperty("--editor-max-width", s.readableLineLength ? "780px" : "100%");
        document.documentElement.style.setProperty("--editor-line-height", s.strictLineBreaks ? "1.5" : "1.7");
        if (ui?.heading) ui.heading.style.display = s.showInlineTitle ? "" : "none";
        // Vim mode: just track flag; full keymap requires a CodeMirror-like layer.
        // We at least gate Esc → blur to mimic Normal mode entry.
        document.documentElement.dataset.vimMode = s.vimMode ? "on" : "off";
      }
      function restoreEditorSettings() { applyEditorSettings(); }

      // Smart editor handlers (auto-pair, smart-list, tab-indent)
      const autoPairMap = {
        "(": ")", "[": "]", "{": "}", '"': '"', "'": "'", "`": "`",
        "（": "）", "【": "】", "「": "」", "“": "”",
      };
      const autoPairMarkdownMap = { "*": "*", "_": "_", "~": "~" };
      function handleEditorSmartKeydown(event) {
        const editor = ui?.noteEditor;
        if (!event.target || event.target !== editor) return;
        const s = readEditorSettings();
        // Vim mode: Esc blurs to mimic Normal mode. Real Vim needs a keymap layer.
        if (s.vimMode && event.key === "Escape") {
          event.preventDefault();
          editor.blur();
          return;
        }
        const start = editor.selectionStart, end = editor.selectionEnd;

        // Tab indentation
        if (event.key === "Tab" && !event.shiftKey) {
          event.preventDefault();
          const insert = s.useTab ? "\t" : " ".repeat(Math.max(1, s.tabIndentSize || 4));
          editor.setRangeText(insert, start, end, "end");
          if (typeof scheduleSave === "function") scheduleSave();
          return;
        }

        // Smart list continuation on Enter
        if (event.key === "Enter" && s.smartList && start === end) {
          const before = editor.value.slice(0, start);
          const lineStart = before.lastIndexOf("\n") + 1;
          const currentLine = editor.value.slice(lineStart, start);
          const bullet = currentLine.match(/^(\s*)([-*+]\s+)/);
          const numbered = currentLine.match(/^(\s*)(\d+)([.)]\s+)/);
          if (bullet) {
            const rest = currentLine.slice(bullet[0].length);
            if (!rest.trim()) {
              event.preventDefault();
              editor.setRangeText("", lineStart, start, "end");
              return;
            }
            event.preventDefault();
            editor.setRangeText(`\n${bullet[1]}${bullet[2]}`, start, end, "end");
            if (typeof scheduleSave === "function") scheduleSave();
            return;
          }
          if (numbered) {
            const rest = currentLine.slice(numbered[0].length);
            if (!rest.trim()) {
              event.preventDefault();
              editor.setRangeText("", lineStart, start, "end");
              return;
            }
            event.preventDefault();
            const nextNum = parseInt(numbered[2], 10) + 1;
            editor.setRangeText(`\n${numbered[1]}${nextNum}${numbered[3]}`, start, end, "end");
            if (typeof scheduleSave === "function") scheduleSave();
            return;
          }
        }

        // Auto-pair brackets
        const pairMap = { ...(s.autoPairBrackets ? autoPairMap : {}), ...(s.autoPairMarkdown ? autoPairMarkdownMap : {}) };
        if (pairMap[event.key]) {
          const close = pairMap[event.key];
          if (start !== end) {
            // Wrap selection
            event.preventDefault();
            const sel = editor.value.slice(start, end);
            editor.setRangeText(`${event.key}${sel}${close}`, start, end, "end");
            editor.selectionStart = start + 1;
            editor.selectionEnd = end + 1;
            if (typeof scheduleSave === "function") scheduleSave();
            return;
          }
          if (start === end) {
            event.preventDefault();
            editor.setRangeText(`${event.key}${close}`, start, end, "end");
            editor.selectionStart = editor.selectionEnd = start + 1;
            if (typeof scheduleSave === "function") scheduleSave();
            return;
          }
        }
      }

        "客户端",
        "复盘",
        "灵感",
      ]);

      function folderId() {
        return `folder-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
      }

      function inferFolderKeywords(name) {
        const cleanName = String(name || "").trim();
        const parts = cleanName.split(/[\s/｜|,，、-]+/).filter(Boolean);
        const matchedRule = diaryTagRules.find(([tag]) => cleanName.includes(tag) || tag.includes(cleanName));
        return [...new Set([cleanName, ...parts, ...(matchedRule?.[1] || [])])].filter(Boolean);
      }

      function isLegacySeedFolder(folder) {
        const name = String(folder?.name || "").trim();
        const hasChildren = Array.isArray(folder?.children) && folder.children.length > 0;
        return legacyDefaultFolderNames.has(name) && !folder?.createdByUser && !hasChildren;
      }

      function normalizeFolder(folder) {
        const name = String(folder?.name || "未命名文件夹").trim() || "未命名文件夹";
        return {
          id: folder?.id || folderId(),
          name,
          keywords: Array.isArray(folder?.keywords) && folder.keywords.length ? folder.keywords : inferFolderKeywords(name),
          children: normalizeFolderList(folder?.children || []),
          createdByUser: true,
        };
      }

      function normalizeFolderList(folders) {
        return (Array.isArray(folders) ? folders : [])
          .filter((folder) => folder?.name && !isLegacySeedFolder(folder))
          .map(normalizeFolder);
      }

      function readUserFolders() {
        try {
          const stored = JSON.parse(safeStorageGetItem(folderStoreKey()) || "[]");
          const normalized = normalizeFolderList(stored);
          if (JSON.stringify(stored) !== JSON.stringify(normalized)) {
            safeStorageSetItem(folderStoreKey(), JSON.stringify(normalized));
          }
          return normalized;
        } catch {
          return [];
        }
      }

      function saveUserFolders(folders) {
        safeStorageSetItem(folderStoreKey(), JSON.stringify(normalizeFolderList(folders || [])));
      }

      function flattenFolders(folders = readUserFolders(), depth = 0, parentId = "") {
        return folders.flatMap((folder) => [
          { folder, depth, parentId },
          ...flattenFolders(folder.children || [], depth + 1, folder.id),
        ]);
      }

      function findFolderLocation(folders, id, parent = null) {
        for (let index = 0; index < folders.length; index += 1) {
          const folder = folders[index];
          if (folder.id === id || folder.name === id) return { folder, siblings: folders, index, parent };
          const child = findFolderLocation(folder.children || [], id, folder);
          if (child) return child;
        }
        return null;
      }

      function folderExists(folders, name) {
        return flattenFolders(folders).some(({ folder }) => folder.name === name);
      }

      function uncategorizedFolder() {
        return { id: "uncategorized", name: "未归类", keywords: [], children: [], system: true };
      }

      function findFolder(identifier, folders = readUserFolders()) {
        if (!identifier || identifier === "uncategorized" || identifier === "未归类") return uncategorizedFolder();
        const item = flattenFolders(folders).find(({ folder }) => folder.id === identifier || folder.name === identifier);
        return item?.folder || null;
      }

      function folderCreateDepth(parentId = "") {
        if (!parentId) return 0;
        const item = flattenFolders().find(({ folder }) => folder.id === parentId);
        return item ? item.depth + 1 : 0;
      }

      function renderFolderCreateRow(parentId = "", depth = folderCreateDepth(parentId)) {
        if (pendingFolderParentId !== parentId) return "";
        return `
          <div class="file-tree-row folder-create-row" data-folder-create-row data-parent-id="${escapeHtml(parentId)}" style="--depth:${depth}">
            <i data-lucide="folder"></i>
            <input data-folder-create-input data-parent-folder="${escapeHtml(parentId)}" type="text" placeholder="文件夹名称" autocomplete="off" />
            <button class="folder-create-button primary" data-folder-create-confirm>创建</button>
            <button class="folder-create-button" data-folder-create-cancel>取消</button>
          </div>`;
      }

      function createFolderFromRoute(label) {
        const cleanName = String(label || "").trim();
        if (!cleanName || cleanName === "uncategorized" || cleanName === "未归类" || cleanName.startsWith("folder-")) return null;
        const folders = readUserFolders();
        const existing = findFolder(cleanName, folders);
        if (existing) return existing;
        const nextFolder = normalizeFolder({ name: cleanName });
        folders.push(nextFolder);
        saveUserFolders(folders);
        if (filePaneMode === "navigator" || filePaneMode === "recursive") setFileModePanel(filePaneMode);
        setOutput(`已把旧路由《${cleanName}》恢复成自定义文件夹，可以继续创建文件夹。`);
        showToast("已创建自定义文件夹");
        return nextFolder;
      }

      function startFolderCreation(parentId = "") {
        closeAiChatWorkspace();
        pendingFolderParentId = parentId || "";
        if (!["files", "navigator", "recursive"].includes(filePaneMode)) {
          setFilePaneMode("files", $('[data-obsidian-action="files"]'));
        } else {
          setFileModePanel(filePaneMode);
        }
        requestAnimationFrame(() => {
          const input = $("[data-folder-create-input]");
          input?.focus();
          input?.select();
          input?.scrollIntoView({ block: "center", behavior: "smooth" });
        });
        setOutput(parentId ? "在当前文件夹下输入文件夹名称，回车即可创建。" : "输入文件夹名称，回车即可创建。");
        showToast(parentId ? "输入子文件夹名称" : "输入文件夹名称");
      }

      function cancelFolderCreation() {
        pendingFolderParentId = null;
        setFileModePanel(filePaneMode);
        showToast("已取消");
      }

      function createUserFolder(parentId = "", folderName = "") {
        if (!folderName) {
          startFolderCreation(parentId);
          return;
        }
        const cleanName = String(folderName || "").trim();
        if (!cleanName) {
          showToast("请输入文件夹名称");
          return;
        }
        const folders = readUserFolders();
        if (folderExists(folders, cleanName)) {
          showToast("文件夹已存在");
          return;
        }
        const nextFolder = normalizeFolder({ name: cleanName });
        if (parentId) {
          const parent = findFolderLocation(folders, parentId);
          if (parent) parent.folder.children.push(nextFolder);
          else folders.push(nextFolder);
        } else {
          folders.push(nextFolder);
        }
        saveUserFolders(folders);
        pendingFolderParentId = null;
        setFileModePanel(filePaneMode);
        if (parentId && window.location.hash.startsWith("#folder/")) renderFolderPage(parentId);
        if (window.location.hash.startsWith("#page/daily")) openPageByName("daily");
        setOutput(parentId ? `已在父文件夹下新建《${cleanName}》。` : `已新建文件夹《${cleanName}》，后续日记会按内容自动归类。`);
        showToast("文件夹已创建");
      }

      function confirmFolderCreation(sourceEl) {
        const row = sourceEl?.closest("[data-folder-create-row]");
        const input = row?.querySelector("[data-folder-create-input]");
        if (!input) return;
        createUserFolder(input.dataset.parentFolder || "", input.value);
      }

      function moveFolderInTree(id, direction) {
        const folders = readUserFolders();
        const location = findFolderLocation(folders, id);
        if (!location) return;
        const nextIndex = direction === "up" ? location.index - 1 : location.index + 1;
        if (nextIndex < 0 || nextIndex >= location.siblings.length) {
          showToast(direction === "up" ? "已经在最上面" : "已经在最下面");
          return;
        }
        const [folder] = location.siblings.splice(location.index, 1);
        location.siblings.splice(nextIndex, 0, folder);
        saveUserFolders(folders);
        refreshFolderViews();
        showToast("文件夹顺序已调整");
      }

      function collectFolderIds(folder) {
        return [folder.id, ...(folder.children || []).flatMap(collectFolderIds)];
      }

      function clearFolderAssignments(folderIds) {
        const deletedIds = new Set(folderIds);
        const meta = readNoteMeta();
        let changed = false;
        Object.values(meta).forEach((item) => {
          if (item?.folder && deletedIds.has(item.folder)) {
            delete item.folder;
            changed = true;
          }
        });
        if (changed) writeNoteMeta(meta);
      }

      function deleteFolderInTree(id) {
        const folders = readUserFolders();
        const location = findFolderLocation(folders, id);
        if (!location) {
          showToast("文件夹不存在");
          return;
        }
        const [deletedFolder] = location.siblings.splice(location.index, 1);
        saveUserFolders(folders);
        clearFolderAssignments(collectFolderIds(deletedFolder));
        pendingFolderParentId = null;
        refreshFolderViews();
        setOutput(`文件夹《${deletedFolder.name}》已删除，原来放在这里的笔记已回到自动归类。`);
        showToast("文件夹已删除");
      }

      function reorderFolderInTree(dragId, targetId, after = false) {
        if (!dragId || !targetId || dragId === targetId) return;
        const folders = readUserFolders();
        const from = findFolderLocation(folders, dragId);
        const to = findFolderLocation(folders, targetId);
        if (!from || !to) return;
        if (from.siblings !== to.siblings) {
          showToast("拖拽排序先在同一级文件夹内调整");
          return;
        }
        const [folder] = from.siblings.splice(from.index, 1);
        const targetIndex = from.siblings.findIndex((item) => item.id === targetId);
        from.siblings.splice(targetIndex + (after ? 1 : 0), 0, folder);
        saveUserFolders(folders);
        refreshFolderViews();
        showToast("文件夹顺序已调整");
      }

      function refreshFolderViews() {
        setFileModePanel(filePaneMode);
        if (window.location.hash.startsWith("#page/daily")) openPageByName("daily");
        if (window.location.hash.startsWith("#folder/")) {
          const id = decodeRoutePart(window.location.hash.replace(/^#folder\//, ""));
          renderFolderPage(id);
        }
      }

      function escapeRegExp(value) {
        return String(value).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      }

      function keywordCount(text, keyword) {
        if (!keyword) return 0;
        return (String(text).match(new RegExp(escapeRegExp(keyword), "gi")) || []).length;
      }

      function folderScore(folder, text) {
        const keywords = [folder.name, ...(folder.keywords || [])];
        return keywords.reduce((sum, keyword) => sum + keywordCount(text, keyword), 0);
      }

      function classifyDiaryFolder(title, text, matches = []) {
        const source = `${title} ${text}`;
        const folderItems = flattenFolders(readUserFolders());
        if (!folderItems.length) return uncategorizedFolder();
        const scored = folderItems
          .map(({ folder }) => ({ folder, score: folderScore(folder, source) }))
          .sort((a, b) => b.score - a.score || a.folder.name.localeCompare(b.folder.name, "zh-Hans-CN"));
        if (scored[0]?.score > 0) return scored[0].folder;
        const firstTag = matches[0]?.tag;
        const matchedTagFolder = folderItems.find(({ folder }) => folder.name === firstTag || (folder.keywords || []).includes(firstTag));
        return matchedTagFolder?.folder || uncategorizedFolder();
      }

      function classifiedDailyEntries() {
        return dailyEntries.map(([title, text]) => {
          const matches = diaryTagMatches(`${title} ${text}`);
          const assignedFolder = findFolder(getNoteMeta(title).folder);
          const folder = assignedFolder || classifyDiaryFolder(title, text, matches);
          return { title, text, matches, folder };
        });
      }

      function isDailyEntryTitle(title) {
        const cleanTitle = cleanNoteTitle(title);
        return dailyEntries.some(([entryTitle]) => cleanNoteTitle(entryTitle) === cleanTitle);
      }

      function groupedDailyEntries() {
        const groups = new Map();
        classifiedDailyEntries().forEach((entry) => {
          const folder = entry.folder || uncategorizedFolder();
          const id = folder.id || folder.name;
          if (!groups.has(id)) groups.set(id, { folder, entries: [] });
          groups.get(id).entries.push(entry);
        });
        return [...groups.values()];
      }

      function folderEntryIds(folder) {
        if (!folder || folder.system) return [folder?.id || "uncategorized"];
        return [folder.id, ...flattenFolders(folder.children || []).map(({ folder: child }) => child.id)];
      }

      function movedNoteCountForFolder(folder) {
        const ids = new Set(folderEntryIds(folder));
        return Object.entries(readNoteMeta())
          .filter(([title, item]) => ids.has(item.folder) && !isDailyEntryTitle(title) && !isNoteDeleted(title))
          .length;
      }

      function folderEntryCount(folder, classified = classifiedDailyEntries()) {
        const ids = new Set(folderEntryIds(folder));
        return classified.filter((entry) => ids.has(entry.folder?.id || "uncategorized")).length + movedNoteCountForFolder(folder);
      }

      function entriesForFolder(folder) {
        const classified = classifiedDailyEntries();
        const ids = new Set(folderEntryIds(folder));
        return classified.filter((entry) => ids.has(entry.folder?.id || "uncategorized"));
      }

      function diaryTagMatches(text) {
        return diaryTagRules
          .map(([tag, keywords]) => ({
            tag,
            count: keywords.reduce((sum, keyword) => sum + keywordCount(text, keyword), 0),
            history: historicalWritingTagStats[tag] || 0,
          }))
          .filter((item) => item.count > 0 && !blockedAutoTags.has(item.tag))
          .sort((a, b) => b.count - a.count || b.history - a.history || a.tag.localeCompare(b.tag, "zh-Hans-CN"));
      }

      function noteTagSourceText(title, body = "") {
        const cleanTitle = cleanNoteTitle(title);
        const lines = String(body || "").split("\n");
        const firstTextLine = lines.findIndex((line) => line.trim());
        if (firstTextLine >= 0) {
          const firstLine = lines[firstTextLine].trim().replace(/^#\s+/, "").trim();
          if (cleanNoteTitle(firstLine) === cleanTitle) lines.splice(firstTextLine, 1);
        }
        return `${cleanTitle}\n${lines.join("\n")}`;
      }


      function renderCurrentNoteTags() {
        const panel = $("#noteTagPanel");
        if (!panel) return;
        panel.hidden = true;
        panel.innerHTML = "";
      }

      function renderDiaryEntry(entry) {
        const title = Array.isArray(entry) ? entry[0] : entry.title;
        const text = Array.isArray(entry) ? entry[1] : entry.text;
        const matches = entry.matches || diaryTagMatches(`${title} ${text}`);
        const folder = entry.folder || classifyDiaryFolder(title, text, matches);

        return `
          <article class="timeline-item card" data-note-open="${escapeHtml(title)}">
            <strong>${escapeHtml(title)}</strong>
            <p>${escapeHtml(text)}</p>
            <div class="diary-folder-line">归类到
              <button class="folder-pill" data-folder-open="${escapeHtml(folder.id || folder.name)}"><strong>${escapeHtml(folder.name)}</strong></button>
            </div>
          </article>`;
      }

      function renderDailyFolderGroup(group) {
        const folder = group.folder || uncategorizedFolder();
        const entries = group.entries || [];
        return `
          <section class="folder-group" data-folder-group="${escapeHtml(folder.id || folder.name)}">
            <div class="folder-group-head">
              <span>${escapeHtml(folder.name)}</span>
              <small>${entries.length} 条日记</small>
            </div>
            <div class="page-grid two">${entries.map(renderDiaryEntry).join("")}</div>
          </section>`;
      }

      function renderFolderTreeRows(folders = readUserFolders(), depth = 0, parentId = "", classified = classifiedDailyEntries()) {
        const rows = folders.map((folder) => {
          const count = folderEntryCount(folder, classified);
          return `
            <div class="file-tree-row folder-row" draggable="true" data-drag-folder-id="${escapeHtml(folder.id)}" data-folder-id="${escapeHtml(folder.id)}" data-parent-id="${escapeHtml(parentId)}" style="--depth:${depth}">
              <span class="folder-grip">⋮⋮</span>
              <i data-lucide="folder"></i>
              <button class="folder-name-button" data-folder-open="${escapeHtml(folder.id)}">${escapeHtml(folder.name)}</button>
              <small>${count}</small>
              <button class="folder-action" data-create-folder data-parent-folder="${escapeHtml(folder.id)}" aria-label="在 ${escapeHtml(folder.name)} 下新建文件夹">＋</button>
              <button class="folder-action" data-move-folder data-folder-id="${escapeHtml(folder.id)}" data-move-dir="up" aria-label="上移 ${escapeHtml(folder.name)}">↑</button>
              <button class="folder-action" data-move-folder data-folder-id="${escapeHtml(folder.id)}" data-move-dir="down" aria-label="下移 ${escapeHtml(folder.name)}">↓</button>
              <button class="folder-action danger" data-delete-folder data-folder-id="${escapeHtml(folder.id)}" aria-label="删除 ${escapeHtml(folder.name)}" title="删除文件夹"><i data-lucide="x"></i></button>
            </div>
            ${renderFolderCreateRow(folder.id, depth + 1)}
            ${renderFolderTreeRows(folder.children || [], depth + 1, folder.id, classified)}
          `;
        }).join("");
        if (depth > 0) return rows;
        const emptyState = pendingFolderParentId === "" ? "" : `<div class="folder-empty">还没有文件夹。点左上角的＋创建。</div>`;
        return `<div class="folder-tree">${renderFolderCreateRow("", 0)}${rows || emptyState}</div>`;
      }

      function renderFolderOverview() {
        const classified = classifiedDailyEntries();
        const folderChips = flattenFolders(readUserFolders()).map(({ folder, depth }) => {
          const count = folderEntryCount(folder, classified);
          return `<button class="folder-pill" data-folder-open="${escapeHtml(folder.id)}"><strong>${"&nbsp;".repeat(depth * 2)}${escapeHtml(folder.name)}</strong><small>${count}</small></button>`;
        }).join("");
        const unclassified = folderEntryCount(uncategorizedFolder(), classified);
        const unclassifiedChip = unclassified ? `<button class="folder-pill" data-folder-open="uncategorized"><strong>未归类</strong><small>${unclassified}</small></button>` : "";
        return folderChips || unclassifiedChip
          ? `${folderChips}${unclassifiedChip}`
          : `<div class="folder-empty">还没有自建文件夹。先新建一个文件夹，再让日记按内容归进去。</div>`;
      }

      function templateStoreKey() {
        return "loam-custom-templates-v1";
      }

      function normalizeTemplate(template = {}) {
        const title = cleanNoteTitle(template.title || "未命名模板");
        return {
          id: template.id || localId("template"),
          title,
          category: cleanNoteTitle(template.category || "自定义"),
          type: cleanNoteTitle(template.type || "自定义模板"),
          status: cleanNoteTitle(template.status || "本地"),
          uses: Number(template.uses || 0),
          updated: template.updated || "本地",
          route: template.route || "写作模型",
          desc: template.desc || "本地创建的模板，可以继续编辑、复制或生成新笔记。",
          blocks: Array.isArray(template.blocks) && template.blocks.length ? template.blocks : ["标题", "正文", "输出"],
          variables: Array.isArray(template.variables) && template.variables.length ? template.variables : ["标题"],
          body: String(template.body || "# {{标题}}\n\n"),
          custom: Boolean(template.custom),
        };
      }

      function readCustomTemplates() {
        try {
          return JSON.parse(safeStorageGetItem(templateStoreKey()) || "[]").map((item) => normalizeTemplate({ ...item, custom: true }));
        } catch {
          return [];
        }
      }

      function writeCustomTemplates(templates = []) {
        safeStorageSetItem(templateStoreKey(), JSON.stringify(templates.map((item) => normalizeTemplate({ ...item, custom: true }))));
      }

      function templateLibraryItems() {
        return [...readCustomTemplates(), ...seedTemplateLibrary.map(normalizeTemplate)];
      }

      function templateCategories(items = templateLibraryItems()) {
        const categories = ["全部", ...new Set(items.map((item) => item.category))];
        return categories.map((category) => ({
          category,
          count: category === "全部" ? items.length : items.filter((item) => item.category === category).length,
        }));
      }

      function templateById(identifier) {
        const clean = String(identifier || "");
        return templateLibraryItems().find((item) => item.id === clean || item.title === clean) || null;
      }

      function filteredTemplates() {
        const query = templateSearchQuery.trim().toLowerCase();
        return templateLibraryItems().filter((item) => {
          const categoryMatch = activeTemplateCategory === "全部" || item.category === activeTemplateCategory;
          const text = `${item.title} ${item.category} ${item.type} ${item.status} ${item.desc} ${item.blocks.join(" ")} ${item.variables.join(" ")}`.toLowerCase();
          return categoryMatch && (!query || text.includes(query));
        });
      }

      function currentTemplateSelection(items = filteredTemplates()) {
        let selected = templateById(selectedTemplateId);
        if (!selected || (items.length && !items.some((item) => item.id === selected.id))) {
          selected = items[0] || templateLibraryItems()[0];
          selectedTemplateId = selected?.id || "";
        }
        return selected;
      }

      function fillTemplateBody(template, title = template?.title || "新笔记") {
        const today = new Date().toLocaleDateString("zh-CN");
        return String(template?.body || "")
          .replace(/\{\{标题\}\}/g, title)
          .replace(/\{\{日期\}\}/g, today)
          .replace(/\{\{分类\}\}/g, template?.category || "")
          .replace(/\{\{类型\}\}/g, template?.type || "");
      }

      function renderTemplateCard(template, selected) {
        return `
          <article class="template-card${selected ? " active" : ""}" data-template-id="${escapeHtml(template.id)}">
            <div class="template-card-head">
              <div>
                <h3>${escapeHtml(template.title)}</h3>
                <p>${escapeHtml(template.desc)}</p>
              </div>
              <span class="status-pill">${escapeHtml(template.status)}</span>
            </div>
            <div class="template-meta-line">
              <span>${escapeHtml(template.category)}</span>
              <span>${escapeHtml(template.type)}</span>
              <span>${template.uses} 次使用</span>
              <span>${escapeHtml(template.route)}</span>
            </div>
            <div class="template-card-actions">
              <button class="mini-action${selected ? " active" : ""}" data-template-action="select" data-template-id="${escapeHtml(template.id)}">预览</button>
              <button class="mini-action" data-template-action="use" data-template-id="${escapeHtml(template.id)}">使用</button>
              <button class="mini-action" data-template-action="copy" data-template-id="${escapeHtml(template.id)}">复制</button>
              <button class="mini-action" data-template-action="edit" data-template-id="${escapeHtml(template.id)}">编辑</button>
            </div>
          </article>`;
      }

      function renderTemplateLibraryPage() {
        const items = filteredTemplates();
        const selected = currentTemplateSelection(items);
        const categories = templateCategories();
        const allItems = templateLibraryItems();
        const customCount = readCustomTemplates().length;
        const selectedBody = selected ? fillTemplateBody(selected, selected.title) : "";
        return `
          <section class="secondary-page template-center-page">
            <div class="page-head">
              <p style="color:var(--muted);font-size:13px;margin:0">模板可以筛选、预览、复制，并能一键生成新笔记。</p>
              <div class="template-hero-actions">
                <button class="mini-action active" data-template-action="new"><i data-lucide="plus"></i><span>新模板</span></button>
                <button class="mini-action" data-template-action="copy" data-template-id="${escapeHtml(selected?.id || "")}">复制当前模板</button>
                <button class="mini-action" data-template-action="use" data-template-id="${escapeHtml(selected?.id || "")}">用模板新建笔记</button>
              </div>
            </div>
            <div class="template-toolbar">
              <label class="template-search">
                <i data-lucide="search"></i>
                <input data-template-search type="search" value="${escapeHtml(templateSearchQuery)}" placeholder="搜索模板、用途、字段或变量..." />
              </label>
              <div class="template-status-row">
                <span class="template-chip active">${allItems.length} 个模板</span>
                <span class="template-chip">${categories.length - 1} 个分类</span>
                <span class="template-chip">${customCount} 个自定义</span>
              </div>
            </div>
            <div class="template-chip-row" aria-label="模板分类">
              ${categories.map(({ category, count }) => `
                <button class="template-chip${activeTemplateCategory === category ? " active" : ""}" data-template-action="filter" data-template-filter="${escapeHtml(category)}">
                  ${escapeHtml(category)} <small>${count}</small>
                </button>
              `).join("")}
            </div>
            <div class="template-workbench">

      async function runTemplateAction(actionEl) {
        const action = actionEl.dataset.templateAction;
        if (action === "new") {
          renderTemplateBuilderPage();
          return;
        }
        if (action === "filter") {
          activeTemplateCategory = actionEl.dataset.templateFilter || "全部";
          paintTemplateLibrary(false);
          return;
        }
        const template = templateById(actionEl.dataset.templateId || actionEl.closest("[data-template-id]")?.dataset.templateId || selectedTemplateId);
        if (action === "select" && template) {
          selectedTemplateId = template.id;
          paintTemplateLibrary(false);
          return;
        }
        if (action === "edit" && template) {
          renderTemplateDetailPage(template.title);
          return;
        }
        if (action === "copy" && template) {
          const copied = await copyText(fillTemplateBody(template, template.title));
          flashCopyButton(actionEl, copied);
          setOutput(`模板《${template.title}》${copied ? "已复制到剪贴板" : "复制失败"}。`);
          showToast(copied ? "模板已复制" : "复制失败");
          return;
        }
        if (action === "use" && template) {
          flushPendingEditorSave();
          const created = createNewStorageNote(`${template.title} 草稿`, (title) => noteBodyWithHeading(fillTemplateBody(template, title), title));
          saveNoteMetaTitle(created.title, { tags: ["模板", template.category], sourceTemplate: template.title });
          createVisibleNoteRow(created.title, template.category);
          openNoteByTitle(created.title);
          setOutput(`已用模板《${template.title}》新建笔记《${created.title}》，没有覆盖旧笔记。`);
          showToast("已新建笔记");
          return;
        }
        if (action === "delete" && template?.custom) {
          writeCustomTemplates(readCustomTemplates().filter((item) => item.id !== template.id));
          selectedTemplateId = "article-outline";
          paintTemplateLibrary(false);
          setOutput(`自定义模板《${template.title}》已删除。`);
          showToast("模板已删除");
          return;
        }
        if (action === "save-new") {
          const title = cleanNoteTitle($("#templateTitleInput")?.value || "");
          if (!title) {
            $("#templateTitleInput")?.focus();
            showToast("请输入模板名称");
            return;
          }
          const body = $("#templateBodyInput")?.value || "";
          const nextTemplate = normalizeTemplate({
            id: localId("template"),
            title,
            category: $("#templateCategoryInput")?.value || "自定义",
            type: $("#templateTypeInput")?.value || "自定义模板",
            route: $("#templateRouteInput")?.value || "写作模型",
            desc: $("#templateDescInput")?.value || "本地创建的模板。",
            status: "本地",
            updated: "刚刚",
            body,
            custom: true,
          });
          writeCustomTemplates([nextTemplate, ...readCustomTemplates()]);
          selectedTemplateId = nextTemplate.id;
          activeTemplateCategory = nextTemplate.category;
          templateSearchQuery = "";
          pushRoute("page/templates");
          paintTemplateLibrary(false);
          setOutput(`模板《${nextTemplate.title}》已保存到本地模板库。`);
          showToast("模板已保存");
        }
      }
