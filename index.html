      function canvasStoreKey(title) {
        return `loam-canvas:${cleanNoteTitle(title) || "新白板"}`;
      }

      function defaultCanvasSettings(settings = {}) {
        return {
          grid: settings.grid !== false,
          snap: settings.snap !== false,
          readonly: Boolean(settings.readonly),
        };
      }

      function readCanvasState(title) {
        try {
          const stored = JSON.parse(safeStorageGetItem(canvasStoreKey(title)) || "{}");
          if (Array.isArray(stored)) return { nodes: stored, zoom: 1, panX: 0, panY: 0, settings: defaultCanvasSettings() };
          return {
            nodes: Array.isArray(stored.nodes) ? stored.nodes : [],
            zoom: Math.min(3, Math.max(0.2, Number(stored.zoom) || 1)),
            panX: Number(stored.panX) || 0,
            panY: Number(stored.panY) || 0,
            settings: defaultCanvasSettings(stored.settings),
          };
        } catch {
          return { nodes: [], zoom: 1, panX: 0, panY: 0, settings: defaultCanvasSettings() };
        }
      }

      function writeCanvasState(title, state) {
        safeStorageSetItem(canvasStoreKey(title), JSON.stringify({
          nodes: Array.isArray(state.nodes) ? state.nodes : [],
          zoom: Math.min(3, Math.max(0.2, Number(state.zoom) || 1)),
          panX: Number(state.panX) || 0,
          panY: Number(state.panY) || 0,
          settings: defaultCanvasSettings(state.settings),
        }));
      }

      function pushCanvasUndo(title) {
        const key = cleanNoteTitle(title) || "新白板";
        const current = safeStorageGetItem(canvasStoreKey(key)) || "";
        canvasUndoStacks[key] ||= [];
        canvasUndoStacks[key].push(current);
        if (canvasUndoStacks[key].length > 50) canvasUndoStacks[key].shift();
        canvasRedoStacks[key] = [];
      }

      function commitCanvasState(title, state) {
        pushCanvasUndo(title);
        writeCanvasState(title, state);
      }

      function snapCanvasValue(value, enabled = true) {
        return enabled ? Math.round(value / 24) * 24 : Math.round(value);
      }

      function canvasNodeLabel(type) {
        if (type === "note") return "笔记";
        if (type === "media") return "媒体";
        return "卡片";
      }

      function canvasNodeCopy(type) {
        if (type === "note") return "链接到一篇本地笔记，也可以拖到任意位置。";
        if (type === "media") return "图片、截图、视频分镜或视觉素材可以放在这里。";
        return "";
      }

      function canvasNodeToolbar(node) {
        return `
          <div class="canvas-node-toolbar" data-canvas-node-toolbar>
            <button data-canvas-node-action="remove" data-canvas-node-id="${escapeHtml(node.id)}" aria-label="移除" title="移除"><i data-lucide="trash-2"></i></button>
            <button data-canvas-node-action="color" data-canvas-node-id="${escapeHtml(node.id)}" aria-label="设置颜色" title="设置颜色"><i data-lucide="palette"></i></button>
            <button data-canvas-node-action="focus" data-canvas-node-id="${escapeHtml(node.id)}" aria-label="聚焦当前卡片" title="聚焦当前卡片"><i data-lucide="scan"></i></button>
            <button data-canvas-node-action="edit" data-canvas-node-id="${escapeHtml(node.id)}" aria-label="编辑" title="编辑"><i data-lucide="square-pen"></i></button>
          </div>`;
      }

      function canvasNodeColorPalette(node) {
        const colors = ["#8b7cf6", "#3b82f6", "#22c55e", "#f59e0b", "#ef4444", "#64748b", "#a855f7", "#06b6d4", "#84cc16", "#f97316", "#ec4899", ""];
        return `
          <div class="canvas-color-popover" data-canvas-color-popover>
            ${colors.map((color) => `
              <button class="${(node.color || "") === color ? "active" : ""}" data-canvas-node-color="${escapeHtml(color)}" data-canvas-node-id="${escapeHtml(node.id)}" style="--canvas-swatch:${color || "#ffffff"}" aria-label="${color ? `设置为 ${color}` : "清除颜色"}" title="${color ? `设置为 ${color}` : "清除颜色"}"></button>
            `).join("")}
          </div>`;
      }

      function renderCanvasNode(node, state) {
        const type = node.type || "card";
        const selected = node.id === activeCanvasNodeId;
        const readonly = state.settings?.readonly;
        const editing = canvasEditingNodeId === node.id && !readonly;
        const colorStyle = node.color ? `--canvas-card-color:${escapeHtml(node.color)};` : "";
        const sizeStyle = `--canvas-node-width:${Math.max(160, Number(node.width) || 320)}px;--canvas-node-height:${Math.max(86, Number(node.height) || 126)}px;`;
        if (type === "card") {
          return `
            <article class="canvas-card ${selected ? "selected" : ""} ${editing ? "editing" : ""}" data-canvas-node-id="${escapeHtml(node.id)}" data-canvas-type="card" ${node.color ? "data-canvas-color" : ""} style="left:${Number(node.x) || 180}px;top:${Number(node.y) || 220}px;${sizeStyle}${colorStyle}">
              ${selected ? canvasNodeToolbar(node) : ""}
              ${selected && canvasColorPickerNodeId === node.id ? canvasNodeColorPalette(node) : ""}
              <div class="canvas-card-content" data-canvas-node-content="${escapeHtml(node.id)}" contenteditable="${editing ? "true" : "false"}" spellcheck="false" data-placeholder="${editing ? "输入文字..." : "双击编辑"}">${escapeHtml(node.text || "")}</div>
              <span class="canvas-resize-handle" data-canvas-resize-handle="${escapeHtml(node.id)}" aria-hidden="true"></span>
            </article>`;
        }
        return `
          <article class="canvas-card ${selected ? "selected" : ""} ${editing ? "editing" : ""}" data-canvas-node-id="${escapeHtml(node.id)}" data-canvas-type="${escapeHtml(type)}" ${node.color ? "data-canvas-color" : ""} style="left:${Number(node.x) || 180}px;top:${Number(node.y) || 220}px;${sizeStyle}${colorStyle}">
            ${selected ? canvasNodeToolbar(node) : ""}
            ${selected && canvasColorPickerNodeId === node.id ? canvasNodeColorPalette(node) : ""}
            <strong class="canvas-node-title" data-canvas-node-title="${escapeHtml(node.id)}" contenteditable="${editing ? "true" : "false"}" spellcheck="false">${escapeHtml(node.title || canvasNodeLabel(type))}</strong>
            <p data-canvas-node-content="${escapeHtml(node.id)}" contenteditable="${editing ? "true" : "false"}" spellcheck="false" data-placeholder="${editing ? "输入说明..." : "双击编辑"}">${escapeHtml(node.text || canvasNodeCopy(type))}</p>
            ${node.source ? `<span class="canvas-source-line">${escapeHtml(node.source)}</span>` : ""}
            <span class="canvas-resize-handle" data-canvas-resize-handle="${escapeHtml(node.id)}" aria-hidden="true"></span>
          </article>`;
      }

      function canvasAllNoteTitles() {
        const titles = new Set([activeNoteKey, "如何构建第二大脑", ...dailyEntries.map(([title]) => title)]);
        $$(".pin-title, .note-title").forEach((el) => titles.add(cleanNoteTitle(el.textContent)));
        for (const key of safeStorageKeys("loam-note:")) {
          if (key?.startsWith("loam-note:")) titles.add(cleanNoteTitle(key.replace("loam-note:", "")));
        }
        return [...titles].filter(Boolean).filter((title) => !isNoteDeleted(title));
      }

      function canvasPickerItems(mode) {
        const query = canvasPickerQuery.trim().toLowerCase();
        const titles = canvasAllNoteTitles();
        const source = mode === "media"
          ? titles.filter((title) => /图|图片|视频|封面|分镜|素材|media|image|video/i.test(title))
          : titles;
        const fallback = mode === "media" ? ["本地图片素材", "视频分镜素材", "封面图素材"] : [];
        return [...source, ...fallback]
          .filter((title, index, arr) => arr.indexOf(title) === index)
          .filter((title) => !query || title.toLowerCase().includes(query))
          .slice(0, 18);
      }

      function renderCanvasPicker(title) {
        if (!canvasPickerMode) return "";
        const items = canvasPickerItems(canvasPickerMode);
        const label = canvasPickerMode === "media" ? "添加媒体文件" : "添加笔记";
        return `
          <div class="canvas-picker" data-canvas-picker="${escapeHtml(canvasPickerMode)}">
            <div class="canvas-picker-head">
              <input data-canvas-picker-search value="${escapeHtml(canvasPickerQuery)}" placeholder="搜索..." aria-label="${label}" />
              <button class="canvas-tool" data-canvas-picker-close aria-label="关闭"><i data-lucide="x"></i></button>
            </div>
            <div class="canvas-picker-list">
              ${canvasPickerListHtml(canvasPickerMode, items)}
            </div>
          </div>`;
      }

      function canvasPickerListHtml(mode = canvasPickerMode, items = canvasPickerItems(mode)) {
        const empty = `<div class="folder-empty">没有找到内容；输入名称后按 Enter 可以作为新${mode === "media" ? "媒体" : "笔记"}加入白板。</div>`;
        return items.length ? items.map((item, index) => `
          <button class="canvas-picker-item ${index === 0 ? "active" : ""}" data-canvas-picker-pick="${escapeHtml(item)}">
            <span>${escapeHtml(item)}</span>
            <small>${mode === "media" ? "媒体" : "笔记"}</small>
          </button>`).join("") : empty;
      }

      function renderCanvasHelp() {
        if (!canvasHelpOpen) return "";
        const rows = [
          ["双击空白处", "创建卡片"],
          ["⌘ + 滚轮", "缩放画布"],
          ["空格 + 拖拽", "平移画布"],
          ["⌘ + 拖拽卡片", "调整卡片大小"],
          ["拖拽右下角", "调整卡片大小"],
          ["双击卡片", "编辑内容"],
          ["⌘ Z / ⌘ ⇧ Z", "撤销 / 重做"],
        ];
        return `<div class="canvas-help-menu">
          <h4>白板快捷操作</h4>
          ${rows.map(([key, desc]) => `
            <div class="canvas-help-row">
              <span>${desc}</span>
              <span class="canvas-help-key"><kbd>${key}</kbd></span>
            </div>`).join("")}
        </div>`;
      }

      function renderCanvasSettings(state) {
        if (!canvasSettingsOpen) return "";
        const settings = defaultCanvasSettings(state.settings);
        return `
          <div class="canvas-settings-menu">
            <button class="${settings.grid ? "active" : ""}" data-canvas-setting-toggle="grid"><span>${settings.grid ? "✓" : ""}</span><span>对齐网格</span></button>
            <button class="${settings.snap ? "active" : ""}" data-canvas-setting-toggle="snap"><span>${settings.snap ? "✓" : ""}</span><span>对齐物体</span></button>
            <button class="${settings.readonly ? "active" : ""}" data-canvas-setting-toggle="readonly"><span>${settings.readonly ? "✓" : ""}</span><span>只读</span></button>
          </div>`;
      }

      function renderCanvasPage(title = "新白板") {
        const cleanTitle = cleanNoteTitle(title) || "新白板";
        const state = readCanvasState(cleanTitle);
        pushRoute(`detail/${encodeURIComponent("canvas")}/${encodeURIComponent(cleanTitle)}`);
        setEditorActionBarVisible(false);
        ui.editor?.classList.add("canvas-mode");
        setDoc("白板", cleanTitle, `白板《${cleanTitle}》已打开。`);
        ui.editorScroll.innerHTML = `
          <section class="canvas-page ${state.settings.readonly ? "is-readonly" : ""}" data-canvas-title="${escapeHtml(cleanTitle)}" style="--canvas-zoom:${state.zoom};--canvas-pan-x:${state.panX}px;--canvas-pan-y:${state.panY}px">
            <div class="canvas-title" contenteditable="true" spellcheck="false" data-canvas-title-edit="${escapeHtml(cleanTitle)}">${escapeHtml(cleanTitle)}</div>
            <div class="canvas-board" data-canvas-board>
              ${state.nodes.map((node) => renderCanvasNode(node, state)).join("")}
            </div>
            <div class="canvas-hint" ${state.nodes.length ? "hidden" : ""}>
              从下方拖动或双击空白处创建卡片<br>
              按住空格拖动鼠标以移动白板<br>
              ⌘ + 滚动以缩放
            </div>
            ${renderCanvasSettings(state)}
            ${renderCanvasHelp()}
            ${renderCanvasPicker(cleanTitle)}
            <div class="canvas-toolbar" aria-label="白板工具">
              <div class="canvas-tool-group">
                <button class="canvas-tool" data-canvas-action="settings" aria-label="白板设置" title="白板设置"><i data-lucide="settings"></i></button>
              </div>
              <div class="canvas-tool-group">
                <button class="canvas-tool" data-canvas-action="zoom-in" aria-label="放大" title="放大"><i data-lucide="plus"></i></button>
                <button class="canvas-tool" data-canvas-action="reset-zoom" aria-label="重置缩放" title="重置缩放"><i data-lucide="rotate-cw"></i></button>
                <button class="canvas-tool" data-canvas-action="overview" aria-label="总览全局" title="总览全局"><i data-lucide="scan"></i></button>
                <button class="canvas-tool" data-canvas-action="zoom-out" aria-label="缩小" title="缩小"><i data-lucide="minus"></i></button>
              </div>
              <div class="canvas-tool-group">
                <button class="canvas-tool" data-canvas-action="undo" aria-label="撤销" title="撤销"><i data-lucide="rotate-ccw"></i></button>
                <button class="canvas-tool" data-canvas-action="redo" aria-label="重做" title="重做"><i data-lucide="rotate-cw"></i></button>
              </div>
              <div class="canvas-tool-group">
                <button class="canvas-tool" data-canvas-action="help" aria-label="帮助" title="帮助"><i data-lucide="help-circle"></i></button>
              </div>
            </div>
            <div class="canvas-bottom-dock" aria-label="添加白板内容">
              <button class="canvas-dock-button" draggable="true" data-canvas-dock-type="card" data-canvas-action="create-card" aria-label="添加卡片（点击或拖动）" title="添加卡片（点击或拖动）"><i data-lucide="square-pen"></i></button>
              <button class="canvas-dock-button" draggable="true" data-canvas-dock-type="note" data-canvas-action="create-note" aria-label="添加笔记（点击或拖动）" title="添加笔记（点击或拖动）"><i data-lucide="file-text"></i></button>
              <button class="canvas-dock-button" draggable="true" data-canvas-dock-type="media" data-canvas-action="create-media" aria-label="添加媒体文件（点击或拖动）" title="添加媒体文件（点击或拖动）"><i data-lucide="image"></i></button>
            </div>
          </section>`;
        createIcons(ui.editorScroll);
        if (canvasPickerMode) {
          requestAnimationFrame(() => {
            const input = $("[data-canvas-picker-search]", ui.editorScroll);
            input?.focus();
            input?.setSelectionRange(input.value.length, input.value.length);
          });
        }
      }

      function focusCanvasNodeEditor(nodeId, selectAll = false) {
        const placeCaret = () => {
          if (canvasEditingNodeId !== nodeId) return;
          const node = $(`article.canvas-card[data-canvas-node-id="${CSS.escape(nodeId)}"]`, ui.editorScroll);
          if (!node?.classList.contains("editing")) return;
          const target = $("[data-canvas-node-content]", node) || $("[data-canvas-node-title]", node);
          if (!target) return;
          target.focus({ preventScroll: true });
          const selection = document.getSelection();
          if (!selection) return;
          const range = document.createRange();
          range.selectNodeContents(target);
          if (!selectAll) range.collapse(false);
          selection.removeAllRanges();
          selection.addRange(range);
        };
        requestAnimationFrame(placeCaret);
      }

      function canvasResizePointerTarget(event, canvasCard) {
        const handle = event.target.closest?.("[data-canvas-resize-handle]");
        if (handle) {
          const card = handle.closest(".canvas-card");
          return {
            card,
            page: handle.closest(".canvas-page"),
            nodeId: handle.dataset.canvasResizeHandle || card?.dataset.canvasNodeId || "",
            captureTarget: handle,
          };
        }
        if (!canvasCard || event.button !== 0) return null;
        if (canvasEditingNodeId === canvasCard.dataset.canvasNodeId) return null;
        const rect = canvasCard.getBoundingClientRect();
        const inResizeCorner = event.clientX >= rect.right - 32 && event.clientY >= rect.bottom - 32;
        if (!inResizeCorner) return null;
        return {
          card: canvasCard,
          page: canvasCard.closest(".canvas-page"),
          nodeId: canvasCard.dataset.canvasNodeId || "",
          captureTarget: canvasCard,
        };
      }

      function addCanvasNode(title, type = "card", x, y, payload = {}) {
        const state = readCanvasState(title);
        const rect = $(".canvas-page")?.getBoundingClientRect();
        if (state.settings.readonly) {
          showToast("白板只读，不能添加");
          return null;
        }
        const offset = state.nodes.length * 26;
        const nextNode = {
          id: `canvas-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
          type,
          title: payload.title || canvasNodeLabel(type),
          text: payload.text ?? canvasNodeCopy(type),
          source: payload.source || "",
          width: Math.max(160, Number(payload.width) || 320),
          height: Math.max(86, Number(payload.height) || 126),
          x: snapCanvasValue(Number.isFinite(x) ? x : Math.max(64, ((rect?.width || 760) / 2) - 110 - state.panX + offset), state.settings.snap),
          y: snapCanvasValue(Number.isFinite(y) ? y : Math.max(80, ((rect?.height || 620) / 2) - 48 - state.panY + offset), state.settings.snap),
        };
        commitCanvasState(title, { ...state, nodes: [...state.nodes, nextNode] });
        activeCanvasNodeId = nextNode.id;
        canvasEditingNodeId = type === "card" ? nextNode.id : "";
        canvasPickerMode = "";
        canvasPickerQuery = "";
        renderCanvasPage(title);
        setOutput(`已在白板《${title}》添加${canvasNodeLabel(type)}。`);
        if (type === "card") focusCanvasNodeEditor(nextNode.id);
        return nextNode;
      }

      function openCanvasPicker(title, mode) {
        const state = readCanvasState(title);
        if (state.settings.readonly) {
          showToast("白板只读，不能添加");
          return;
        }
        canvasPickerMode = mode;
        canvasPickerQuery = "";
        canvasColorPickerNodeId = "";
        canvasSettingsOpen = false;
        canvasHelpOpen = false;
        renderCanvasPage(title);
      }

      function pickCanvasItem(value) {
        const page = $(".canvas-page");
        const title = page?.dataset.canvasTitle || "新白板";
        const mode = canvasPickerMode || "note";
        const picked = cleanNoteTitle(value || canvasPickerQuery) || (mode === "media" ? "媒体素材" : "未命名笔记");
        const pending = canvasPendingInsert;
        canvasPendingInsert = null;
        addCanvasNode(title, mode, pending?.x, pending?.y, {
          title: picked,
          text: mode === "media" ? "媒体文件占位：后续可绑定本地图片、视频或生成资产。" : noteMarkdown(picked).replace(/^#\s*/, "").slice(0, 120),
          source: mode === "media" ? "媒体" : "本地笔记",
        });
      }

      function toggleCanvasSetting(title, key) {
        const state = readCanvasState(title);
        const settings = defaultCanvasSettings(state.settings);
        settings[key] = !settings[key];
        commitCanvasState(title, { ...state, settings });
        renderCanvasPage(title);
      }

      function updateCanvasNode(title, nodeId, patch, { history = true, render = true } = {}) {
        const state = readCanvasState(title);
        const nextNodes = state.nodes.map((node) => node.id === nodeId ? { ...node, ...patch } : node);
        const writer = history ? commitCanvasState : writeCanvasState;
        writer(title, { ...state, nodes: nextNodes });
        if (render) renderCanvasPage(title);
      }

      function removeCanvasNode(title, nodeId) {
        const state = readCanvasState(title);
        if (state.settings.readonly) {
          showToast("白板只读，不能移除");
          return;
        }
        commitCanvasState(title, { ...state, nodes: state.nodes.filter((node) => node.id !== nodeId) });
        activeCanvasNodeId = "";
        renderCanvasPage(title);
      }

      function toggleCanvasNodeColorPicker(title, nodeId) {
        activeCanvasNodeId = nodeId;
        canvasEditingNodeId = "";
        canvasColorPickerNodeId = canvasColorPickerNodeId === nodeId ? "" : nodeId;
        canvasSettingsOpen = false;
        canvasPickerMode = "";
        renderCanvasPage(title);
      }

      function applyCanvasNodeColor(title, nodeId, color) {
        const state = readCanvasState(title);
        if (state.settings.readonly) {
          showToast("白板只读，不能改颜色");
          return;
        }
        canvasColorPickerNodeId = "";
        activeCanvasNodeId = nodeId;
        canvasEditingNodeId = "";
        updateCanvasNode(title, nodeId, { color: color || "" });
      }

      function focusCanvasNode(title, nodeId) {
        const state = readCanvasState(title);
        const node = state.nodes.find((item) => item.id === nodeId);
        const page = $(".canvas-page");
        if (!node || !page) return;
        const rect = page.getBoundingClientRect();
        const zoom = state.zoom || 1;
        const nodeWidth = Math.max(160, Number(node.width) || 320);
        const nodeHeight = Math.max(86, Number(node.height) || 126);
        activeCanvasNodeId = nodeId;
        writeCanvasState(title, {
          ...state,
          panX: Math.round(rect.width / 2 - (Number(node.x) + nodeWidth / 2) * zoom),
          panY: Math.round(rect.height / 2 - (Number(node.y) + nodeHeight / 2) * zoom),
        });
        renderCanvasPage(title);
      }

      function editCanvasNode(title, nodeId) {
        activeCanvasNodeId = nodeId;
        canvasEditingNodeId = nodeId;
        canvasColorPickerNodeId = "";
        renderCanvasPage(title);
        focusCanvasNodeEditor(nodeId);
      }

      function runCanvasAction(action, sourceEl) {
        const page = sourceEl.closest(".canvas-page");
        const title = cleanNoteTitle(page?.dataset.canvasTitle) || "新白板";
        const state = readCanvasState(title);
        if (action !== "settings") canvasSettingsOpen = false;
        if (action !== "help") canvasHelpOpen = false;
        if (action !== "color") canvasColorPickerNodeId = "";
        if (action === "create-card") addCanvasNode(title, "card");
        if (action === "create-note") openCanvasPicker(title, "note");
        if (action === "create-media") openCanvasPicker(title, "media");
        if (action === "zoom-in") {
          writeCanvasState(title, { ...state, zoom: Math.min(3, state.zoom + 0.1) });
          renderCanvasPage(title);
          setOutput(`白板已放大到 ${Math.round(Math.min(3, state.zoom + 0.1) * 100)}%。`);
        }
        if (action === "reset-zoom") {
          writeCanvasState(title, { ...state, zoom: 1, panX: 0, panY: 0 });
          renderCanvasPage(title);
          setOutput("白板缩放和位置已重置。");
        }
        if (action === "overview") {
          const pageRect = page?.getBoundingClientRect();
          if (!state.nodes.length || !pageRect) {
            writeCanvasState(title, { ...state, zoom: 1, panX: 0, panY: 0 });
          } else {
            const xs = state.nodes.map((node) => Number(node.x) || 0);
            const ys = state.nodes.map((node) => Number(node.y) || 0);
            const minX = Math.min(...xs);
            const minY = Math.min(...ys);
            const maxX = Math.max(...state.nodes.map((node) => (Number(node.x) || 0) + Math.max(160, Number(node.width) || 320)));
            const maxY = Math.max(...state.nodes.map((node) => (Number(node.y) || 0) + Math.max(86, Number(node.height) || 126)));
            const zoom = Math.min(1, Math.max(0.5, Math.min((pageRect.width - 120) / (maxX - minX || 1), (pageRect.height - 120) / (maxY - minY || 1))));
            writeCanvasState(title, {
              ...state,
              zoom,
              panX: Math.round((pageRect.width - (maxX - minX) * zoom) / 2 - minX * zoom),
              panY: Math.round((pageRect.height - (maxY - minY) * zoom) / 2 - minY * zoom),
            });
          }
          renderCanvasPage(title);
          setOutput("已总览全局。");
        }
        if (action === "zoom-out") {
          writeCanvasState(title, { ...state, zoom: Math.max(0.2, state.zoom - 0.1) });
          renderCanvasPage(title);
          setOutput(`白板已缩小到 ${Math.round(Math.max(0.2, state.zoom - 0.1) * 100)}%。`);
        }
        if (action === "settings") {
          canvasSettingsOpen = !canvasSettingsOpen;
          canvasPickerMode = "";
          renderCanvasPage(title);
          setOutput("白板设定：对齐网格、对齐物体和只读模式。");
        }
        if (action === "help") {
          canvasHelpOpen = !canvasHelpOpen;
          renderCanvasPage(title);
        }
        if (action === "undo") {
          const key = cleanNoteTitle(title) || "新白板";
          const previous = canvasUndoStacks[key]?.pop();
          if (previous === undefined) {
            showToast("没有可撤销的节点");
            return;
          }
          canvasRedoStacks[key] ||= [];
          canvasRedoStacks[key].push(safeStorageGetItem(canvasStoreKey(title)) || "");
          if (previous) safeStorageSetItem(canvasStoreKey(title), previous);
          else safeStorageRemoveItem(canvasStoreKey(title));
          renderCanvasPage(title);
          setOutput("已撤销上一步白板操作。");
        }
        if (action === "redo") {
          const key = cleanNoteTitle(title) || "新白板";
          const next = canvasRedoStacks[key]?.pop();
          if (next === undefined) {
            showToast("没有可重做的操作");
            return;
          }
          canvasUndoStacks[key] ||= [];
          canvasUndoStacks[key].push(safeStorageGetItem(canvasStoreKey(title)) || "");
          if (next) safeStorageSetItem(canvasStoreKey(title), next);
          renderCanvasPage(title);
          setOutput("已重做白板操作。");
        }
      }

      function renameCanvasTitle(oldTitle, newTitle) {
        const from = cleanNoteTitle(oldTitle);
        const to = cleanNoteTitle(newTitle) || from;
        if (!from || from === to) {
          updateNoteChromeTitle(to || "新白板");
          return;
        }
        const oldKey = canvasStoreKey(from);
        const state = safeStorageGetItem(oldKey);
        if (state && !safeStorageGetItem(canvasStoreKey(to))) {
          safeStorageSetItem(canvasStoreKey(to), state);
          safeStorageRemoveItem(oldKey);
        }
        renderCanvasPage(to);
        setOutput(`白板已重命名为《${to}》。`);
      }

      function databaseStoreKey(name) {
        return `loam-db:${cleanNoteTitle(name)}`;
      }

      function readDatabaseState(name) {
        try {
          return { sortCol: "name", sortDir: "asc", search: "", filterTag: "", ...JSON.parse(safeStorageGetItem(databaseStoreKey(name)) || "{}") };
        } catch { return { sortCol: "name", sortDir: "asc", search: "", filterTag: "" }; }
      }

      function writeDatabaseState(name, patch) {
        const state = { ...readDatabaseState(name), ...(patch || {}) };
        safeStorageSetItem(databaseStoreKey(name), JSON.stringify(state));
        return state;
      }

      function renderDatabasePage(name) {
        const dbTitle = name || "新数据库";
        lastDbVisited = dbTitle;
        pushRoute(`detail/database/${encodeURIComponent(dbTitle)}`);
        setEditorActionBarVisible(false);
        setDoc("数据库", dbTitle, `数据库《${dbTitle}》已打开。`);

        const state = readDatabaseState(dbTitle);
        const allTitles = catalogNoteTitles();

        let rows = allTitles.map((title) => {
          const meta = getNoteMeta(title);
          const space = spaceForTitle(title);
          const body = noteMarkdown(title);
          const wc = body.trim().split(/\s+/).filter(Boolean).length;
          const tags = Array.isArray(meta.tags) ? meta.tags : [];
          const updatedAt = meta.updatedAt ? formatLocalTime(meta.updatedAt) : "—";
          return { title, tags, space: space?.label || "—", wc, updatedAt };
        });

        const search = (state.search || "").toLowerCase();
        if (search) rows = rows.filter((r) =>
          r.title.toLowerCase().includes(search) ||
          r.tags.some((t) => t.toLowerCase().includes(search)) ||
          r.space.toLowerCase().includes(search)
        );
        if (state.filterTag) rows = rows.filter((r) => r.tags.includes(state.filterTag));

        const { sortCol, sortDir } = state;
        rows.sort((a, b) => {
          const va = sortCol === "wc" ? a.wc : sortCol === "space" ? a.space : sortCol === "updated" ? a.updatedAt : a.title;
          const vb = sortCol === "wc" ? b.wc : sortCol === "space" ? b.space : sortCol === "updated" ? b.updatedAt : b.title;
          if (va < vb) return sortDir === "asc" ? -1 : 1;
          if (va > vb) return sortDir === "asc" ? 1 : -1;
          return 0;
        });

        const allTags = [...new Set(allTitles.flatMap((t) => getNoteMeta(t).tags || []))].filter(Boolean).sort();

        const sortIcon = (col) => {
          if (sortCol !== col) return '<span class="db-sort-icon">⇅</span>';
          return `<span class="db-sort-icon active">${sortDir === "asc" ? "↑" : "↓"}</span>`;
        };
        const colHeader = (col, label) =>
          `<th class="db-th"><button class="db-sort-btn" data-db-sort="${col}" data-db-name="${escapeHtml(dbTitle)}">${label}${sortIcon(col)}</button></th>`;

        const tagFilterOptions = allTags.map((t) =>

        const rowsHtml = rows.map((r) => `

            <td class="db-td db-td-num">${r.wc}</td>

        ui.editorScroll.innerHTML = `
          <section class="db-page secondary-page">
            <div class="db-toolbar">
              <span class="db-count">${rows.length} 条笔记${state.search || state.filterTag ? "（已过滤）" : ""}</span>
              <input class="db-search" placeholder="搜索笔记名称、标签或空间…" value="${escapeHtml(state.search || "")}" data-db-search data-db-name="${escapeHtml(dbTitle)}" />

      function refreshStackLabels() {
        const labels = $$(".note-list .stack-label");
        labels.forEach((label) => {
          let cursor = label.nextElementSibling;
          let hasVisibleRows = false;
          while (cursor && !cursor.classList.contains("stack-label")) {
            if (cursor.matches?.(".pin-card, .note-row") && !cursor.hidden) hasVisibleRows = true;
            if (cursor.querySelector?.(".pin-card:not([hidden]), .note-row:not([hidden])")) hasVisibleRows = true;
            cursor = cursor.nextElementSibling;
          }
          label.hidden = !hasVisibleRows;
        });
      }

      function filterNotes(query, options = {}) {
        const value = query.trim().toLowerCase();
        let visible = 0;
        const noteFilter = options.noteFilter || (() => true);
        const showPins = options.showPins !== false;
        const includeMoved = options.includeMoved ?? ["search", "recursive"].includes(filePaneMode);
        const matchesPlacement = (el) => {
          const title = noteTitleFromElement(el);
          return includeMoved || !getNoteMeta(title).folder;
        };
        $$(".pin-card").forEach((card) => {
          const title = noteTitleFromElement(card);
          const matched = showPins && matchesPlacement(card) && title.toLowerCase().includes(value);
          card.hidden = !matched;
          if (matched) visible += 1;
        });
        $$(".note-row").forEach((row) => {
          const title = noteTitleFromElement(row);
          const matched = matchesPlacement(row) && noteFilter(row) && title.toLowerCase().includes(value);
          row.hidden = !matched;
          if (matched) visible += 1;
        });
        refreshStackLabels();
        return visible;
      }

      function refreshNoteListVisibility() {
        const query = filePaneMode === "search" ? ui.fileSearch?.value || "" : "";
        if (filePaneMode === "bookmarks") {
          return filterNotes("", {
            noteFilter: (row) => {
              const title = noteTitleFromElement(row);
              const tags = getNoteMeta(title).tags || [];
              return tags.includes("写作") || spaceForTitle(title)?.label === "写作";
            },
            showPins: true,
          });
        }
        return filterNotes(query, { showPins: true });
      }

      function spaceDefinition(label) {
        return spaceDefinitions.find((item) => item.label === label) || spaceDefinitions[0];
      }

      let _noteKeysCache = null;
      function getNoteKeysFromStorage() {
        if (_noteKeysCache) return _noteKeysCache;
        _noteKeysCache = new Set();
        safeStorageKeys("loam-note:").forEach((key) => {
          if (key?.startsWith("loam-note:")) _noteKeysCache.add(cleanNoteTitle(key.replace("loam-note:", "")));
        });
        return _noteKeysCache;
      }
      function invalidateNoteKeysCache() { _noteKeysCache = null; }

      function catalogNoteTitles() {
        const titles = new Set();
        $$(".pin-title, .note-title").forEach((el) => titles.add(cleanNoteTitle(el.textContent)));
        $$("[data-note-open]").forEach((el) => titles.add(cleanNoteTitle(el.dataset.noteOpen)));
        Object.keys(readNoteMeta()).forEach((title) => titles.add(cleanNoteTitle(title)));
        getNoteKeysFromStorage().forEach((title) => titles.add(title));
        if (activeNoteKey) titles.add(cleanNoteTitle(activeNoteKey));
        return [...titles].filter((title) => title && !isNoteDeleted(title));
      }

      function parseTimestampValue(value) {
        if (!value) return 0;
        const time = typeof value === "number" ? value : Date.parse(value);
        return Number.isFinite(time) ? time : 0;
      }

      function localDateKeyFromTimestamp(timestamp) {
        const date = new Date(timestamp);
        if (!Number.isFinite(date.getTime())) return "";
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${date.getFullYear()}-${month}-${day}`;
      }

      function timestampFromDateParts(year, month, day, hour = 0, minute = 0, second = 0) {
        const time = new Date(Number(year), Number(month) - 1, Number(day), Number(hour) || 0, Number(minute) || 0, Number(second) || 0).getTime();
        return Number.isFinite(time) ? time : 0;
      }

      function timestampFromTextDate(text = "") {
        const source = String(text || "");
        const match = source.match(/(20\d{2})[-/.年](\d{1,2})[-/.月](\d{1,2})(?:[日号])?(?:[ T\s]+(\d{1,2})[:：](\d{1,2})(?:[:：](\d{1,2}))?)?/);
        if (!match) return 0;
        return timestampFromDateParts(match[1], match[2], match[3], match[4] || 0, match[5] || 0, match[6] || 0);
      }

      function inferredNoteCreatedAt(title, body = "", index = 0) {
        const titleTime = timestampFromTextDate(title);
        if (titleTime) return titleTime;
        const bodyTime = timestampFromTextDate(body);
        if (bodyTime) return bodyTime;
        return Date.now() - Math.min(index, 29) * 86400000;
      }

      function stableNoteCreatedAt(title, index = 0, bodyOverride = null) {
        const meta = getNoteMeta(title);
        const body = bodyOverride === null ? noteMarkdown(title) : String(bodyOverride || "");
        const titleDateTime = timestampFromTextDate(title);
        const existingCreatedAt = parseTimestampValue(meta.createdAt);
        if (titleDateTime) {
          if (existingCreatedAt && localDateKeyFromTimestamp(existingCreatedAt) === localDateKeyFromTimestamp(titleDateTime)) {
            return existingCreatedAt;
          }
          return titleDateTime;
        }
        if (existingCreatedAt) return existingCreatedAt;
        const importedAt = parseTimestampValue(meta.importedAt);
        if (importedAt) return importedAt;
        return inferredNoteCreatedAt(title, body, index);
      }

      function noteListTimestamp(title, index = 0) {
        const timestamp = stableNoteCreatedAt(title, index);
        try {
          const meta = getNoteMeta(title);
          if (parseTimestampValue(meta.createdAt) !== timestamp) {
            saveNoteMetaTitle(title, { createdAt: timestamp, updatedAt: meta.updatedAt || timestamp }, { render: false });
          }
        } catch (error) {
          console.warn("Loam note timestamp meta sync skipped", error);
        }
        return timestamp;
      }

      function noteListSnippet(title) {
        const body = noteMarkdown(title)
          .replace(/^#{1,6}\s+.*$/gm, "")
          .replace(/!\[[^\]]*]\([^)]+\)/g, "")
          .replace(/\[[^\]]+]\(([^)]+)\)/g, "$1")
          .replace(/[`*_>#-]/g, " ")
          .replace(/\s+/g, " ")
          .trim();
        const cleanTitle = cleanNoteTitle(title);
        const snippet = body.replace(cleanTitle, "").trim() || "本地笔记";
        return snippet.length > 28 ? `${snippet.slice(0, 28)}...` : snippet;
      }

      function noteListDateLabel(timestamp) {
        const date = new Date(timestamp);
        const now = new Date();
        const start = (value) => new Date(value.getFullYear(), value.getMonth(), value.getDate()).getTime();
        const diffDays = Math.floor((start(now) - start(date)) / 86400000);
        const time = date.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
        if (diffDays <= 0) return time;
        if (diffDays === 1) return `昨天 ${time}`;
        const dateText = `${date.getFullYear()}/${String(date.getMonth() + 1).padStart(2, "0")}/${String(date.getDate()).padStart(2, "0")}`;
        return `${dateText} ${time}`;
      }

      function noteListGroupLabel(timestamp) {
        const date = new Date(timestamp);
        const now = new Date();
        const start = (value) => new Date(value.getFullYear(), value.getMonth(), value.getDate()).getTime();
        const diffDays = Math.floor((start(now) - start(date)) / 86400000);
        if (diffDays <= 0) return "今天";
        if (diffDays === 1) return "昨天";
        if (diffDays <= 7) return "过去 7 天";
        if (diffDays <= 30) return "过去 30 天";
        return "更早";
      }

      function renderLocalNoteRow(item) {
        const active = cleanNoteTitle(item.title) === cleanNoteTitle(activeNoteKey) ? " active" : "";
        return `
          <article class="note-row${active}" data-local-note-row="${escapeHtml(item.title)}" data-note-open="${escapeHtml(item.title)}">
            <div>
              <div class="note-title">${escapeHtml(item.title)}</div>
              <div class="note-time">${escapeHtml(noteListDateLabel(item.updatedAt))}<span class="note-snippet"> ${escapeHtml(noteListSnippet(item.title))}</span></div>
            </div>
          </article>`;
      }

      function renderLocalNoteList() {
        const host = $("#localNoteList");
        if (!host) return;
        const titles = catalogNoteTitles()
          .filter((title, index, list) => list.indexOf(title) === index)
          .filter((title) => !isNoteDeleted(title))
          .filter((title) => !getNoteMeta(title).folder);
        const items = titles
          .map((title, index) => ({ title, updatedAt: noteListTimestamp(title, index) }))
          .sort((a, b) => b.updatedAt - a.updatedAt || a.title.localeCompare(b.title, "zh-Hans-CN"));
        const groups = ["今天", "昨天", "过去 7 天", "过去 30 天", "更早"];
        const html = groups.map((label) => {
          const rows = items.filter((item) => noteListGroupLabel(item.updatedAt) === label);
          if (!rows.length) return "";
          return `
            <div class="stack-label">${label}</div>
            <div class="note-group-list${label === "今天" ? " notes" : ""}">
              ${rows.map(renderLocalNoteRow).join("")}
            </div>`;
        }).join("");
        host.innerHTML = html || `<div class="folder-empty">本地还没有笔记，点「新笔记」开始写。</div>`;
        ensureNoteMenuButtons(host);
        applyNoteCatalogState(host);
      }

      function syncLocalNoteListAfterSave() {
        try {
          renderLocalNoteList();
          refreshNoteListVisibility();
          return true;
        } catch (error) {
          console.error("Loam note list sync failed", error);
          setOutput(`笔记已保存，但左侧列表刷新失败：${error?.message || error}`);
          return false;
        }
      }

      function spaceSourceForTitle(title) {
        return noteTagSourceText(title, noteMarkdown(title));
      }

      function scoreSpaceForTitle(definition, title) {
        const text = spaceSourceForTitle(title);
        const metaTags = getNoteMeta(title).tags || [];
        const tagScore = metaTags.includes(definition.label) ? 3 : 0;
        return tagScore + definition.keywords.reduce((sum, keyword) => sum + keywordCount(text, keyword), 0);
      }

      function spaceForTitle(title) {
        const scored = spaceDefinitions
          .map((definition) => ({ ...definition, score: scoreSpaceForTitle(definition, title) }))
          .filter((definition) => definition.score > 0)
          .sort((a, b) => b.score - a.score || a.label.localeCompare(b.label, "zh-Hans-CN"));
        return scored[0] || null;
      }

      function notesForSpace(label) {
        return catalogNoteTitles()
          .map((title) => ({ title, space: spaceForTitle(title) }))
          .filter((item) => item.space?.label === label);
      }

      function spaceCounts() {
        const counts = Object.fromEntries(spaceDefinitions.map((item) => [item.label, 0]));
        catalogNoteTitles().forEach((title) => {
          const space = spaceForTitle(title);
          if (space) counts[space.label] += 1;
        });
        return counts;
      }

      function refreshSpaceNav(activeLabel = "") {
        const nav = $(".space-nav");
        if (!nav) return;
        const counts = spaceCounts();
        const current = activeLabel || spaceForTitle(activeNoteKey)?.label || "写作";

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
      }

      function clampColorValue(value) {
        return Math.max(0, Math.min(255, Number(value) || 0));
      }

      function normalizeHex(value) {
        const clean = String(value || "").replace(/[^0-9a-f]/gi, "").slice(0, 6);
        if (clean.length === 3) return clean.split("").map((char) => char + char).join("").toLowerCase();
        return clean.padEnd(6, "0").slice(0, 6).toLowerCase();
      }

      function rgbaToHex(rgba) {
        return ["r", "g", "b"].map((key) => clampColorValue(rgba[key]).toString(16).padStart(2, "0")).join("");
      }

      function hexToRgba(value, alpha = 255) {
        const hex = normalizeHex(value);
        return {
          r: parseInt(hex.slice(0, 2), 16),
          g: parseInt(hex.slice(2, 4), 16),
          b: parseInt(hex.slice(4, 6), 16),
          a: clampColorValue(alpha),
        };
      }

      function colorToRgba(value, fallback = "#3b82f6") {
        const source = String(value || fallback).trim();
        const rgbaMatch = source.match(/rgba?\(([^)]+)\)/i);
        if (rgbaMatch) {
          const parts = rgbaMatch[1].split(",").map((part) => part.trim());
          const alpha = parts[3] === undefined ? 255 : Math.round(Math.max(0, Math.min(1, Number(parts[3]))) * 255);
          return { r: clampColorValue(parts[0]), g: clampColorValue(parts[1]), b: clampColorValue(parts[2]), a: alpha };
        }
        return hexToRgba(source.replace("#", ""), 255);
      }

      function rgbaToCss(rgba) {
        const alpha = clampColorValue(rgba.a);
        const base = { r: clampColorValue(rgba.r), g: clampColorValue(rgba.g), b: clampColorValue(rgba.b), a: alpha };
        if (alpha >= 255) return `#${rgbaToHex(base)}`;
        return `rgba(${base.r}, ${base.g}, ${base.b}, ${(alpha / 255).toFixed(2)})`;
      }

      function recentColorStoreKey() {
        return "loam-recent-colors";
      }

      function readRecentColors() {
        try {
          return JSON.parse(safeStorageGetItem(recentColorStoreKey()) || "[]");
        } catch {
          return [];
        }
      }

      function saveRecentColor(color) {
        const css = rgbaToCss(color);
        const recent = [css, ...readRecentColors().filter((item) => item !== css)].slice(0, 10);
        safeStorageSetItem(recentColorStoreKey(), JSON.stringify(recent));
      }

      function clearRecentColors() {
        safeStorageRemoveItem(recentColorStoreKey());
        renderRecentColors();
      }

      function setPreviewSwatch(el, colorValue) {
        if (!el) return;
        if (!colorValue) {
          el.classList.add("is-empty");
          el.style.removeProperty("--preview-color");
          return;
        }
        el.classList.remove("is-empty");
        el.style.setProperty("--preview-color", colorValue);
      }

      function renderColorPalette() {
        if (!ui.colorPalette) return;
        const activeHex = rgbaToHex(colorPickerState.rgba);
        ui.colorPalette.innerHTML = defaultColorSwatches.map((color) => `
          <button class="color-swatch-button${color.replace("#", "") === activeHex ? " active" : ""}" data-color-swatch="${color}" style="--swatch-color:${color}" aria-label="${color}"></button>
        `).join("");
      }

      function renderRecentColors() {
        if (!ui.recentColorGrid) return;
        const recent = readRecentColors();
        ui.recentColorGrid.innerHTML = Array.from({ length: 10 }, (_, index) => {
          const color = recent[index];
          if (!color) return `<button class="recent-color-slot is-empty" disabled aria-label="空颜色"></button>`;
          return `<button class="recent-color-slot" data-color-recent="${escapeHtml(color)}" style="--swatch-color:${escapeHtml(color)}" aria-label="${escapeHtml(color)}"></button>`;
        }).join("");
      }

      function syncColorControls() {
        const rgba = colorPickerState.rgba;
        const css = rgbaToCss(rgba);
        setPreviewSwatch(ui.colorNewPreview, css);
        if (ui.colorHexInput) ui.colorHexInput.value = rgbaToHex(rgba);
        ["r", "g", "b", "a"].forEach((key) => {
          const slider = $(`[data-color-slider="${key}"]`);
          const output = $(`[data-color-output="${key}"]`);
          if (slider) slider.value = clampColorValue(rgba[key]);
          if (output) output.textContent = clampColorValue(rgba[key]);
        });
        renderColorPalette();
      }

      function setColorDraft(color, alpha) {
        colorPickerState.rgba = typeof color === "string" ? colorToRgba(color, colorPickerState.field === "accent" ? "#4d8a3f" : "#3b82f6") : { ...color, a: alpha ?? color.a ?? 255 };
        syncColorControls();
      }

      function openColorPicker(title, field = "bg") {
        const cleanTitle = cleanNoteTitle(title);
        const meta = getNoteMeta(cleanTitle);
        const current = field === "accent" ? meta.accent : meta.bg;
        colorPickerState = {
          title: cleanTitle,
          field,
          rgba: colorToRgba(current, field === "accent" ? "#4d8a3f" : "#3b82f6"),
        };
        if (ui.colorModalTitle) ui.colorModalTitle.textContent = field === "accent" ? "更改颜色" : "更改背景";
        setPreviewSwatch(ui.colorCurrentPreview, current);
        renderColorPalette();
        renderRecentColors();
        syncColorControls();
        if (ui.colorModal) ui.colorModal.hidden = false;
        createIcons(ui.colorModal);
        closeNoteContextMenu();
      }

      function closeColorPicker() {
        if (ui.colorModal) ui.colorModal.hidden = true;
      }

      function applyColorPicker() {
        const title = colorPickerState.title;
        const value = rgbaToCss(colorPickerState.rgba);
        const patch = colorPickerState.field === "accent" ? { accent: value } : { bg: value };
        saveRecentColor(colorPickerState.rgba);
        saveNoteMetaTitle(title, patch);
        applyActiveNoteMeta();
        closeColorPicker();
        setOutput(`《${title}》${colorPickerState.field === "accent" ? "颜色" : "背景"}已应用：${value}。`);
        showToast(colorPickerState.field === "accent" ? "颜色已应用" : "背景已应用");
      }

      function noteMetaStoreKey() {
        return "loam-note-meta";
      }

      function deletedNoteStoreKey() {
        return "loam-deleted-notes-v2";
      }

      let _noteMetaCache = null;

      function readNoteMeta() {
        if (_noteMetaCache) return _noteMetaCache;
        try {
          _noteMetaCache = JSON.parse(safeStorageGetItem(noteMetaStoreKey()) || "{}");
        } catch {
          _noteMetaCache = {};
        }
        return _noteMetaCache;
      }

      function writeNoteMeta(meta) {
        _noteMetaCache = meta || {};
        safeStorageSetItem(noteMetaStoreKey(), JSON.stringify(_noteMetaCache));
      }

      function getNoteMeta(title) {
        return readNoteMeta()[cleanNoteTitle(title)] || {};
      }

      function saveNoteMetaTitle(title, patch, options = {}) {
        const cleanTitle = cleanNoteTitle(title);
        const meta = readNoteMeta();
        meta[cleanTitle] = { ...(meta[cleanTitle] || {}), ...(patch || {}) };
        writeNoteMeta(meta);
        if (options.render !== false) {
          renderLocalNoteList();
          applyNoteCatalogState(document);
        }
        return meta[cleanTitle];
      }

      function transferNoteMeta(oldTitle, newTitle) {
        const oldClean = cleanNoteTitle(oldTitle);
        const newClean = cleanNoteTitle(newTitle);
        const meta = readNoteMeta();
        if (meta[oldClean]) {
          meta[newClean] = { ...meta[oldClean] };
          delete meta[oldClean];
          writeNoteMeta(meta);
        }
      }

      const relationTypeLabels = {
        support: "支持",
        rebuttal: "反驳",
        derive: "衍生",
        mention: "提及",
      };

      const relationTypeAliases = {
        支持: "support",
        赞同: "support",
        证明: "support",
        反驳: "rebuttal",
        质疑: "rebuttal",
        冲突: "rebuttal",
        衍生: "derive",
        派生: "derive",
        延伸: "derive",
        提及: "mention",
        引用: "mention",
        相关: "mention",
        support: "support",
        rebuttal: "rebuttal",
        derive: "derive",
        mention: "mention",
      };

      function relationTypeLabel(type) {
        return relationTypeLabels[normalizeRelationType(type)] || "提及";
      }

      function normalizeRelationType(type) {
        return relationTypeAliases[String(type || "").trim()] || "mention";
      }

      function blockIndexStoreKey() {
        return "loam-block-index-v1";
      }

      function relationEdgeStoreKey() {
        return "loam-relation-edges-v1";
      }

      function readBlockIndex() {
        try {
          return JSON.parse(safeStorageGetItem(blockIndexStoreKey()) || "{}") || {};
        } catch {
          return {};
        }
      }

      function writeBlockIndex(index) {
        safeStorageSetItem(blockIndexStoreKey(), JSON.stringify(index || {}));
      }

      function readRelationEdges() {
        try {
          return (JSON.parse(safeStorageGetItem(relationEdgeStoreKey()) || "[]") || []).map(normalizeRelationEdge).filter(Boolean);
        } catch {
          return [];
        }
      }

      function writeRelationEdges(edges) {
        safeStorageSetItem(relationEdgeStoreKey(), JSON.stringify((edges || []).map(normalizeRelationEdge).filter(Boolean)));
      }

      function hashText(value = "") {
        let hash = 2166136261;
        const text = String(value || "");
        for (let index = 0; index < text.length; index += 1) {
          hash ^= text.charCodeAt(index);
          hash = Math.imul(hash, 16777619);
        }
        return (hash >>> 0).toString(36);
      }

      function shortStableId(prefix, seed = "") {
        return `${prefix}_${hashText(`${seed}:${Date.now()}:${Math.random()}`).slice(0, 7)}`;
      }

      function ensureNotePageId(title, options = {}) {
        const cleanTitle = cleanNoteTitle(title);
        const meta = readNoteMeta();
        const current = meta[cleanTitle] || {};
        if (current.pageId) return current.pageId;
        const pageId = shortStableId("pg", cleanTitle);
        meta[cleanTitle] = { ...current, pageId };
        writeNoteMeta(meta);
        if (options.render !== false) applyNoteCatalogState(document);
        return pageId;
      }

      function titleForPageId(pageId) {
        const hit = Object.entries(readNoteMeta()).find(([, meta]) => meta?.pageId === pageId);
        return hit?.[0] || "";
      }

      function pageIdForRef(pageRef) {
        const cleanRef = String(pageRef || "").trim();
        if (!cleanRef) return "";
        const byId = titleForPageId(cleanRef);
        if (byId) return cleanRef;
        return ensureNotePageId(cleanRef, { render: false });
      }

      function compactBlockText(value = "") {
        return String(value || "")
          .replace(/!\[[^\]]*]\([^)]+\)/g, " ")
          .replace(/\[\[([^\]#|]+)#([^\]|]+)(?:\|([^\]]+))?]]/g, "$3 $1")
          .replace(/\[[^\]]+]\(([^)]+)\)/g, "$1")
          .replace(/[`*_>#]/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      function parseMarkdownBlocks(markdown = "") {
        const lines = String(markdown || "").split("\n");
        const blocks = [];
        let paragraph = [];
        let paragraphStart = 0;

        const flushParagraph = (endLine) => {
          const text = compactBlockText(paragraph.join(" "));
          if (text) blocks.push({ type: "paragraph", text, raw: paragraph.join("\n"), startLine: paragraphStart, endLine, order: blocks.length });
          paragraph = [];
        };

        lines.forEach((line, lineIndex) => {
          const trimmed = line.trim();
          if (!trimmed) {
            flushParagraph(lineIndex);
            return;
          }
          if (/^#{1,6}\s+/.test(trimmed)) {
            flushParagraph(lineIndex);
            return;
          }
          const listMatch = trimmed.match(/^(?:[-*+]|\d+[.)])\s+(.+)$/);
          if (listMatch) {
            flushParagraph(lineIndex);
            const text = compactBlockText(listMatch[1]);
            if (text) blocks.push({ type: "list", text, raw: line, startLine: lineIndex, endLine: lineIndex, order: blocks.length });
            return;
          }
          if (!paragraph.length) paragraphStart = lineIndex;
          paragraph.push(line);
        });
        flushParagraph(lines.length);
        return blocks;
      }

      function blockKeywordSet(text = "") {
        const clean = compactBlockText(text).toLowerCase();
        const terms = new Set();
        (clean.match(/[a-z0-9][a-z0-9_-]{2,}/gi) || []).forEach((word) => terms.add(word.toLowerCase()));
        (clean.match(/[\u4e00-\u9fff]{2,12}/g) || []).forEach((chunk) => {
          if (chunk.length <= 6) terms.add(chunk);
          for (let size = 2; size <= Math.min(5, chunk.length); size += 1) {
            for (let index = 0; index <= chunk.length - size; index += 1) terms.add(chunk.slice(index, index + size));
          }
        });
        (diaryTagRules || []).forEach(([, keywords]) => {
          keywords.forEach((keyword) => {
            const term = String(keyword || "").toLowerCase();
            if (term.length >= 2 && clean.includes(term)) terms.add(term);
          });
        });
        catalogNoteTitles().forEach((title) => {
          const term = cleanNoteTitle(title).toLowerCase();
          if (term.length >= 2 && clean.includes(term)) terms.add(term);
        });
        ["这个", "一个", "我们", "你们", "他们", "因为", "所以", "但是", "不是", "可以", "需要", "已经", "应该", "没有", "进行"].forEach((word) => terms.delete(word));
        return terms;
      }

      function blockSimilarity(a = "", b = "") {
        const left = blockKeywordSet(a);
        const right = blockKeywordSet(b);
        if (!left.size || !right.size) return 0;
        let shared = 0;
        left.forEach((term) => { if (right.has(term)) shared += 1; });
        return shared / Math.max(left.size, right.size);
      }

      function assignBlockIds(pageId, parsedBlocks, previousBlocks = []) {
        const byHash = new Map();
        previousBlocks.forEach((block) => {
          const bucket = byHash.get(block.hash) || [];
          bucket.push(block);
          byHash.set(block.hash, bucket);
        });
        const used = new Set();
        return parsedBlocks.map((block, order) => {
          const hash = hashText(block.text);
          let previous = (byHash.get(hash) || []).find((item) => !used.has(item.id));
          if (!previous) {
            previous = previousBlocks
              .filter((item) => !used.has(item.id) && item.type === block.type)
              .map((item) => ({ item, score: Math.max(item.order === order ? 0.52 : 0, blockSimilarity(item.text, block.text)) }))
              .filter((item) => item.score >= 0.5)
              .sort((a, b) => b.score - a.score)[0]?.item;
          }
          const id = previous?.id || shortStableId("bk", `${pageId}:${order}:${block.text}`);
          used.add(id);
          return { ...block, id, pageId, hash, order, updatedAt: Date.now() };
        });
      }

      function normalizeRelationEdge(edge = {}) {
        const fromPageId = String(edge.fromPageId || "").trim();
        const fromBlockId = String(edge.fromBlockId || "").trim();
        const toPageId = String(edge.toPageId || "").trim();
        const toBlockId = String(edge.toBlockId || "").trim();
        if (!fromPageId || !fromBlockId || !toPageId || !toBlockId) return null;
        const relationType = normalizeRelationType(edge.relationType);
        const confidence = Math.max(0, Math.min(1, Number(edge.confidence ?? 1)));
        const source = edge.source || "manual";
        return {
          id: edge.id || hashText(`${fromPageId}:${fromBlockId}:${toPageId}:${toBlockId}:${relationType}:${source}`),
          fromPageId,
          fromBlockId,
          toPageId,
          toBlockId,
          relationType,
          confidence,
          source,
          createdAt: edge.createdAt || new Date().toISOString(),
          updatedAt: edge.updatedAt || new Date().toISOString(),
        };
      }

      function edgeSignature(edge) {
        return `${edge.fromPageId}:${edge.fromBlockId}->${edge.toPageId}:${edge.toBlockId}:${normalizeRelationType(edge.relationType)}`;
      }

      function upsertRelationEdge(edge) {
        const normalized = normalizeRelationEdge(edge);
        if (!normalized) return null;
        const edges = readRelationEdges();
        const signature = edgeSignature(normalized);
        const index = edges.findIndex((item) => edgeSignature(item) === signature);
        if (index >= 0) edges[index] = { ...edges[index], ...normalized, updatedAt: new Date().toISOString() };
        else edges.push(normalized);
        writeRelationEdges(edges);
        return normalized;
      }

      function removeRelationsForPage(pageId) {
        if (!pageId) return;
        writeRelationEdges(readRelationEdges().filter((edge) => edge.fromPageId !== pageId && edge.toPageId !== pageId));
        const index = readBlockIndex();
        delete index[pageId];
        writeBlockIndex(index);
      }

      function blockById(pageId, blockId) {
        return (readBlockIndex()[pageId]?.blocks || []).find((block) => block.id === blockId) || null;
      }

      function syncExplicitBlockReferences(pageId, blocks) {
        const edges = readRelationEdges().filter((edge) => !(edge.source === "explicit" && edge.fromPageId === pageId));
        const refPattern = /\[\[([^#\]|]+)#([^\]|]+)(?:\|([^\]]+))?]]/g;
        blocks.forEach((block) => {
          let match;
          while ((match = refPattern.exec(block.raw || block.text))) {
            const toPageId = pageIdForRef(match[1]);
            const toBlockId = String(match[2] || "").trim();
            if (!toPageId || !toBlockId) continue;
            edges.push(normalizeRelationEdge({
              fromPageId: pageId,
              fromBlockId: block.id,
              toPageId,
              toBlockId,
              relationType: normalizeRelationType(match[3] || "mention"),
              confidence: 1,
              source: "explicit",
            }));
          }
        });
        writeRelationEdges(edges.filter(Boolean));
      }

      function indexNoteBlocks(title, markdown = noteMarkdown(title), options = {}) {
        const cleanTitle = cleanNoteTitle(title);
        const pageId = ensureNotePageId(cleanTitle, { render: false });
        const index = readBlockIndex();
        const previous = index[pageId] || {};
        const blocks = assignBlockIds(pageId, parseMarkdownBlocks(markdown), previous.blocks || []);
        index[pageId] = {
          pageId,
          title: cleanTitle,
          updatedAt: new Date().toISOString(),
          blocks,
        };
        writeBlockIndex(index);
        if (options.syncExplicit !== false) syncExplicitBlockReferences(pageId, blocks);
        return index[pageId];
      }

      function relationAlreadyExists(fromBlockId, toBlockId) {
        return readRelationEdges().some((edge) => (
          (edge.fromBlockId === fromBlockId && edge.toBlockId === toBlockId) ||
          (edge.fromBlockId === toBlockId && edge.toBlockId === fromBlockId)
        ));
      }

      function sharedTermsForBlocks(a, b) {
        const left = blockKeywordSet(a);
        const right = blockKeywordSet(b);
        return [...left].filter((term) => right.has(term) && term.length >= 2).slice(0, 6);
      }

      function buildImplicitRelationSuggestions(title = activeNoteKey) {
        const current = indexNoteBlocks(title, ui.noteEditor?.value || noteMarkdown(title), { syncExplicit: true });
        const index = readBlockIndex();
        const suggestions = [];
        (current.blocks || []).forEach((fromBlock) => {
          Object.values(index).forEach((page) => {
            if (page.pageId === current.pageId) return;
            (page.blocks || []).forEach((toBlock) => {
              if (relationAlreadyExists(fromBlock.id, toBlock.id)) return;
              const shared = sharedTermsForBlocks(fromBlock.text, toBlock.text);
              const strongShared = shared.filter((term) => term.length >= 3);
              if (!strongShared.length) return;
              const score = Math.min(0.92, 0.44 + strongShared.length * 0.08);
              suggestions.push({
                fromPageId: current.pageId,
                fromBlockId: fromBlock.id,
                fromText: fromBlock.text,
                toPageId: page.pageId,
                toBlockId: toBlock.id,
                toTitle: page.title,
                toText: toBlock.text,
                terms: strongShared,
                score,
              });
            });
          });
        });
        return suggestions
          .sort((a, b) => b.score - a.score || b.terms.length - a.terms.length)
          .slice(0, 6);
      }

      function scheduleImplicitRelationScan() {
        clearTimeout(implicitRelationScanTimer);
        implicitRelationScanTimer = setTimeout(() => {
          const run = () => {
            try {
              implicitRelationSuggestions = buildImplicitRelationSuggestions(activeNoteKey);
              renderImplicitRelationHint();
            } catch (error) {
              console.warn("Loam implicit relation scan failed", error);
            }
          };
          if ("requestIdleCallback" in window) requestIdleCallback(run, { timeout: 900 });
          else setTimeout(run, 120);
        }, 420);
      }

      function renderImplicitRelationHint() {
        if (!ui.implicitRelationHint) return;
        const suggestions = implicitRelationSuggestions || [];
        if (!suggestions.length || splitMode) {
          ui.implicitRelationHint.hidden = true;
          ui.implicitRelationHint.innerHTML = "";
          return;
        }
        ui.implicitRelationHint.hidden = false;
        ui.implicitRelationHint.classList.toggle("collapsed", !implicitRelationHintOpen);
        if (!implicitRelationHintOpen) {
          ui.implicitRelationHint.innerHTML = `<button class="implicit-relation-toggle" data-implicit-toggle type="button">隐性关联 ${suggestions.length}</button>`;
          return;
        }
        ui.implicitRelationHint.innerHTML = `
          <button class="implicit-relation-toggle" data-implicit-toggle type="button">隐性关联 ${suggestions.length}</button>
          <div class="implicit-relation-list">
            ${suggestions.map((item, index) => `
              <div class="implicit-relation-item" data-implicit-item="${index}">
                <strong>${escapeHtml(item.toTitle)}</strong>
                <small>共同概念：${item.terms.map(escapeHtml).join("、")}</small>
                <small>${escapeHtml(item.toText.slice(0, 76))}${item.toText.length > 76 ? "..." : ""}</small>
                <div class="implicit-relation-actions">
                  <select data-implicit-relation-type="${index}" aria-label="关系类型">
                    ${Object.entries(relationTypeLabels).map(([value, label]) => `<option value="${value}">${label}</option>`).join("")}
                  </select>
                  <button class="text-button" data-implicit-accept="${index}" type="button">建立双链</button>
                  <button class="text-button" data-implicit-dismiss="${index}" type="button">忽略</button>
                </div>
              </div>
            `).join("")}
          </div>`;
      }

      function acceptImplicitRelation(index, type = "mention") {
        const item = implicitRelationSuggestions[Number(index)];
        if (!item) return;
        upsertRelationEdge({
          fromPageId: item.fromPageId,
          fromBlockId: item.fromBlockId,
          toPageId: item.toPageId,
          toBlockId: item.toBlockId,
          relationType: type,
          confidence: 1,
          source: "manual",
        });
        implicitRelationSuggestions.splice(Number(index), 1);
        renderImplicitRelationHint();
        renderRightPanel(currentRightPanel);
        setOutput(`已建立块级双链：${relationTypeLabel(type)} → 《${item.toTitle}》的具体文本块。`);
        showToast("块级双链已建立");
      }

      function dismissImplicitRelation(index) {
        implicitRelationSuggestions.splice(Number(index), 1);
        renderImplicitRelationHint();
        showToast("已忽略");
      }

      function activePageId() {
        return ensureNotePageId(activeNoteKey, { render: false });
      }

      function pageRecord(pageId) {
        return readBlockIndex()[pageId] || null;
      }

      function relationRowsForDirection(direction) {
        const pageId = activePageId();
        return readRelationEdges()
          .filter((edge) => direction === "incoming" ? edge.toPageId === pageId : edge.fromPageId === pageId)
          .map((edge) => {
            const otherPageId = direction === "incoming" ? edge.fromPageId : edge.toPageId;
            const otherBlockId = direction === "incoming" ? edge.fromBlockId : edge.toBlockId;
            const page = pageRecord(otherPageId);
            const block = blockById(otherPageId, otherBlockId);
            return {
              edge,
              title: page?.title || titleForPageId(otherPageId) || otherPageId,
              text: block?.text || "块内容暂未索引",
              type: relationTypeLabel(edge.relationType),
              confidence: edge.confidence,
            };
          });
      }

      function relationFilterButtons() {
        return `
          <button class="text-button active" data-graph-filter="all">全部</button>
          ${Object.entries(relationTypeLabels).map(([value, label]) => `<button class="text-button" data-graph-filter="${value}">${label}</button>`).join("")}
          <button class="text-button" data-graph-filter="ai">AI 猜测</button>`;
      }

      function relationGraphEdges() {
        const pageId = activePageId();
        return readRelationEdges()
          .filter((edge) => edge.fromPageId === pageId || edge.toPageId === pageId)
          .slice(0, 10);
      }

      function graphPageTemplate() {
        indexNoteBlocks(activeNoteKey, ui.noteEditor?.value || noteMarkdown(activeNoteKey), { syncExplicit: true });
        const edges = relationGraphEdges();
        const centerTitle = escapeHtml(activeNoteKey);
        const nodeCount = Math.max(edges.length, 1);
        const paths = edges.map((edge, index) => {
          const angle = (-120 + (240 / Math.max(nodeCount - 1, 1)) * index) * Math.PI / 180;
          const x = Math.round(500 + Math.cos(angle) * 330);
          const y = Math.round(280 + Math.sin(angle) * 210);
          const c1x = Math.round(500 + Math.cos(angle) * 126);
          const c1y = Math.round(280 + Math.sin(angle) * 86);
          const c2x = Math.round(500 + Math.cos(angle) * 236);
          const c2y = Math.round(280 + Math.sin(angle) * 164);
          const confidence = edge.confidence < 1 ? "ai" : "manual";
          return `<path data-rel="${escapeHtml(edge.relationType)}" data-confidence="${confidence}" d="M500 280 C${c1x} ${c1y} ${c2x} ${c2y} ${x} ${y}"></path>`;
        }).join("");
        const nodes = edges.map((edge, index) => {
          const angle = (-120 + (240 / Math.max(nodeCount - 1, 1)) * index) * Math.PI / 180;
          const x = 50 + Math.cos(angle) * 33;
          const y = 50 + Math.sin(angle) * 37;
          const outgoing = edge.fromPageId === activePageId();
          const otherPageId = outgoing ? edge.toPageId : edge.fromPageId;
          const otherBlockId = outgoing ? edge.toBlockId : edge.fromBlockId;
          const page = pageRecord(otherPageId);
          const block = blockById(otherPageId, otherBlockId);
          const title = page?.title || titleForPageId(otherPageId) || otherPageId;
          const source = edge.confidence < 1 ? "AI 猜测" : edge.source === "explicit" ? "显式引用" : "人工确认";
          return `
            <button class="kg-node" data-rel="${escapeHtml(edge.relationType)}" data-confidence="${edge.confidence < 1 ? "ai" : "manual"}" style="--x:${x.toFixed(1)}%; --y:${y.toFixed(1)}%" data-note-open="${escapeHtml(title)}">
              <strong>${escapeHtml(title)}</strong>
              <small>${outgoing ? "指向" : "来自"} · ${relationTypeLabel(edge.relationType)} · ${source}</small>
              <small class="graph-node-id">${escapeHtml(otherBlockId)} · ${escapeHtml((block?.text || "").slice(0, 24))}</small>
            </button>`;
        }).join("");
        const empty = edges.length ? "" : `<div class="graph-empty-state">还没有块级关系。保存笔记后 Loam 会建立块索引；接受右下角“隐性关联”，或写入 [[页面ID#块ID]]，这里就会出现可筛选的关系线。</div>`;
        return `
          <section class="secondary-page graph-page">
            <div class="page-head"><p style="color:var(--muted);font-size:13px;margin:0">当前笔记在中心，关系线来自块级边表：起点块、终点块、关系类型和置信度都会被记录。</p><button class="mini-action" data-page="note">返回笔记</button></div>
            <div class="graph-toolbar" aria-label="图谱筛选">${relationFilterButtons()}</div>
            <div class="knowledge-graph" aria-label="当前笔记关系图谱">
              <svg class="graph-edges" viewBox="0 0 1000 560" preserveAspectRatio="none" aria-hidden="true">${paths}</svg>
              <button class="kg-node center" style="--x: 50%; --y: 50%" data-page="note"><strong>${centerTitle}</strong><small>当前笔记 · ${escapeHtml(activePageId())}</small></button>
              ${nodes}
              ${empty}
            </div>
            <div class="graph-legend" aria-label="图例">
              <span><i class="support-dot"></i>支持</span>
              <span><i class="rebuttal-dot"></i>反驳</span>
              <span><i class="derive-dot"></i>衍生</span>
              <span><i class="mention-dot"></i>提及</span>
              <span><i></i>实线=人工/显式，虚线=AI/低置信</span>
            </div>
          </section>`;
      }

      function readDeletedNotes() {
        try {
          return new Set(JSON.parse(safeStorageGetItem(deletedNoteStoreKey()) || "[]"));
        } catch {
          return new Set();
        }
      }

      function writeDeletedNotes(notes) {
        safeStorageSetItem(deletedNoteStoreKey(), JSON.stringify([...notes].map(cleanNoteTitle)));
      }

      function isNoteDeleted(title) {
        return readDeletedNotes().has(cleanNoteTitle(title));
      }

      function noteTitleFromElement(el) {
        if (!el) return "";
        if (el.matches?.("[data-note-open]")) return el.dataset.noteOpen || "";
        if (el.matches?.(".pin-card")) return $(".pin-title", el)?.textContent || "";
        if (el.matches?.(".note-row")) return $(".note-title", el)?.textContent || "";
        if (el.matches?.(".editor-tab")) return $("span", el)?.textContent || "";
        if (el.matches?.("h1, .edit-surface")) return activeNoteKey;
        const owner = el.closest?.(".pin-card, .note-row, [data-note-open], .editor-tab, h1, .edit-surface");
        return owner ? noteTitleFromElement(owner) : "";
      }

      function visibleNoteElements(title, root = document) {
        const cleanTitle = cleanNoteTitle(title);
        return [
          ...$$(".pin-card", root).filter((el) => cleanNoteTitle(noteTitleFromElement(el)) === cleanTitle),
          ...$$(".note-row", root).filter((el) => cleanNoteTitle(noteTitleFromElement(el)) === cleanTitle),
          ...$$("[data-note-open]", root).filter((el) => cleanNoteTitle(el.dataset.noteOpen) === cleanTitle),
        ];
      }

      function notePath(title) {
        const filename = cleanNoteTitle(title).replace(/[\\/:*?"<>|#\[\]]/g, " ").replace(/\s+/g, " ").trim() || "未命名笔记";
        return `${vaultStoragePath()}/${filename}.md`;
      }

      function noteBodyWithHeading(body, title) {
        const cleanTitle = cleanNoteTitle(title);
        const targetHeading = `# ${cleanTitle}`;
        const source = body || "";
        if (!source.trim()) return `${targetHeading}\n\n`;
        const lines = source.split("\n");
        const firstTextLine = lines.findIndex((line) => line.trim());
        if (firstTextLine >= 0 && /^#\s+/.test(lines[firstTextLine].trim())) {
          lines[firstTextLine] = targetHeading;
          return lines.join("\n");
        }
        return `${targetHeading}\n\n${source}`;
      }

      function noteMarkdown(title) {
        if (cleanNoteTitle(title) === cleanNoteTitle(activeNoteKey) && ui.noteEditor) return ui.noteEditor.value;
        return safeStorageGetItem(`loam-note:${cleanNoteTitle(title)}`) || defaultBodyForTitle(title);
      }

      function applyNoteMetaToElement(el, title) {
        if (!el) return;
        const cleanTitle = cleanNoteTitle(title);
        if (isNoteDeleted(cleanTitle)) {
          el.remove();
          return;
        }
        const meta = getNoteMeta(cleanTitle);
        const titleEl = $(".pin-title, .note-title", el) || (el.matches("[data-note-open]") ? $("span", el) : null);
        if (titleEl) {
          if (meta.icon) titleEl.dataset.noteIcon = meta.icon;
          else delete titleEl.dataset.noteIcon;
        }
        if (meta.accent) {
          el.dataset.noteAccent = "true";
          el.style.setProperty("--note-accent", meta.accent);
        } else {
          delete el.dataset.noteAccent;
          el.style.removeProperty("--note-accent");
        }
        if (meta.bg) {
          el.dataset.noteBg = "true";
          el.style.setProperty("--note-bg", meta.bg);
        } else {
          delete el.dataset.noteBg;
          el.style.removeProperty("--note-bg");
        }
        const tagEl = $(".note-tag, .meta-green", el);
        if (tagEl && Array.isArray(meta.tags) && meta.tags.length) tagEl.textContent = meta.tags.map((tag) => `#${tag}`).join(" ");
      }

      function applyActiveNoteMeta() {
        if (!ui.editSurface) return;
        delete ui.editSurface.dataset.noteBg;
        ui.editSurface.style.removeProperty("--note-bg");
      }

      function ensureNoteMenuButtons(root = document) {
        $$(".pin-card, .note-row", root).forEach((el) => {
          if ($(":scope > .note-menu-button", el)) return;
          const button = document.createElement("button");
          button.className = "note-menu-button";
          button.type = "button";
          button.dataset.noteMenu = "true";
          button.setAttribute("aria-label", `更多操作：${noteTitleFromElement(el) || "笔记"}`);
          button.textContent = "⋯";
          el.appendChild(button);
        });
      }

      function applyNoteCatalogState(root = document) {
        ensureNoteMenuButtons(root);
        $$(".pin-card, .note-row", root).forEach((el) => applyNoteMetaToElement(el, noteTitleFromElement(el)));
        $$("[data-note-open]", root).forEach((el) => {
          if (isNoteDeleted(el.dataset.noteOpen)) el.remove();
          else applyNoteMetaToElement(el, el.dataset.noteOpen);
        });
        refreshStackLabels();
      }

      function firstAvailableNoteTitle(exceptTitle = "") {
        const except = cleanNoteTitle(exceptTitle);
        const titles = [
          ...$$(".pin-title, .note-title").map((el) => cleanNoteTitle(el.textContent)),
          ...$$("[data-note-open]").map((el) => cleanNoteTitle(el.dataset.noteOpen)),
        ].filter((title, index, list) => title && title !== except && !isNoteDeleted(title) && list.indexOf(title) === index);
        return titles[0] || "未命名笔记";
      }

      function noteTitleExists(title) {
        const cleanTitle = cleanNoteTitle(title);
        if (!isNoteDeleted(cleanTitle) && visibleNoteElements(cleanTitle).length) return true;
        return safeStorageGetItem(`loam-note:${cleanTitle}`) !== null;
      }

      function uniqueNoteTitle(baseTitle) {
        const base = cleanNoteTitle(baseTitle);
        let candidate = base;
        let index = 2;
        while (noteTitleExists(candidate)) {
          candidate = `${base} ${index}`;
          index += 1;
        }
        return candidate;
      }

      function storageNoteTitleExists(title) {
        return safeStorageGetItem(`loam-note:${cleanNoteTitle(title)}`) !== null;
      }

      function uniqueStorageNoteTitle(baseTitle) {
        const base = cleanNoteTitle(baseTitle) || "AI 生成笔记";
        let candidate = base;
        let index = 2;
        while (storageNoteTitleExists(candidate) || noteTitleExists(candidate)) {
          candidate = `${base} ${index}`;
          index += 1;
        }
        return candidate;
      }

      function createNewStorageNote(baseTitle, bodyFactory) {
        const title = uniqueStorageNoteTitle(baseTitle);
        const key = noteStorageKey(title);
        if (safeStorageGetItem(key) !== null || noteTitleExists(title)) {
          throw new Error(`新笔记标题仍然冲突：${title}`);
        }
        const body = typeof bodyFactory === "function" ? String(bodyFactory(title) || "") : String(bodyFactory || "");
        safeStorageSetItem(key, body);
        if (safeStorageGetItem(key) !== body) {
          throw new Error(`新笔记写入校验失败：${title}`);
        }
        saveNoteMetaTitle(title, { createdAt: Date.now(), updatedAt: Date.now() }, { render: false });
        invalidateNoteKeysCache();
        return { title, body, key };
      }

      function createVisibleNoteRow(title, tag = "写作") {
        const existingMeta = getNoteMeta(title);
        saveNoteMetaTitle(title, {
          tags: [...new Set([...(existingMeta.tags || []), tag].filter(Boolean))],
          updatedAt: Date.now(),
          createdAt: existingMeta.createdAt || stableNoteCreatedAt(title),
        }, { render: false });
        renderLocalNoteList();
        return visibleNoteElements(title).find((el) => el.classList.contains("note-row")) || null;
      }

      function ensurePinnedCard(title) {
        renderLocalNoteList();
        return visibleNoteElements(title).find((el) => el.classList.contains("note-row")) || null;
      }

      function focusVisibleNote(title) {
        const target = visibleNoteElements(title).find((el) => !el.hidden) || null;
        if (!target) return false;
        $$(".note-context-target").forEach((el) => el.classList.remove("note-context-target"));
        if (target.classList.contains("note-row")) setActive(".note-row", target);
        if (target.classList.contains("pin-card")) setActive(".pin-card", target);
        target.classList.add("note-context-target");
